<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수학 다시 시작하기 — 삼각함수 · 벡터 · 미분 · 미적분</title>
<meta name="description" content="수학을 처음부터 다시 시작하는 사람을 위한 개념·예제·문제 학습 사이트. 힌트와 해설이 모두 들어 있습니다.">
<style>*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f7f6f3; --panel:#ffffff; --panel-2:#fbfaf8; --ink:#1f2430; --ink-2:#4b5563;
  --ink-3:#7b8496; --line:#e6e3dd; --line-2:#f0eeea; --accent:#1f2430;
  --ok:#0f7a52; --ok-bg:#e8f6ef; --no:#b42318; --no-bg:#fdeceb;
  --hint:#8a5a00; --hint-bg:#fdf4e3; --shadow:0 1px 2px rgba(31,36,48,.05),0 8px 24px rgba(31,36,48,.06);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#14161c; --panel:#1c1f27; --panel-2:#20242d; --ink:#e8eaef; --ink-2:#b3bac7;
  --ink-3:#8790a0; --line:#2c313c; --line-2:#252932;
  --ok:#5ad39c; --ok-bg:#122c22; --no:#ff8f85; --no-bg:#331b19;
  --hint:#e7bd6a; --hint-bg:#2e2617; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15.5px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{line-height:1.35;margin:0}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:288px 1fr;min-height:100vh}
.sidebar{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden
}
.side-head{padding:18px 18px 12px;border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand .mark{
  width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--panel);
  display:grid;place-items:center;font-size:14px;font-weight:800;flex:none
}
.brand-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;font-weight:500;letter-spacing:.01em}
.side-search{margin-top:12px;position:relative}
.side-search input{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel-2);color:var(--ink);font-size:13.5px;outline:none
}
.side-search input:focus{border-color:var(--ink-3)}
.side-scroll{flex:1;overflow-y:auto;padding:10px 10px 28px}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;
  border-radius:9px;font-size:13.8px;color:var(--ink-2);font-weight:600
}
.nav-item:hover{background:var(--panel-2)}
.nav-item.active{background:var(--ink);color:var(--panel)}
.course-head{
  display:flex;align-items:center;gap:8px;padding:14px 10px 6px;font-size:11.5px;
  font-weight:800;letter-spacing:.06em;color:var(--ink-3);text-transform:none
}
.course-head .bar{width:3px;height:13px;border-radius:2px;background:var(--tone,#999)}
.unit-btn{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:7px 10px;
  border-radius:9px;font-size:13.6px;color:var(--ink-2);line-height:1.5
}
.unit-btn:hover{background:var(--panel-2)}
.unit-btn.active{background:var(--panel-2);color:var(--ink);font-weight:700;box-shadow:inset 2px 0 0 var(--tone,#999)}
.dot{width:8px;height:8px;border-radius:50%;border:1.6px solid var(--line);flex:none;margin-top:7px}
.dot.seen{background:var(--line);border-color:var(--line)}
.dot.part{background:var(--hint);border-color:var(--hint)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.side-foot{border-top:1px solid var(--line-2);padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap}
.mini{
  font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--panel-2);font-weight:600
}
.mini:hover{border-color:var(--ink-3);color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:11px 30px;display:flex;align-items:center;gap:16px
}
.menu-btn{display:none}
.tb-title{font-size:13.5px;color:var(--ink-3);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-spacer{flex:1}
.prog-wrap{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-3);font-weight:600;flex:none}
.prog-track{width:130px;height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.prog-fill{height:100%;background:var(--ok);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.content{padding:30px 30px 90px;max-width:860px;width:100%;margin:0 auto;flex:1}

/* ---------- generic pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--tone,#888)}
.unit-title{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.tagline{
  font-size:15px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--tone,#999);border-radius:10px;padding:12px 15px;margin-bottom:22px
}
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);padding:4px;border-radius:11px;margin-bottom:22px;width:fit-content}
.tab{padding:7px 16px;border-radius:8px;font-size:13.8px;font-weight:700;color:var(--ink-3)}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.sec{margin-bottom:20px;padding:20px 22px}
.sec h3{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sec h3 .n{
  width:20px;height:20px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:var(--ink-3);flex:none
}
.sec p{margin:0 0 9px}
.sec p:last-child{margin-bottom:0}
strong{font-weight:800;color:var(--ink)}
.figure{display:flex;justify-content:center;padding:14px;margin-bottom:20px}
.figure svg{max-width:100%;height:auto}

.formula-grid{display:grid;gap:10px;margin-bottom:20px}
.formula{
  display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;
  padding:13px 18px;background:var(--panel);border:1px solid var(--line);border-radius:11px
}
.formula .fname{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.formula .fbody{font-family:"Cambria Math","Latin Modern Math","Times New Roman",Georgia,serif;font-size:17px;letter-spacing:.01em}
.mtable{width:100%;border-collapse:collapse;font-size:14.5px;margin-bottom:20px;overflow:hidden;border-radius:11px;border:1px solid var(--line)}
.mtable th,.mtable td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line-2)}
.mtable thead th{background:var(--panel-2);font-size:12.5px;color:var(--ink-3);font-weight:700}
.mtable tbody th{background:var(--panel-2);font-weight:700;font-size:13px}
.mtable tr:last-child td,.mtable tr:last-child th{border-bottom:none}
.callout{
  padding:15px 18px;border-radius:11px;background:var(--hint-bg);border:1px solid var(--line);border-color:color-mix(in srgb,var(--hint) 30%,transparent);
  margin-bottom:20px
}
.callout .lab{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--hint);margin-bottom:5px}

/* ---------- example ---------- */
.ex-q{font-size:16px;font-weight:700;padding:18px 20px;margin-bottom:14px}
.step{display:flex;gap:13px;padding:12px 18px;margin-bottom:8px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.step .sn{
  width:22px;height:22px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--ink-3);flex:none;margin-top:2px
}
.ans-box{padding:15px 20px;border-radius:11px;background:var(--ok-bg);border:1px solid var(--line);border-color:color-mix(in srgb,var(--ok) 30%,transparent);font-weight:700}
.ans-box .lab{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ok);margin-bottom:4px}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qcount{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.qdots{display:flex;gap:5px;flex-wrap:wrap;max-width:420px}
.qdots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.qdots i.cur{background:var(--ink-3);transform:scale(1.35)}
.qdots i.ok{background:var(--ok)}
.qdots i.no{background:var(--no)}
.qbox{padding:22px 24px;margin-bottom:14px}
.qtext{font-size:17px;font-weight:700;line-height:1.7;margin-bottom:18px}
.choices{display:grid;gap:8px}
.choice{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:13px 16px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);
  font-size:15.5px;transition:border-color .15s,background .15s
}
.choice:hover:not(:disabled){border-color:var(--ink-3);background:var(--panel-2)}
.choice .lb{
  width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--ink-3);margin-top:1px
}
.choice.sel{border-color:var(--ink);background:var(--panel-2)}
.choice.sel .lb{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ok .lb{background:var(--ok);color:#fff;border-color:var(--ok)}
.choice.no{border-color:var(--no);background:var(--no-bg)}
.choice.no .lb{background:var(--no);color:#fff;border-color:var(--no)}
.choice:disabled{cursor:default}
.qbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{
  padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;
  background:var(--ink);color:var(--panel);border:1.5px solid var(--ink)
}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink);opacity:1}
.btn.warm{background:var(--hint-bg);color:var(--hint);border-color:color-mix(in srgb,var(--hint) 35%,transparent)}
.hintbox{
  padding:13px 17px;border-radius:11px;background:var(--hint-bg);
  border:1px solid var(--line);border-color:color-mix(in srgb,var(--hint) 28%,transparent);margin-top:10px;font-size:14.5px
}
.hintbox .lab{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--hint);margin-bottom:3px}
.verdict{padding:16px 20px;border-radius:11px;margin-top:14px;border:1px solid transparent}
.verdict.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.verdict.no{background:var(--no-bg);border-color:color-mix(in srgb,var(--no) 30%,transparent)}
.verdict .vt{font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.verdict.ok .vt{color:var(--ok)}
.verdict.no .vt{color:var(--no)}
.verdict .sol{color:var(--ink-2);font-size:14.8px}

.result{padding:30px 26px;text-align:center}
.score{font-size:44px;font-weight:800;letter-spacing:-.03em;margin-bottom:2px}
.score small{font-size:20px;color:var(--ink-3);font-weight:700}
.result .msg{color:var(--ink-2);margin-bottom:20px}
.result .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- home ---------- */
.hero{padding:34px 30px;margin-bottom:22px}
.hero h1{font-size:31px;font-weight:800;letter-spacing:-.025em;margin-bottom:10px}
.hero p{color:var(--ink-2);margin:0 0 6px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0}
.stat{padding:16px 18px;text-align:left}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:1px}
.sec-title{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--ink-3);margin:26px 0 11px}
.course-card{padding:18px 20px;margin-bottom:11px;display:block;width:100%;text-align:left}
.course-card:hover{border-color:var(--ink-3)}
.cc-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cc-top .bar{width:3px;height:15px;border-radius:2px;background:var(--tone)}
.cc-name{font-weight:800;font-size:16px}
.cc-sub{font-size:12.5px;color:var(--ink-3);font-weight:600}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:12.5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--panel-2);font-weight:600
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip .cdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:var(--line);vertical-align:1px}
.chip .cdot.seen{background:var(--ink-3)}
.chip .cdot.part{background:var(--hint)}
.chip .cdot.done{background:var(--ok)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}

/* ---------- math ---------- */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em;line-height:1.2}
.frac>.num{padding:0 .35em;border-bottom:1.3px solid currentColor}
.frac>.den{padding:0 .35em}
.fbody .frac{font-size:.95em}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:290px;z-index:60;
    transform:translateX(-100%);transition:transform .25s ease;height:100vh
  }
  body.nav-open .sidebar{transform:translateX(0)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
  body.nav-open .scrim{display:block}
  .menu-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);flex:none}
  .topbar{padding:10px 16px}
  .content{padding:22px 16px 80px}
  .formula{grid-template-columns:1fr;gap:5px}
  .unit-title{font-size:23px}
  .hero{padding:26px 20px}
  .hero h1{font-size:25px}
  .prog-track{width:78px}
}

sup,sub{font-size:.72em;line-height:0;font-weight:inherit}
</style>
</head>
<body>
<div class="scrim" data-act="scrim"></div>
<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand"><span class="mark">∫</span><span>수학 다시 시작하기<div class="brand-sub">개념 · 예제 · 문제 풀이</div></span></div>
      <div class="side-search"><input id="search" type="search" placeholder="단원 검색 (예: 내적, 극한)" autocomplete="off"></div>
    </div>
    <nav class="side-scroll" id="navList"></nav>
    <div class="side-foot">
      <button class="mini" data-act="theme">🌙 어둡게</button>
      <button class="mini" data-act="export">내보내기</button>
      <button class="mini" data-act="import">불러오기</button>
      <button class="mini" data-act="reset">초기화</button>
      <input type="file" id="fileIn" accept="application/json,.json" hidden>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" data-act="menu" aria-label="메뉴">☰</button>
      <div class="tb-title" id="tbTitle"></div>
      <div class="tb-spacer"></div>
      <div class="prog-wrap">
        <span id="progText">0 / 0 문제</span>
        <span class="prog-track"><span class="prog-fill" id="progFill" style="width:0%"></span></span>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<script>window.__COURSES__ = [{"id":"math1","title":"수학Ⅰ","subtitle":"삼각함수","tone":"#c2410c","units":[{"id":"t1","title":"일반각과 호도법(라디안)","tagline":"각도를 「돌아간 양」으로 보는 법을 배웁니다. 그리고 각도의 새로운 단위인 라디안을 익힙니다.","concept":[{"t":"10살에게 설명하면","b":"시계 바늘을 생각해 보세요. 한 바퀴 돌면 360°입니다. 그런데 **한 바퀴를 넘겨서** 계속 돌 수도 있죠? 한 바퀴 반을 돌면 540°입니다. 반대로 거꾸로 돌면 마이너스 각이 됩니다. 이렇게 「몇 바퀴 돌았는지까지 포함한 각」을 **일반각**이라고 합니다."},{"t":"일반각의 정확한 정의","b":"고정된 반직선 OX(시초선)에서 출발해 반직선 OP(동경)가 회전한 각을 생각합니다. ∠XOP = α° 라면, 같은 자리에 놓이는 모든 각은 **360° × n + α°** (n은 정수)로 쓸 수 있습니다. 이것이 일반각입니다. 시계 반대 방향이 양(+), 시계 방향이 음(−)입니다."},{"t":"동경이 어느 사분면에 있나?","b":"각이 아무리 커도 360°로 나눈 **나머지**만 보면 됩니다. 예를 들어 1000° = 360°×2 + 280° 이므로, 1000°는 280°와 같은 자리, 즉 제4사분면의 각입니다."},{"t":"호도법 — 각도의 또 다른 단위","b":"「1 라디안」은 어렵지 않습니다. 반지름이 r인 원에서 **길이가 r인 호**를 잘랐을 때, 그 호가 중심에서 벌어진 각이 1 라디안입니다. 즉 반지름과 호의 길이가 같아지는 각이죠.\n\n핵심 관계는 딱 하나만 외우면 됩니다: **180° = π 라디안**. 여기서 1 라디안 ≈ 57.3° 가 나옵니다."},{"t":"왜 굳이 라디안을 쓰나요?","b":"라디안을 쓰면 호의 길이가 그냥 **rθ** 로 딱 떨어지고, 나중에 미적분에서 (sin x)′ = cos x 같은 깔끔한 공식이 성립합니다. 도(°)를 쓰면 여기에 π/180 같은 지저분한 상수가 계속 붙습니다. 고등 수학 이후로는 사실상 라디안이 기본 단위입니다."}],"svg":"<svg viewBox='0 0 320 190' role='img' aria-label='반지름 r 인 원에서 호의 길이가 r 일 때 중심각이 1 라디안'><circle cx='110' cy='95' r='70' fill='none' stroke='#cbd5e1' stroke-width='2'/><path d='M180 95 A70 70 0 0 0 150.9 38.1' fill='none' stroke='#c2410c' stroke-width='5' stroke-linecap='round'/><line x1='110' y1='95' x2='180' y2='95' stroke='#334155' stroke-width='2'/><line x1='110' y1='95' x2='150.9' y2='38.1' stroke='#334155' stroke-width='2'/><path d='M135 95 A25 25 0 0 0 124.6 74.7' fill='none' stroke='#c2410c' stroke-width='2'/><text x='142' y='112' font-size='13' fill='#334155'>r</text><text x='118' y='62' font-size='13' fill='#334155'>r</text><text x='196' y='58' font-size='13' fill='#c2410c'>호의 길이 = r</text><text x='196' y='78' font-size='13' fill='#c2410c'>→ 중심각 = 1 라디안</text><text x='138' y='88' font-size='12' fill='#c2410c'>1</text></svg>","formulas":[{"n":"일반각","f":"360° × n + α°   (n은 정수)"},{"n":"라디안 ↔ 도","f":"180° = π (라디안)"},{"n":"도 → 라디안","f":"x° × [[π|180]]"},{"n":"라디안 → 도","f":"θ × [[180|π]]"},{"n":"부채꼴의 호의 길이","f":"l = rθ    (θ는 라디안!)"},{"n":"부채꼴의 넓이","f":"S = [[1|2]] r²θ = [[1|2]] r l"}],"mistake":"부채꼴 공식 l = rθ, S = ½r²θ 는 **θ가 라디안일 때만** 성립합니다. 60° 같은 도(°) 값을 그대로 넣으면 답이 완전히 틀립니다. 반드시 π/3 처럼 라디안으로 바꾼 뒤 넣으세요.","example":{"q":"반지름이 6, 중심각이 60°인 부채꼴의 호의 길이와 넓이를 구하시오.","steps":["먼저 각을 라디안으로 바꿉니다. 60° × π/180 = π/3.","호의 길이: l = rθ = 6 × π/3 = 2π.","넓이: S = ½ r l = ½ × 6 × 2π = 6π. (S = ½r²θ = ½ × 36 × π/3 = 6π 로 해도 같습니다.)"],"a":"호의 길이 2π, 넓이 6π"},"quiz":[{"q":"150°를 호도법(라디안)으로 나타내면?","c":["[[π|6]]","[[2π|3]]","[[3π|4]]","[[5π|6]]","[[7π|6]]"],"a":3,"h":["180° = π 라는 것만 쓰면 됩니다. 150°는 180°의 몇 배일까요?","150/180 을 약분해 보세요. 그 값에 π를 곱하면 끝입니다."],"s":"150° × π/180 = 150π/180. 분자·분모를 30으로 약분하면 **5π/6** 입니다."},{"q":"1000°의 동경은 제몇 사분면에 있는가?","c":["제1사분면","제2사분면","제3사분면","제4사분면","좌표축 위"],"a":3,"h":["360°로 몇 바퀴를 돌았는지 빼내고, 남은 각만 보면 됩니다.","1000 ÷ 360 의 몫은 2, 나머지는 280 입니다. 280°는 270°와 360° 사이죠."],"s":"1000° = 360° × 2 + 280°. 즉 두 바퀴를 다 돌고 280° 더 간 자리입니다. 270° < 280° < 360° 이므로 **제4사분면**입니다."},{"q":"반지름이 6, 중심각이 π/3 인 부채꼴의 호의 길이는?","c":["π","2π","3π","6π","12π"],"a":1,"h":["l = rθ 를 쓰면 됩니다. 이미 라디안으로 주어졌으니 변환은 필요 없습니다.","6 × π/3 을 계산하세요."],"s":"l = rθ = 6 × π/3 = **2π** 입니다."},{"q":"반지름이 4, 중심각이 π/2 인 부채꼴의 넓이는?","c":["2π","4π","8π","16π","[[π|2]]"],"a":1,"h":["S = ½ r²θ 공식을 씁니다.","½ × 4² × π/2 = ½ × 16 × π/2 를 계산해 보세요."],"s":"S = ½ r²θ = ½ × 16 × π/2 = **4π** 입니다. (중심각 π/2는 90°, 즉 원의 ¼이므로 16π ÷ 4 = 4π 로 확인해도 같습니다.)"},{"q":"반지름이 5이고 호의 길이가 10인 부채꼴의 넓이는?","c":["10","20","25","50","25π"],"a":2,"h":["중심각을 몰라도 되는 공식이 하나 있습니다. S = ½ r l.","½ × 5 × 10 을 계산하세요. 답에 π는 붙지 않습니다."],"s":"S = ½ r l = ½ × 5 × 10 = **25**. (θ = l/r = 2 라디안을 구해 S = ½ × 25 × 2 = 25 로 계산해도 같습니다.) 호의 길이가 이미 주어졌으므로 π는 등장하지 않습니다."}]},{"id":"t2","title":"삼각함수의 정의","tagline":"sin, cos, tan 은 사실 「원 위의 점의 좌표」입니다.","concept":[{"t":"10살에게 설명하면","b":"반지름이 1인 원(단위원)을 그리고, 원 위를 걸어 다니는 점 P를 생각하세요. 원점에서 출발한 각이 θ일 때 그 점 P가 있는 자리의 **가로 좌표가 cos θ**, **세로 좌표가 sin θ** 입니다. 즉 sin과 cos은 어려운 기호가 아니라 그냥 「좌표를 부르는 이름」입니다."},{"t":"정확한 정의","b":"각 θ의 동경이 원점 중심, 반지름 r인 원과 만나는 점을 P(x, y)라 하면\nsin θ = y/r,  cos θ = x/r,  tan θ = y/x (단 x ≠ 0)\n입니다. r = 1 인 단위원이면 sin θ = y, cos θ = x 로 더 단순해집니다."},{"t":"사분면별 부호 — ASTC","b":"좌표의 부호만 따라가면 됩니다. 제1사분면은 x>0, y>0 이니 셋 다 양수. 제2사분면은 y만 양수라 **sin만** 양수. 제3사분면은 x<0, y<0 이라 둘을 나눈 tan만 양수. 제4사분면은 x만 양수라 **cos만** 양수.\n\n제1→2→3→4 순서로 **A(All) → S(Sin) → T(Tan) → C(Cos)**, 「얼싸안고」로 외우기도 합니다."},{"t":"특수각은 외워두면 평생 씁니다","b":"0, π/6(30°), π/4(45°), π/3(60°), π/2(90°) 다섯 개의 값만 알면 시험 문제의 대부분이 풀립니다. sin은 0 → ½ → √2/2 → √3/2 → 1 로 커지고, cos은 정확히 그 반대 순서입니다."}],"table":{"head":["θ","0","π/6 (30°)","π/4 (45°)","π/3 (60°)","π/2 (90°)"],"rows":[["sin θ","0","[[1|2]]","[[√2|2]]","[[√3|2]]","1"],["cos θ","1","[[√3|2]]","[[√2|2]]","[[1|2]]","0"],["tan θ","0","[[√3|3]]","1","√3","없음"]]},"svg":"<svg viewBox='0 0 300 210' role='img' aria-label='단위원 위의 점 P의 좌표가 코사인, 사인'><line x1='20' y1='105' x2='285' y2='105' stroke='#cbd5e1' stroke-width='1.5'/><line x1='150' y1='15' x2='150' y2='198' stroke='#cbd5e1' stroke-width='1.5'/><circle cx='150' cy='105' r='72' fill='none' stroke='#94a3b8' stroke-width='2'/><line x1='150' y1='105' x2='201' y2='54' stroke='#c2410c' stroke-width='2.5'/><line x1='201' y1='54' x2='201' y2='105' stroke='#0891b2' stroke-width='2' stroke-dasharray='4 3'/><line x1='150' y1='105' x2='201' y2='105' stroke='#7c3aed' stroke-width='3'/><circle cx='201' cy='54' r='4.5' fill='#c2410c'/><text x='207' y='48' font-size='12' fill='#c2410c'>P(cos θ, sin θ)</text><text x='206' y='84' font-size='12' fill='#0891b2'>sin θ</text><text x='158' y='122' font-size='12' fill='#7c3aed'>cos θ</text><path d='M172 105 A22 22 0 0 0 165.5 89.5' fill='none' stroke='#334155' stroke-width='1.5'/><text x='174' y='97' font-size='12' fill='#334155'>θ</text><text x='226' y='120' font-size='11' fill='#64748b'>반지름 1</text></svg>","formulas":[{"n":"반지름 r 인 원에서","f":"sin θ = [[y|r]],  cos θ = [[x|r]],  tan θ = [[y|x]]"},{"n":"단위원(r = 1)에서","f":"cos θ = x,  sin θ = y"},{"n":"사분면 부호","f":"1사분면 : 전부 +   2사분면 : sin만 +   3사분면 : tan만 +   4사분면 : cos만 +"}],"mistake":"「sin은 세로, cos은 가로」를 반대로 외우는 실수가 가장 많습니다. **s**in은 **세**로(y), **c**os는 가**로**(x) 로 기억하세요. 또 r은 항상 양수(길이)이므로 부호는 x, y가 결정합니다.","example":{"q":"원점 O와 점 P(−3, 4)를 지나는 동경이 나타내는 각을 θ라 할 때 sin θ, cos θ, tan θ 를 구하시오.","steps":["r = OP = √((−3)² + 4²) = √(9 + 16) = √25 = 5. (r은 길이이므로 항상 양수)","sin θ = y/r = 4/5","cos θ = x/r = −3/5","tan θ = y/x = 4/(−3) = −4/3"],"a":"sin θ = 4/5, cos θ = −3/5, tan θ = −4/3"},"quiz":[{"q":"원점 O와 점 P(−3, 4)를 지나는 동경이 나타내는 각을 θ라 할 때, sin θ 의 값은?","c":["[[3|5]]","[[4|5]]","−[[3|5]]","−[[4|5]]","−[[4|3]]"],"a":1,"h":["먼저 원점에서 P까지의 거리 r 을 구하세요. r = √(x² + y²) 입니다.","sin θ = y/r 입니다. y = 4, r = 5."],"s":"r = √((−3)² + 4²) = 5 입니다. sin θ = y/r = **4/5**. y가 양수이므로 sin도 양수입니다(제2사분면 → sin만 양수)."},{"q":"θ가 제3사분면의 각일 때, 다음 중 항상 옳은 것은?","c":["sin θ > 0","cos θ > 0","tan θ > 0","sin θ cos θ < 0","tan θ < 0"],"a":2,"h":["제3사분면에서는 x < 0, y < 0 입니다. 각각의 부호를 직접 따져 보세요.","tan θ = y/x 인데, 음수를 음수로 나누면 부호는 어떻게 되나요?"],"s":"제3사분면은 x < 0, y < 0 이므로 sin θ = y/r < 0, cos θ = x/r < 0 입니다. 그런데 tan θ = y/x 는 (음수)÷(음수)이므로 **tan θ > 0**. sin θ cos θ 는 (음)×(음) = 양수이므로 「sin θ cos θ < 0」도 틀립니다."},{"q":"sin [[π|3]] 의 값은?","c":["[[1|2]]","[[√2|2]]","[[√3|2]]","1","√3"],"a":2,"h":["π/3 은 60°입니다. 특수각 표를 떠올려 보세요.","sin 값은 0 → ½ → √2/2 → √3/2 → 1 순으로 커집니다. 60°는 네 번째 자리입니다."],"s":"π/3 = 60° 이고 sin 60° = **√3/2** 입니다. (참고: cos 60° = ½, tan 60° = √3)"},{"q":"θ가 제3사분면의 각이고 tan θ = [[3|4]] 일 때, sin θ 의 값은?","c":["[[3|5]]","[[4|5]]","−[[3|5]]","−[[4|5]]","−[[3|4]]"],"a":2,"h":["tan θ = y/x = 3/4 이므로 (x, y) = (4, 3) 또는 (−4, −3) 을 생각할 수 있습니다. 제3사분면이면 어느 쪽일까요?","제3사분면이므로 (x, y) = (−4, −3). r = 5 입니다. sin θ = y/r 을 계산하세요."],"s":"tan θ = 3/4 이고 제3사분면이므로 x = −4, y = −3 으로 잡을 수 있습니다. r = √(16 + 9) = 5 이므로 sin θ = y/r = **−3/5** 입니다. 제3사분면에서 sin이 음수인 것과도 일치합니다."}]},{"id":"t3","title":"삼각함수 사이의 관계와 각의 변환","tagline":"sin²θ + cos²θ = 1 하나로 대부분의 계산이 연결됩니다.","concept":[{"t":"10살에게 설명하면","b":"단위원 위의 점은 (cos θ, sin θ) 였죠? 그런데 이 점은 원점에서 거리가 1입니다. 피타고라스 정리로 쓰면 (가로)² + (세로)² = 1², 즉 **cos²θ + sin²θ = 1**. 이 유명한 공식은 사실 피타고라스 정리 그 자체입니다."},{"t":"세 가지 기본 관계","b":"① sin²θ + cos²θ = 1 (피타고라스)\n② tan θ = sin θ / cos θ (정의에서 바로)\n③ 1 + tan²θ = 1/cos²θ (①의 양변을 cos²θ로 나눈 것)\n\n③은 따로 외우지 않아도 ①에서 즉시 만들 수 있습니다."},{"t":"각의 변환 — 규칙은 두 줄뿐","b":"복잡해 보이지만 요령이 있습니다.\n**규칙 1**: π 또는 2π 를 더하거나 뺀 각(π ± θ, 2π ± θ)은 **함수 이름이 그대로**입니다.\n**규칙 2**: π/2 나 3π/2 가 섞이면 **sin ↔ cos 이 서로 바뀝니다**.\n부호는 「θ를 예각(1사분면)이라 가정했을 때 원래 각이 몇 사분면에 있는가」로 정합니다."},{"t":"자주 쓰는 변환 정리","b":"sin(−θ) = −sin θ,  cos(−θ) = cos θ,  tan(−θ) = −tan θ\nsin(π − θ) = sin θ,  cos(π − θ) = −cos θ\nsin(π + θ) = −sin θ,  cos(π + θ) = −cos θ\nsin(π/2 − θ) = cos θ,  cos(π/2 − θ) = sin θ"}],"formulas":[{"n":"피타고라스 관계","f":"sin²θ + cos²θ = 1"},{"n":"탄젠트의 정의","f":"tan θ = [[sin θ|cos θ]]"},{"n":"따라 나오는 식","f":"1 + tan²θ = [[1|cos²θ]]"},{"n":"합·곱 연결","f":"(sin θ + cos θ)² = 1 + 2 sin θ cos θ"}],"mistake":"sin²θ 는 (sin θ)² 를 줄여 쓴 것입니다. sin(θ²) 이 **아닙니다**. 또 √(sin²θ) = |sin θ| 이므로, 제곱근을 벗길 때는 반드시 사분면을 보고 부호를 정해야 합니다.","example":{"q":"sin θ + cos θ = 1/2 일 때, sin θ cos θ 의 값을 구하시오.","steps":["양변을 제곱합니다: (sin θ + cos θ)² = (1/2)² = 1/4","좌변을 전개: sin²θ + 2 sin θ cos θ + cos²θ = 1/4","sin²θ + cos²θ = 1 이므로 1 + 2 sin θ cos θ = 1/4","2 sin θ cos θ = 1/4 − 1 = −3/4  →  sin θ cos θ = −3/8"],"a":"−3/8"},"quiz":[{"q":"θ가 제2사분면의 각이고 sin θ = [[3|5]] 일 때, cos θ 의 값은?","c":["[[4|5]]","−[[4|5]]","[[3|4]]","−[[3|4]]","−[[5|4]]"],"a":1,"h":["sin²θ + cos²θ = 1 에 넣어 cos²θ 를 먼저 구하세요.","cos²θ = 16/25 이므로 cos θ = ±4/5. 제2사분면에서 cos의 부호는 무엇일까요?"],"s":"cos²θ = 1 − (3/5)² = 1 − 9/25 = 16/25 이므로 cos θ = ±4/5 입니다. θ가 제2사분면이면 cos θ < 0 이므로 답은 **−4/5** 입니다."},{"q":"sin θ + cos θ = [[1|2]] 일 때, sin θ cos θ 의 값은?","c":["[[3|8]]","−[[3|8]]","[[1|4]]","−[[1|4]]","−[[3|4]]"],"a":1,"h":["합이 주어졌으니 양변을 제곱해 보세요.","(sin θ + cos θ)² = 1 + 2 sin θ cos θ 입니다. 이 값이 1/4 입니다."],"s":"양변을 제곱하면 1 + 2 sin θ cos θ = 1/4 이므로 2 sin θ cos θ = −3/4, 따라서 sin θ cos θ = **−3/8** 입니다. (곱이 음수라는 것은 θ가 제2 또는 제4사분면의 각임을 뜻합니다.)"},{"q":"cos(π − θ) 를 간단히 하면?","c":["cos θ","−cos θ","sin θ","−sin θ","tan θ"],"a":1,"h":["π가 섞였으므로 함수 이름은 그대로 cos 입니다. 남은 것은 부호뿐입니다.","θ를 예각이라 하면 π − θ 는 제2사분면의 각입니다. 제2사분면에서 cos의 부호는?"],"s":"π ± θ 형태이므로 이름은 cos 그대로. θ를 예각으로 두면 π − θ 는 제2사분면이고, 그곳에서 cos은 음수이므로 **−cos θ** 입니다."},{"q":"sin 150° 의 값은?","c":["[[1|2]]","−[[1|2]]","[[√3|2]]","−[[√3|2]]","[[√2|2]]"],"a":0,"h":["150° = 180° − 30° 으로 쪼개 보세요.","sin(180° − θ) = sin θ 입니다. 즉 sin 150° = sin 30°."],"s":"sin 150° = sin(180° − 30°) = sin 30° = **1/2** 입니다. 150°는 제2사분면의 각이고 그곳에서 sin은 양수이므로 부호도 맞습니다."}]},{"id":"t4","title":"삼각함수의 그래프","tagline":"y = a sin(bx) + d 에서 a는 「높이」, b는 「빨리 반복되는 정도」, d는 「위아래 이동」입니다.","concept":[{"t":"10살에게 설명하면","b":"관람차를 타고 빙글빙글 돈다고 상상하세요. 시간에 따라 내 **높이**를 그래프로 그리면 위아래로 출렁이는 물결 모양이 나옵니다. 이게 바로 sin 그래프입니다. 계속 같은 모양이 반복되므로 **주기함수**라고 부릅니다."},{"t":"y = sin x 와 y = cos x","b":"둘 다 주기 2π, 최댓값 1, 최솟값 −1 입니다. 모양도 똑같고 위치만 다릅니다 — cos 그래프를 오른쪽으로 π/2 밀면 sin 그래프가 됩니다.\ny = sin x 는 원점에 대해 대칭(기함수), y = cos x 는 y축에 대해 대칭(우함수)입니다."},{"t":"y = tan x","b":"주기가 **π**로 다릅니다. 최댓값·최솟값이 없고 값이 실수 전체를 훑습니다. x = π/2 + nπ 에서 정의되지 않아 그 자리에 세로 점근선이 생깁니다."},{"t":"y = a sin(bx + c) + d 읽는 법","b":"**|a|** = 진폭 (위아래로 얼마나 크게 출렁이나)\n**2π / |b|** = 주기 (얼마 만에 한 번 반복되나). tan은 π / |b|.\n**d** = 위아래 평행이동 → 최댓값 |a| + d, 최솟값 −|a| + d\n**c** = 좌우 평행이동 (bx + c = b(x + c/b) 이므로 왼쪽으로 c/b 만큼)"}],"svg":"<svg viewBox='0 0 340 160' role='img' aria-label='사인 그래프와 코사인 그래프'><line x1='20' y1='80' x2='325' y2='80' stroke='#cbd5e1' stroke-width='1.5'/><line x1='30' y1='18' x2='30' y2='145' stroke='#cbd5e1' stroke-width='1.5'/><path d='M30 80 Q68 20 106 80 T182 80 T258 80 T314 80' fill='none' stroke='#c2410c' stroke-width='2.5'/><path d='M30 30 Q49 30 68 80 T106 130 Q125 130 144 80 T182 30 Q201 30 220 80 T258 130 Q277 130 296 80 T314 42' fill='none' stroke='#0891b2' stroke-width='2.5' stroke-dasharray='5 4'/><text x='250' y='34' font-size='12' fill='#c2410c'>y = sin x</text><text x='250' y='150' font-size='12' fill='#0891b2'>y = cos x</text><text x='100' y='96' font-size='11' fill='#64748b'>π</text><text x='176' y='96' font-size='11' fill='#64748b'>2π</text><text x='18' y='34' font-size='11' fill='#64748b'>1</text><text x='16' y='134' font-size='11' fill='#64748b'>−1</text></svg>","formulas":[{"n":"y = a sin(bx + c) + d","f":"진폭 |a|,  주기 [[2π||b|]],  최대 |a| + d,  최소 −|a| + d"},{"n":"y = a cos(bx + c) + d","f":"위와 완전히 동일"},{"n":"y = a tan(bx + c) + d","f":"주기 [[π||b|]],  최대·최소 없음"},{"n":"대칭성","f":"sin(−x) = −sin x (원점대칭),  cos(−x) = cos x (y축대칭)"}],"mistake":"주기를 구할 때 계수 b를 **곱하는** 실수가 잦습니다. y = sin 2x 의 주기는 2 × 2π = 4π 가 아니라 2π ÷ 2 = **π** 입니다. b가 클수록 더 빨리 반복되니 주기는 짧아진다고 생각하면 헷갈리지 않습니다.","example":{"q":"함수 y = 3 sin(2x) − 1 의 주기, 최댓값, 최솟값을 구하시오.","steps":["a = 3, b = 2, d = −1 입니다.","주기 = 2π / |b| = 2π / 2 = π","sin의 값은 −1 이상 1 이하이므로 3 sin 2x 는 −3 이상 3 이하.","여기에 −1 을 더하면 최댓값 3 − 1 = 2, 최솟값 −3 − 1 = −4"],"a":"주기 π, 최댓값 2, 최솟값 −4"},"quiz":[{"q":"함수 y = 3 sin 2x 의 주기는?","c":["[[π|2]]","π","2π","3π","4π"],"a":1,"h":["주기는 2π ÷ |x의 계수| 입니다. 앞의 3(진폭)은 주기와 상관이 없습니다.","2π ÷ 2 를 계산하세요."],"s":"주기 = 2π / |b| = 2π / 2 = **π** 입니다. 앞의 계수 3은 진폭(높이)만 바꿀 뿐 주기에는 영향을 주지 않습니다."},{"q":"함수 y = 2 cos [[x|3]] 의 주기는?","c":["[[2π|3]]","2π","3π","6π","[[π|3]]"],"a":3,"h":["x의 계수 b는 1/3 입니다. 주기 = 2π ÷ |b|.","2π ÷ (1/3) 은 2π × 3 과 같습니다."],"s":"b = 1/3 이므로 주기 = 2π ÷ (1/3) = **6π** 입니다. 계수가 1보다 작으면 그래프가 옆으로 늘어나 주기가 길어집니다."},{"q":"함수 y = tan 2x 의 주기는?","c":["[[π|4]]","[[π|2]]","π","2π","4π"],"a":1,"h":["tan의 기본 주기는 2π가 아니라 π 입니다. 여기서 시작하세요.","π ÷ |b| = π ÷ 2."],"s":"tan 함수의 주기는 π 이므로 y = tan 2x 의 주기는 π / 2 = **π/2** 입니다. sin, cos과 기본 주기가 다르다는 점을 꼭 구분하세요."},{"q":"함수 y = −3 cos x + 2 의 최댓값은?","c":["2","3","5","−1","−5"],"a":2,"h":["cos x 는 −1 이상 1 이하입니다. 앞에 −3 이 붙으면 범위가 어떻게 바뀌나요?","−3 cos x 는 −3 이상 3 이하입니다. 여기에 2를 더하세요."],"s":"−1 ≤ cos x ≤ 1 이므로 −3 ≤ −3 cos x ≤ 3 입니다. 여기에 2를 더하면 −1 ≤ y ≤ 5. 따라서 최댓값은 **5** (이때 cos x = −1) 입니다. 진폭은 |−3| = 3 이므로 최대 = 3 + 2 = 5 로 바로 계산해도 됩니다."}]},{"id":"t5","title":"사인법칙","tagline":"「변과 마주 보는 각의 sin」의 비는 삼각형 어디서나 같고, 그 값이 외접원 지름입니다.","concept":[{"t":"10살에게 설명하면","b":"삼각형에서 **큰 각 맞은편에는 큰 변**이 있습니다. 당연해 보이죠? 사인법칙은 이 관계를 정확한 식으로 바꾼 것입니다. 각이 커지면 sin도 커지고, 그만큼 마주 보는 변도 길어집니다."},{"t":"정확한 진술","b":"삼각형 ABC의 외접원 반지름을 R이라 하면\n**a / sin A = b / sin B = c / sin C = 2R**\n여기서 a는 각 A와 **마주 보는** 변(즉 변 BC)입니다. 짝을 잘못 맞추는 것이 가장 흔한 실수입니다."},{"t":"언제 쓰나요?","b":"「**한 변과 그 대각**」이 짝으로 주어졌을 때 씁니다. 예를 들어 (a, A)를 알고 B를 알면 b를 구할 수 있습니다. 반대로 두 변과 낀 각이 주어지면 사인법칙이 아니라 코사인법칙을 씁니다."},{"t":"자주 쓰는 변형","b":"a = 2R sin A,  sin A = a / (2R)\n그리고 a : b : c = sin A : sin B : sin C — 변의 비와 sin의 비가 같다는 아주 유용한 결론이 나옵니다."}],"formulas":[{"n":"사인법칙","f":"[[a|sin A]] = [[b|sin B]] = [[c|sin C]] = 2R"},{"n":"변으로 풀기","f":"a = 2R sin A"},{"n":"비례 관계","f":"a : b : c = sin A : sin B : sin C"}],"mistake":"2R 입니다. R이 아닙니다. a / sin A = R 로 잘못 외워서 반지름을 두 배로 계산하는 실수가 매우 흔합니다.","example":{"q":"삼각형 ABC에서 A = 45°, B = 60°, a = √2 일 때 b 의 값을 구하시오.","steps":["사인법칙: a / sin A = b / sin B","√2 / sin 45° = b / sin 60°","sin 45° = √2/2, sin 60° = √3/2 이므로 √2 ÷ (√2/2) = 2. 즉 비의 값은 2.","b = 2 × sin 60° = 2 × √3/2 = √3"],"a":"b = √3"},"quiz":[{"q":"삼각형 ABC에서 A = 30°, a = 4 일 때 외접원의 반지름 R 의 값은?","c":["2","4","6","8","16"],"a":1,"h":["a / sin A = 2R 를 씁니다. sin 30° = 1/2 입니다.","4 ÷ (1/2) = 8 = 2R. 이제 R을 구하세요."],"s":"a / sin A = 2R 이므로 4 / (1/2) = 8 = 2R, 따라서 R = **4** 입니다. 마지막에 2로 나누는 것을 잊지 마세요."},{"q":"삼각형 ABC에서 A = 45°, B = 60°, a = √2 일 때 b 의 값은?","c":["1","√2","√3","2","2√3"],"a":2,"h":["a / sin A = b / sin B 를 세우세요.","√2 / (√2/2) = 2 이므로 b = 2 sin 60° 입니다."],"s":"√2 / sin 45° = √2 ÷ (√2/2) = 2 입니다. 따라서 b = 2 sin 60° = 2 × √3/2 = **√3** 입니다."},{"q":"외접원의 반지름이 5인 삼각형 ABC에서 A = 30° 일 때 a 의 값은?","c":["2.5","5","10","[[5|2]]","5√3"],"a":1,"h":["a = 2R sin A 를 그대로 쓰면 됩니다.","2 × 5 × sin 30° = 10 × 1/2."],"s":"a = 2R sin A = 2 × 5 × (1/2) = **5** 입니다."},{"q":"삼각형 ABC에서 A : B : C = 1 : 2 : 3 일 때 a : b : c 는?","c":["1 : 2 : 3","1 : √2 : √3","1 : √3 : 2","1 : 2 : √3","2 : √3 : 1"],"a":2,"h":["세 각의 합은 180°입니다. 1 : 2 : 3 이면 각각 몇 도인가요?","각은 30°, 60°, 90° 입니다. a : b : c = sin A : sin B : sin C 이므로 sin 30° : sin 60° : sin 90° 를 계산하세요."],"s":"각의 합이 180°이므로 A = 30°, B = 60°, C = 90° 입니다. a : b : c = sin 30° : sin 60° : sin 90° = 1/2 : √3/2 : 1 이고, 전체에 2를 곱하면 **1 : √3 : 2** 입니다. 각의 비가 그대로 변의 비가 되지 **않는다**는 점이 이 문제의 핵심입니다."}]},{"id":"t6","title":"코사인법칙","tagline":"피타고라스 정리를 직각이 아닌 삼각형까지 확장한 공식입니다.","concept":[{"t":"10살에게 설명하면","b":"직각삼각형에서는 a² = b² + c² 였죠. 그런데 각 A가 직각이 아니면 이 식이 틀립니다. 얼마나 틀리는지를 보정해 주는 항이 바로 **−2bc cos A** 입니다. A = 90°이면 cos 90° = 0 이라 보정항이 사라지고 정확히 피타고라스 정리로 돌아옵니다."},{"t":"정확한 진술","b":"a² = b² + c² − 2bc cos A\nb² = c² + a² − 2ca cos B\nc² = a² + b² − 2ab cos C\n\n세 개를 다 외울 필요는 없습니다. 구하려는 변을 좌변에, 나머지 두 변과 그 사이 각을 우변에 놓는다는 **패턴**만 기억하세요."},{"t":"각을 구하는 형태","b":"세 변을 모두 알 때는 식을 각에 대해 정리합니다.\ncos A = (b² + c² − a²) / (2bc)\n결과가 음수면 그 각은 **둔각**입니다. 삼각형에서 둔각은 최대 하나뿐이고, 항상 가장 긴 변의 맞은편에 있습니다."},{"t":"언제 쓰나요? (사인법칙과의 구분)","b":"**두 변과 낀 각(SAS)** → 코사인법칙으로 나머지 변\n**세 변(SSS)** → 코사인법칙으로 각\n**한 변과 그 대각이 짝으로(ASA, AAS)** → 사인법칙\n\n덤으로 넓이 공식 S = ½ bc sin A 도 함께 쓰이는 경우가 많습니다."}],"formulas":[{"n":"코사인법칙 (변 구하기)","f":"a² = b² + c² − 2bc cos A"},{"n":"코사인법칙 (각 구하기)","f":"cos A = [[b² + c² − a²|2bc]]"},{"n":"삼각형의 넓이","f":"S = [[1|2]] bc sin A"},{"n":"헤론의 공식","f":"S = √[s(s−a)(s−b)(s−c)],  s = [[a+b+c|2]]"}],"mistake":"cos A 앞의 부호는 항상 **마이너스**입니다. 그리고 각이 둔각이면 cos A 자체가 음수라, −2bc cos A 는 결국 **더해집니다**. 부호를 두 번 처리해야 하므로 천천히 계산하세요.","example":{"q":"삼각형 ABC에서 b = 3, c = 5, A = 60° 일 때 a 의 값을 구하시오.","steps":["a² = b² + c² − 2bc cos A 에 대입합니다.","a² = 3² + 5² − 2 × 3 × 5 × cos 60°","a² = 9 + 25 − 30 × (1/2) = 34 − 15 = 19","a = √19"],"a":"a = √19"},"quiz":[{"q":"삼각형 ABC에서 b = 3, c = 5, A = 60° 일 때 a 의 값은?","c":["√7","√19","√34","√49","7"],"a":1,"h":["a² = b² + c² − 2bc cos A 에 대입하세요. cos 60° = 1/2 입니다.","9 + 25 − 2 × 3 × 5 × (1/2) = 34 − 15 을 계산하세요."],"s":"a² = 9 + 25 − 30 × (1/2) = 34 − 15 = 19 이므로 a = **√19** 입니다. 마지막에 제곱근을 씌우는 것을 잊지 마세요."},{"q":"삼각형 ABC에서 a = 7, b = 5, c = 3 일 때 각 A 의 크기는?","c":["30°","60°","90°","120°","150°"],"a":3,"h":["세 변을 모두 알고 있으니 cos A = (b² + c² − a²)/(2bc) 를 씁니다.","(25 + 9 − 49) / (2 × 5 × 3) = −15/30 = −1/2. cos 값이 −1/2인 각은?"],"s":"cos A = (25 + 9 − 49)/(2 × 15) = −15/30 = −1/2 이므로 A = **120°** 입니다. a가 가장 긴 변이므로 그 대각 A가 둔각인 것도 자연스럽습니다."},{"q":"삼각형 ABC에서 b = 2, c = 4, A = 120° 일 때 a 의 값은?","c":["2√3","2√5","2√7","√12","6"],"a":2,"h":["cos 120° = −1/2 입니다. 음수를 대입할 때 부호에 주의하세요.","a² = 4 + 16 − 2 × 2 × 4 × (−1/2) = 20 + 8 입니다."],"s":"a² = 2² + 4² − 2 × 2 × 4 × cos 120° = 4 + 16 − 16 × (−1/2) = 20 + 8 = 28 이므로 a = √28 = **2√7** 입니다. cos이 음수라 오히려 더해진다는 점이 포인트입니다."},{"q":"삼각형 ABC에서 b = 4, c = 6, A = 30° 일 때 넓이 S 는?","c":["3","6","12","6√3","12√3"],"a":1,"h":["S = ½ bc sin A 를 씁니다. 여기서는 코사인법칙이 필요 없습니다.","½ × 4 × 6 × sin 30° = 12 × (1/2)."],"s":"S = ½ × 4 × 6 × sin 30° = 12 × 1/2 = **6** 입니다. 두 변과 그 낀 각을 알면 넓이는 코사인법칙 없이 바로 구할 수 있습니다."}]},{"id":"t7","title":"삼각함수의 덧셈정리","tagline":"sin(α + β) 는 sin α + sin β 가 아닙니다. 그 진짜 값을 알려 주는 공식입니다.","concept":[{"t":"10살에게 설명하면","b":"많은 학생이 sin(α + β) = sin α + sin β 라고 착각합니다. 하지만 이건 **완전히 틀렸습니다**. 실제로 두 각을 합친 결과는 sin과 cos이 서로 섞여서 나옵니다. 그 정확한 섞이는 방식이 덧셈정리입니다."},{"t":"덧셈정리 4개","b":"sin(α + β) = sin α cos β + cos α sin β\nsin(α − β) = sin α cos β − cos α sin β\ncos(α + β) = cos α cos β − sin α sin β\ncos(α − β) = cos α cos β + sin α sin β\n\n**sin은 「싸코 코싸」, 부호는 그대로.**\n**cos은 「코코 싸싸」, 부호는 반대.**\n이 두 줄만 기억하면 네 식이 다 나옵니다."},{"t":"탄젠트","b":"tan(α ± β) = (tan α ± tan β) / (1 ∓ tan α tan β)\n분모의 부호가 분자와 **반대**라는 점만 조심하세요."},{"t":"배각 공식 — 덧셈정리의 특별한 경우","b":"β 자리에 α를 그대로 넣으면 배각 공식이 나옵니다.\nsin 2α = 2 sin α cos α\ncos 2α = cos²α − sin²α = 1 − 2 sin²α = 2 cos²α − 1\ntan 2α = 2 tan α / (1 − tan²α)\n\ncos 2α 의 세 가지 형태는 상황에 따라 골라 씁니다. sin만 주어졌으면 1 − 2sin²α, cos만 주어졌으면 2cos²α − 1 이 편합니다."},{"t":"어디에 쓰나요?","b":"75°, 15° 같은 「특수각이 아닌 각」의 값을 특수각의 합·차로 쪼개어 구할 때 씁니다. 예: 75° = 45° + 30°, 15° = 45° − 30°."}],"formulas":[{"n":"사인 덧셈정리","f":"sin(α ± β) = sin α cos β ± cos α sin β"},{"n":"코사인 덧셈정리","f":"cos(α ± β) = cos α cos β ∓ sin α sin β"},{"n":"탄젠트 덧셈정리","f":"tan(α ± β) = [[tan α ± tan β|1 ∓ tan α tan β]]"},{"n":"배각 공식","f":"sin 2α = 2 sin α cos α,   cos 2α = 1 − 2 sin²α"}],"mistake":"cos의 덧셈정리에서 부호가 **뒤집힌다**는 것을 놓치는 실수가 압도적으로 많습니다. cos(α + β) 는 마이너스, cos(α − β) 는 플러스입니다. sin과 정반대라고 세트로 외우세요.","example":{"q":"sin 75° 의 값을 구하시오.","steps":["75° = 45° + 30° 으로 쪼갭니다.","sin(45° + 30°) = sin 45° cos 30° + cos 45° sin 30°","= (√2/2)(√3/2) + (√2/2)(1/2)","= √6/4 + √2/4 = (√6 + √2)/4"],"a":"(√6 + √2)/4"},"quiz":[{"q":"sin 75° 의 값은?","c":["[[√6 − √2|4]]","[[√6 + √2|4]]","[[√3 + 1|2]]","[[√2|2]]","[[√3|2]]"],"a":1,"h":["75°를 특수각의 합으로 쪼개세요. 45° + 30° 입니다.","sin(α+β) = sin α cos β + cos α sin β 에 대입합니다. 부호는 모두 플러스입니다."],"s":"sin 75° = sin 45° cos 30° + cos 45° sin 30° = (√2/2)(√3/2) + (√2/2)(1/2) = √6/4 + √2/4 = **(√6 + √2)/4** 입니다. 참고로 sin 15° 는 같은 방법으로 (√6 − √2)/4 가 됩니다."},{"q":"α, β 가 모두 제1사분면의 각이고 sin α = [[3|5]], cos β = [[5|13]] 일 때 sin(α + β) 의 값은?","c":["[[16|65]]","[[33|65]]","[[56|65]]","[[63|65]]","[[15|65]]"],"a":3,"h":["먼저 cos α 와 sin β 를 구해야 합니다. sin²+cos²=1 을 쓰세요. 둘 다 제1사분면이므로 부호는 모두 양수입니다.","cos α = 4/5, sin β = 12/13 입니다. 이제 sin α cos β + cos α sin β 에 대입하세요."],"s":"cos α = √(1 − 9/25) = 4/5, sin β = √(1 − 25/169) = 12/13 입니다(제1사분면이라 모두 양수).\nsin(α + β) = (3/5)(5/13) + (4/5)(12/13) = 15/65 + 48/65 = **63/65** 입니다."},{"q":"sin α = [[1|3]] 일 때 cos 2α 의 값은?","c":["[[1|9]]","[[7|9]]","[[8|9]]","−[[7|9]]","[[2|3]]"],"a":1,"h":["sin만 주어졌으므로 cos 2α = 1 − 2 sin²α 형태가 가장 편합니다.","1 − 2 × (1/3)² = 1 − 2/9 를 계산하세요."],"s":"cos 2α = 1 − 2 sin²α = 1 − 2 × (1/9) = 1 − 2/9 = **7/9** 입니다. α가 어느 사분면인지 몰라도 답이 하나로 정해진다는 점이 이 형태의 장점입니다."},{"q":"tan α = 2 일 때 tan 2α 의 값은?","c":["4","[[4|3]]","−[[4|3]]","−[[3|4]]","−4"],"a":2,"h":["tan 2α = 2 tan α / (1 − tan²α) 를 씁니다.","분자는 2 × 2 = 4, 분모는 1 − 4 = −3 입니다."],"s":"tan 2α = (2 × 2) / (1 − 2²) = 4 / (−3) = **−4/3** 입니다. 분모가 음수가 되어 결과의 부호가 바뀌는 대표적인 경우입니다."}]}]},{"id":"geo-plane","title":"기하","subtitle":"평면벡터","tone":"#1d4ed8","units":[{"id":"v1","title":"벡터의 뜻과 크기","tagline":"벡터는 「크기 + 방향」을 함께 가진 양입니다. 화살표라고 생각하세요.","concept":[{"t":"10살에게 설명하면","b":"「3km 갔다」는 크기만 있는 정보입니다. 하지만 「북쪽으로 3km 갔다」는 크기와 방향이 둘 다 있습니다. 뒤엣것이 **벡터**입니다. 그래서 벡터는 **화살표**로 그립니다 — 화살표의 길이가 크기, 화살표가 가리키는 쪽이 방향입니다."},{"t":"기호와 용어","b":"점 A에서 점 B로 향하는 벡터를 **AB→** 라 씁니다. A를 시점, B를 종점이라 합니다. 그냥 a→, b→ 처럼 한 글자로 쓰기도 합니다.\n벡터의 **크기**는 |AB→| 로 쓰고, 이는 선분 AB의 길이입니다."},{"t":"가장 중요한 성질 — 위치는 상관없다","b":"벡터에서 **출발점이 어디냐는 중요하지 않습니다**. 크기와 방향이 같으면 화면 어디에 그려져 있든 **같은 벡터**입니다. 이것이 벡터를 자유롭게 옮겨서 계산할 수 있게 해 주는 핵심 성질입니다.\n\n예: 평행사변형 ABCD에서 AB→ 와 DC→ 는 (길이가 같고 방향도 같으므로) 같은 벡터입니다. 반면 AB→ 와 CD→ 는 방향이 반대라 서로 역벡터입니다."},{"t":"특별한 벡터들","b":"**영벡터 0→**: 크기가 0인 벡터. 방향은 정하지 않습니다.\n**단위벡터**: 크기가 1인 벡터. a→ 방향의 단위벡터는 a→ / |a→| 로 만듭니다.\n**역벡터 −a→**: 크기는 같고 방향만 반대."}],"svg":"<svg viewBox='0 0 320 150' role='img' aria-label='평행사변형에서 같은 벡터'><defs><marker id='ar1' markerWidth='9' markerHeight='9' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L8,3 z' fill='#1d4ed8'/></marker></defs><polygon points='40,120 150,120 220,40 110,40' fill='#eff6ff' stroke='#94a3b8' stroke-width='1.5'/><line x1='40' y1='120' x2='146' y2='120' stroke='#1d4ed8' stroke-width='3' marker-end='url(#ar1)'/><line x1='110' y1='40' x2='216' y2='40' stroke='#1d4ed8' stroke-width='3' marker-end='url(#ar1)'/><text x='30' y='137' font-size='12' fill='#334155'>A</text><text x='152' y='137' font-size='12' fill='#334155'>B</text><text x='224' y='36' font-size='12' fill='#334155'>C</text><text x='100' y='34' font-size='12' fill='#334155'>D</text><text x='84' y='113' font-size='12' fill='#1d4ed8'>AB→</text><text x='152' y='33' font-size='12' fill='#1d4ed8'>DC→</text><text x='236' y='95' font-size='11' fill='#64748b'>길이·방향이 같으면</text><text x='236' y='111' font-size='11' fill='#64748b'>같은 벡터</text></svg>","formulas":[{"n":"벡터의 크기","f":"|AB→| = 선분 AB 의 길이  (항상 0 이상)"},{"n":"실수배의 크기","f":"|k a→| = |k| |a→|"},{"n":"단위벡터 만들기","f":"[[a→||a→|]]  (크기가 1이고 방향은 a→ 와 같음)"}],"mistake":"|k a→| = k|a→| 라고 쓰면 k가 음수일 때 크기가 음수가 되어 버립니다. 반드시 **절댓값**을 씌워 |k||a→| 로 써야 합니다.","example":{"q":"|a→| = 5 일 때 |−3 a→| 를 구하고, a→ 방향의 단위벡터를 a→ 로 나타내시오.","steps":["|−3 a→| = |−3| × |a→| = 3 × 5 = 15","단위벡터는 원래 벡터를 자기 크기로 나눈 것: a→ / |a→| = a→ / 5 = (1/5) a→"],"a":"|−3a→| = 15, 단위벡터는 (1/5) a→"},"quiz":[{"q":"평행사변형 ABCD 에서 AB→ 와 같은 벡터는?","c":["BA→","CD→","DC→","AD→","BC→"],"a":2,"h":["같은 벡터가 되려면 길이와 방향이 **둘 다** 같아야 합니다.","평행사변형에서 변 AB 와 변 DC 는 평행하고 길이가 같습니다. 이제 화살표 방향을 맞춰 보세요."],"s":"평행사변형에서 AB와 DC는 평행하고 길이가 같습니다. 화살표 방향까지 같으려면 D에서 C로 가야 하므로 **DC→** 입니다. CD→ 는 방향이 반대이므로 −AB→ 입니다."},{"q":"|a→| = 5 일 때 |−3 a→| 의 값은?","c":["−15","3","5","15","45"],"a":3,"h":["|k a→| = |k| |a→| 입니다. k = −3 의 절댓값은 얼마인가요?","3 × 5 를 계산하세요. 크기는 결코 음수가 될 수 없습니다."],"s":"|−3 a→| = |−3| × |a→| = 3 × 5 = **15** 입니다. 방향은 반대로 뒤집히지만 크기는 3배가 됩니다."},{"q":"|a→| = 4 일 때, a→ 와 방향이 같은 단위벡터는?","c":["4 a→","[[1|4]] a→","−[[1|4]] a→","a→ − 1","[[1|2]] a→"],"a":1,"h":["단위벡터는 크기가 1인 벡터입니다. 크기를 4에서 1로 줄이려면 무엇으로 나눠야 할까요?","a→ / |a→| = a→ / 4."],"s":"단위벡터는 a→ / |a→| = a→ / 4 = **(1/4) a→** 입니다. 실제로 크기를 확인하면 |(1/4)a→| = (1/4) × 4 = 1 이 됩니다. 음수배 −(1/4)a→ 는 크기는 1이지만 방향이 반대라 답이 될 수 없습니다."},{"q":"두 벡터가 「같은 벡터」이기 위한 조건으로 옳은 것은?","c":["시점이 같아야 한다","종점이 같아야 한다","크기와 방향이 모두 같으면 된다","같은 직선 위에 있어야 한다","크기만 같으면 된다"],"a":2,"h":["벡터는 화살표입니다. 화살표를 평행하게 옮겨도 같은 화살표일까요?","벡터에서 「어디에 놓여 있는가」는 정보에 포함되지 않습니다."],"s":"벡터는 **크기와 방향만으로** 결정됩니다. 위치를 평행이동해도 같은 벡터이므로 정답은 **크기와 방향이 모두 같으면 된다** 입니다. 크기만 같고 방향이 다르면 다른 벡터입니다."}]},{"id":"v2","title":"벡터의 덧셈·뺄셈·실수배","tagline":"벡터의 덧셈은 「이어 붙이기」, 뺄셈은 「도착 − 출발」입니다.","concept":[{"t":"10살에게 설명하면","b":"동쪽으로 3걸음 간 다음 북쪽으로 4걸음 갔다면, 결국 처음 자리에서 대각선으로 5걸음 온 것과 같습니다. 두 이동을 **이어 붙인 결과**가 바로 벡터의 덧셈입니다."},{"t":"덧셈 — 두 가지 방법","b":"**삼각형법**: 첫 벡터의 종점에 둘째 벡터의 시점을 붙입니다. 그러면 처음 시점에서 마지막 종점까지가 합입니다.\n→ 그래서 **AB→ + BC→ = AC→** 라는 아주 편리한 공식이 나옵니다. 가운데 글자 B가 지워진다고 기억하세요.\n\n**평행사변형법**: 두 벡터를 같은 점에서 출발시켜 평행사변형을 만들면, 그 대각선이 합입니다."},{"t":"뺄셈 — 「도착 빼기 출발」","b":"a→ − b→ = a→ + (−b→) 입니다. 실전에서 훨씬 자주 쓰는 형태는 이것입니다:\n**OB→ − OA→ = AB→**\n같은 점 O에서 출발한 두 벡터를 빼면, 「A에서 B로 가는 벡터」가 나옵니다. **(도착) − (출발)** 로 외우세요."},{"t":"실수배","b":"k a→ 는 길이를 |k| 배 한 벡터입니다. k > 0 이면 방향 그대로, k < 0 이면 방향이 반대. k = 0 이면 영벡터.\n\n두 벡터가 **평행**하다는 것은 b→ = k a→ 인 실수 k가 존재한다는 뜻입니다."},{"t":"계산 법칙 — 문자식처럼 다뤄도 됩니다","b":"교환법칙 a→ + b→ = b→ + a→\n결합법칙 (a→ + b→) + c→ = a→ + (b→ + c→)\n분배법칙 k(a→ + b→) = k a→ + k b→\n\n즉 **일반 문자식처럼 전개하고 정리해도 안전**합니다. (단, 벡터끼리 곱하거나 나누는 것은 아직 안 됩니다.)"}],"svg":"<svg viewBox='0 0 330 160' role='img' aria-label='삼각형법에 의한 벡터의 덧셈'><defs><marker id='ar2' markerWidth='9' markerHeight='9' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L8,3 z' fill='#1d4ed8'/></marker><marker id='ar3' markerWidth='9' markerHeight='9' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L8,3 z' fill='#c2410c'/></marker></defs><line x1='35' y1='125' x2='146' y2='125' stroke='#1d4ed8' stroke-width='3' marker-end='url(#ar2)'/><line x1='150' y1='125' x2='233' y2='47' stroke='#1d4ed8' stroke-width='3' marker-end='url(#ar2)'/><line x1='35' y1='125' x2='232' y2='42' stroke='#c2410c' stroke-width='3' marker-end='url(#ar3)'/><text x='26' y='142' font-size='12' fill='#334155'>A</text><text x='150' y='142' font-size='12' fill='#334155'>B</text><text x='240' y='40' font-size='12' fill='#334155'>C</text><text x='84' y='118' font-size='12' fill='#1d4ed8'>AB→</text><text x='196' y='102' font-size='12' fill='#1d4ed8'>BC→</text><text x='108' y='76' font-size='12' fill='#c2410c'>AC→ = AB→ + BC→</text></svg>","formulas":[{"n":"이어 붙이기","f":"AB→ + BC→ = AC→   (가운데 글자가 사라진다)"},{"n":"도착 − 출발","f":"OB→ − OA→ = AB→"},{"n":"역벡터","f":"AB→ = −BA→,   AB→ + BA→ = 0→"},{"n":"평행 조건","f":"a→ ∥ b→  ⟺  b→ = k a→ 인 실수 k 가 존재"}],"mistake":"OB→ − OA→ 를 AB→ 가 아니라 BA→ 로 잘못 쓰는 실수가 매우 흔합니다. 「**뒤에서 앞으로**」 — 빼는 쪽(A)이 출발점, 남는 쪽(B)이 도착점입니다.","example":{"q":"OA→ = a→, OB→ = b→ 일 때 2(a→ + b→) − 3(a→ − b→) 를 간단히 하시오.","steps":["일반 문자식처럼 전개합니다: 2a→ + 2b→ − 3a→ + 3b→","a→ 끼리, b→ 끼리 묶습니다: (2 − 3)a→ + (2 + 3)b→","= −a→ + 5b→"],"a":"−a→ + 5b→"},"quiz":[{"q":"AB→ + BC→ + CD→ 를 간단히 하면?","c":["AC→","AD→","BD→","DA→","0→"],"a":1,"h":["AB→ + BC→ = AC→ 처럼 가운데 글자가 지워집니다. 앞에서부터 차례로 합쳐 보세요.","AC→ + CD→ 를 한 번 더 합치면 가운데 C가 사라집니다."],"s":"AB→ + BC→ = AC→ 이고, AC→ + CD→ = **AD→** 입니다. 결국 A에서 출발해 D에 도착한 것과 같습니다."},{"q":"OA→ = a→, OB→ = b→ 일 때 AB→ 를 a→, b→ 로 나타내면?","c":["a→ + b→","a→ − b→","b→ − a→","−a→ − b→","[[a→ + b→|2]]"],"a":2,"h":["AB→ = OB→ − OA→ 입니다. 「도착 − 출발」.","OB→ = b→, OA→ = a→ 를 대입하세요."],"s":"AB→ = OB→ − OA→ = **b→ − a→** 입니다. 도착점 B의 벡터에서 출발점 A의 벡터를 뺀다는 순서를 반대로 하지 않도록 주의하세요."},{"q":"2(a→ + b→) − 3(a→ − b→) 를 간단히 하면?","c":["−a→ + 5b→","5a→ − b→","−a→ − b→","5a→ + 5b→","a→ + 5b→"],"a":0,"h":["벡터는 일반 문자식처럼 전개해도 됩니다. 괄호를 먼저 푸세요.","2a→ + 2b→ − 3a→ + 3b→ 를 같은 문자끼리 묶으세요. 두 번째 괄호 앞의 −3 이 안쪽 −b→ 에도 곱해집니다."],"s":"2a→ + 2b→ − 3a→ + 3b→ = (2 − 3)a→ + (2 + 3)b→ = **−a→ + 5b→** 입니다. −3 × (−b→) = +3b→ 인 부호 처리가 핵심입니다."},{"q":"AB→ − AC→ 를 간단히 하면?","c":["BC→","CB→","AD→","BA→","0→"],"a":1,"h":["둘 다 시점이 A로 같습니다. OB→ − OA→ = AB→ 꼴로 보세요.","여기서 기준점 역할을 하는 것은 A입니다. AB→ − AC→ 는 「C에서 B로」가 됩니다."],"s":"AB→ − AC→ 에서 기준점은 A이므로 「도착 − 출발」 규칙에 따라 출발점은 C, 도착점은 B가 되어 **CB→** 입니다. AB→ − AC→ = (OB→−OA→) − (OC→−OA→) = OB→ − OC→ = CB→ 로 확인할 수 있습니다."}]},{"id":"v3","title":"위치벡터와 내분·외분","tagline":"기준점 O를 하나 정하면 모든 점을 벡터 하나로 표현할 수 있습니다.","concept":[{"t":"10살에게 설명하면","b":"지도에서 「학교를 기준으로 우리 집은 여기」라고 말하듯이, 기준점 O를 하나 정하고 「O에서 그 점까지의 화살표」로 점의 위치를 나타내는 것이 **위치벡터**입니다."},{"t":"정의와 기본 공식","b":"기준점 O에 대해 점 A의 위치벡터는 OA→ 이고, 보통 a→ 로 씁니다.\n그러면 어떤 두 점 사이의 벡터는 항상\n**AB→ = b→ − a→**\n로 계산됩니다. 모든 벡터 문제를 위치벡터로 바꿔 놓으면 계산이 대수 문제로 변합니다."},{"t":"내분점 — 가장 자주 나오는 공식","b":"선분 AB를 **m : n 으로 내분하는 점 P**의 위치벡터는\n**p→ = (n a→ + m b→) / (m + n)**\n\n분자에서 계수가 **엇갈린다**는 것이 포인트입니다. A쪽 비율 m이 b→ 앞에 붙습니다. 이유는 간단합니다 — P가 B에 가까울수록(m이 클수록) b→의 영향이 커져야 하기 때문입니다."},{"t":"중점과 외분점, 무게중심","b":"**중점** (1:1 내분): (a→ + b→) / 2\n**외분점** (m : n 외분): (−n a→ + m b→) / (m − n)  — 내분 공식에서 n을 −n으로 바꾼 것\n**삼각형 ABC의 무게중심**: (a→ + b→ + c→) / 3"}],"formulas":[{"n":"두 점 사이 벡터","f":"AB→ = b→ − a→"},{"n":"m : n 내분점","f":"[[n a→ + m b→|m + n]]"},{"n":"중점","f":"[[a→ + b→|2]]"},{"n":"m : n 외분점","f":"[[−n a→ + m b→|m − n]]  (m ≠ n)"},{"n":"삼각형의 무게중심","f":"[[a→ + b→ + c→|3]]"}],"mistake":"내분점 공식에서 계수를 엇갈리게 쓰지 않고 (m a→ + n b→)/(m+n) 으로 쓰는 실수가 정말 많습니다. **1 : 2 내분이면 A에 가까운 점**이므로 a→ 의 계수가 더 커야 한다 — 이렇게 상식으로 검산하세요.","example":{"q":"두 점 A(a→), B(b→) 에 대하여 선분 AB를 1 : 2 로 내분하는 점 P의 위치벡터를 구하시오.","steps":["m : n = 1 : 2 이므로 m = 1, n = 2.","p→ = (n a→ + m b→)/(m + n) = (2 a→ + 1 b→)/(1 + 2)","= (2a→ + b→)/3","검산: 1:2 내분이면 P는 A에 더 가깝고, 실제로 a→ 의 계수 2가 b→ 의 계수 1보다 큽니다. 맞습니다."],"a":"(2a→ + b→) / 3"},"quiz":[{"q":"두 점 A(a→), B(b→) 에 대하여 선분 AB를 1 : 2 로 내분하는 점의 위치벡터는?","c":["[[a→ + 2b→|3]]","[[2a→ + b→|3]]","[[a→ + b→|3]]","[[a→ + b→|2]]","[[2a→ − b→|3]]"],"a":1,"h":["m : n 내분점은 (n a→ + m b→)/(m+n) 입니다. 계수가 엇갈립니다.","m = 1, n = 2 를 대입하면 (2a→ + 1b→)/3. 1:2 내분이면 A에 더 가까우므로 a→ 계수가 커야 맞습니다."],"s":"p→ = (2a→ + b→)/3 입니다. 1 : 2 내분은 A에서 B까지 거리의 1/3 지점, 즉 **A에 가까운 점**이므로 a→ 의 비중이 커야 한다는 상식과 일치합니다."},{"q":"두 점 A(a→), B(b→) 를 이은 선분 AB의 중점 M의 위치벡터는?","c":["a→ + b→","[[a→ + b→|2]]","[[b→ − a→|2]]","[[a→ − b→|2]]","[[a→ + b→|3]]"],"a":1,"h":["중점은 1 : 1 내분점입니다.","내분 공식에 m = n = 1 을 대입하면 (a→ + b→)/2."],"s":"중점은 1:1 내분점이므로 **(a→ + b→)/2** 입니다. 좌표에서 중점이 두 좌표의 평균인 것과 완전히 같은 구조입니다."},{"q":"삼각형 ABC 의 세 꼭짓점의 위치벡터가 a→, b→, c→ 일 때 무게중심 G 의 위치벡터는?","c":["[[a→ + b→ + c→|2]]","[[a→ + b→ + c→|3]]","[[a→ + b→ + c→|4]]","a→ + b→ + c→","[[a→ + b→|3]]"],"a":1,"h":["무게중심은 세 꼭짓점의 「평균 위치」입니다.","세 개의 평균이므로 3으로 나눕니다."],"s":"무게중심의 위치벡터는 **(a→ + b→ + c→)/3** 입니다. 무게중심이 중선을 2:1로 내분한다는 성질에서도 같은 식이 유도됩니다."},{"q":"두 점 A(a→), B(b→) 에 대하여 선분 AB를 3 : 1 로 외분하는 점의 위치벡터는?","c":["[[3b→ − a→|2]]","[[3b→ + a→|4]]","[[a→ − 3b→|2]]","[[3a→ − b→|2]]","[[3b→ − a→|4]]"],"a":0,"h":["외분 공식은 (−n a→ + m b→)/(m − n) 입니다. 내분 공식에서 n의 부호를 바꾼 것입니다.","m = 3, n = 1 을 대입하면 (−1·a→ + 3·b→)/(3−1) 입니다."],"s":"외분점 = (−n a→ + m b→)/(m − n) 에 m = 3, n = 1 을 넣으면 (−a→ + 3b→)/2 = **(3b→ − a→)/2** 입니다. 분모가 m − n 이라 내분과 달라진다는 점을 꼭 확인하세요."}]},{"id":"v4","title":"벡터의 성분과 크기","tagline":"벡터를 좌표처럼 (x, y) 로 적으면 모든 계산이 산수가 됩니다.","concept":[{"t":"10살에게 설명하면","b":"화살표를 「오른쪽으로 몇 칸, 위로 몇 칸」으로 적는 것이 성분 표시입니다. 예를 들어 오른쪽 3칸, 위로 4칸 가는 화살표는 (3, 4) 입니다. 이렇게 적으면 화살표를 그리지 않고도 계산할 수 있습니다."},{"t":"성분의 정의","b":"벡터 a→ 의 시점을 원점으로 옮겼을 때 종점의 좌표가 (a₁, a₂) 이면 **a→ = (a₁, a₂)** 로 씁니다.\n두 점 A(x₁, y₁), B(x₂, y₂) 에 대하여\n**AB→ = (x₂ − x₁, y₂ − y₁)**\n여기서도 「도착 − 출발」 입니다."},{"t":"성분으로 하는 계산 — 그냥 자리끼리","b":"a→ + b→ = (a₁ + b₁, a₂ + b₂)\na→ − b→ = (a₁ − b₁, a₂ − b₂)\nk a→ = (k a₁, k a₂)\n\n특별한 규칙이 없습니다. 같은 자리끼리 계산하면 끝입니다."},{"t":"크기 — 피타고라스","b":"**|a→| = √(a₁² + a₂²)**\n가로로 a₁, 세로로 a₂ 간 화살표의 길이이므로 피타고라스 정리 그대로입니다.\n두 벡터가 같을 조건은 **성분이 각각 같은 것**: (a₁, a₂) = (b₁, b₂) ⟺ a₁ = b₁ 이고 a₂ = b₂."}],"formulas":[{"n":"두 점으로부터","f":"AB→ = (x₂ − x₁, y₂ − y₁)"},{"n":"성분 계산","f":"k a→ + l b→ = (k a₁ + l b₁, k a₂ + l b₂)"},{"n":"크기","f":"|a→| = √(a₁² + a₂²)"}],"mistake":"AB→ 를 (x₁ − x₂, y₁ − y₂) 로 계산하면 방향이 정반대인 BA→ 가 나옵니다. 크기를 묻는 문제라면 답이 같아 넘어가지만, 성분을 묻는 문제에서는 바로 오답이 됩니다.","example":{"q":"두 점 A(1, 2), B(4, 6) 에 대하여 AB→ 의 성분과 크기를 구하시오.","steps":["AB→ = (4 − 1, 6 − 2) = (3, 4)","|AB→| = √(3² + 4²) = √(9 + 16) = √25 = 5"],"a":"AB→ = (3, 4), |AB→| = 5"},"quiz":[{"q":"a→ = (3, −4) 일 때 |a→| 의 값은?","c":["1","5","7","25","−1"],"a":1,"h":["|a→| = √(a₁² + a₂²) 입니다. 제곱하면 음수도 양수가 됩니다.","√(9 + 16) = √25."],"s":"|a→| = √(3² + (−4)²) = √(9 + 16) = √25 = **5** 입니다. 성분에 음수가 있어도 제곱하므로 크기는 항상 0 이상입니다."},{"q":"두 점 A(1, 2), B(4, 6) 에 대하여 AB→ 의 성분은?","c":["(3, 4)","(−3, −4)","(5, 8)","(4, 6)","(3, 8)"],"a":0,"h":["AB→ = (도착의 좌표) − (출발의 좌표) 입니다.","(4 − 1, 6 − 2) 를 계산하세요."],"s":"AB→ = (4 − 1, 6 − 2) = **(3, 4)** 입니다. 순서를 바꾸면 BA→ = (−3, −4) 가 되므로 주의하세요."},{"q":"a→ = (2, −1), b→ = (−3, 4) 일 때 2a→ + b→ 는?","c":["(1, 2)","(−1, 2)","(1, 3)","(4, −2)","(−2, 6)"],"a":0,"h":["먼저 2a→ = (4, −2) 를 구하세요.","(4, −2) + (−3, 4) 를 같은 자리끼리 더합니다."],"s":"2a→ = (4, −2) 이고 2a→ + b→ = (4 + (−3), −2 + 4) = **(1, 2)** 입니다."},{"q":"a→ = (x, 3) 이고 |a→| = 5 일 때, 실수 x 의 값은?","c":["4","±4","2","±2","16"],"a":1,"h":["|a→|² = x² + 3² = 25 라는 식을 세우세요.","x² = 16 을 푸는데, 제곱해서 16이 되는 수는 두 개입니다."],"s":"x² + 9 = 25 이므로 x² = 16, 따라서 x = **±4** 입니다. 문제에 x > 0 같은 추가 조건이 없으면 음수 해도 반드시 포함해야 합니다."}]},{"id":"v5","title":"벡터의 내적","tagline":"벡터끼리 곱해서 「숫자」를 만드는 연산입니다. 각도 정보가 그 안에 들어 있습니다.","concept":[{"t":"10살에게 설명하면","b":"두 화살표가 **얼마나 같은 쪽을 보고 있는지**를 숫자 하나로 나타낸 것이 내적입니다. 같은 방향이면 큰 양수, 직각이면 0, 반대 방향이면 음수가 나옵니다. 결과가 벡터가 아니라 **그냥 숫자(스칼라)** 라는 점이 중요합니다."},{"t":"두 가지 정의 — 둘 다 같은 값","b":"**기하적 정의**: a→ · b→ = |a→| |b→| cos θ  (θ는 두 벡터가 이루는 각, 0° ≤ θ ≤ 180°)\n**성분 정의**: a→ · b→ = a₁b₁ + a₂b₂\n\n크기와 각이 주어지면 위 식, 성분이 주어지면 아래 식을 씁니다. 두 정의가 같다는 사실이 「성분만으로 각을 구할 수 있게」해 줍니다."},{"t":"가장 유용한 성질","b":"**a→ · a→ = |a→|²**\n자기 자신과의 내적은 크기의 제곱입니다(θ = 0 이므로 cos θ = 1). 이 덕분에 크기 계산을 내적으로 바꿔 풀 수 있습니다.\n\n**|a→ + b→|² = |a→|² + 2(a→ · b→) + |b→|²**\n마치 (x+y)² = x² + 2xy + y² 처럼 전개됩니다."},{"t":"연산 법칙","b":"교환법칙 a→ · b→ = b→ · a→\n분배법칙 a→ · (b→ + c→) = a→ · b→ + a→ · c→\n실수배 (k a→) · b→ = k (a→ · b→)\n\n다만 **결합법칙은 성립하지 않습니다**. (a→ · b→) · c→ 같은 식은 애초에 뜻이 없습니다 — a→ · b→ 가 이미 숫자이기 때문입니다."}],"formulas":[{"n":"기하적 정의","f":"a→ · b→ = |a→| |b→| cos θ"},{"n":"성분 정의","f":"a→ · b→ = a₁b₁ + a₂b₂"},{"n":"자기 자신과의 내적","f":"a→ · a→ = |a→|²"},{"n":"전개 공식","f":"|a→ ± b→|² = |a→|² ± 2(a→·b→) + |b→|²"}],"mistake":"내적의 결과는 **벡터가 아니라 실수**입니다. 답에 화살표를 붙이면 틀립니다. 또 |a→ + b→| = |a→| + |b→| 는 일반적으로 성립하지 **않습니다** — 반드시 제곱해서 전개해야 합니다.","example":{"q":"|a→| = 1, |b→| = 2, a→ · b→ = 1 일 때 |a→ + b→| 를 구하시오.","steps":["크기를 바로 구할 수 없으므로 제곱부터 계산합니다.","|a→ + b→|² = |a→|² + 2(a→·b→) + |b→|²","= 1² + 2(1) + 2² = 1 + 2 + 4 = 7","|a→ + b→| = √7  (크기는 양수이므로 양의 제곱근만)"],"a":"√7"},"quiz":[{"q":"|a→| = 3, |b→| = 4 이고 두 벡터가 이루는 각이 60° 일 때 a→ · b→ 의 값은?","c":["6","12","[[12|√3]]","6√3","12√3"],"a":0,"h":["a→ · b→ = |a→||b→| cos θ 를 씁니다. cos 60° = 1/2 입니다.","3 × 4 × (1/2) 를 계산하세요."],"s":"a→ · b→ = 3 × 4 × cos 60° = 12 × 1/2 = **6** 입니다."},{"q":"a→ = (1, 2), b→ = (3, −1) 일 때 a→ · b→ 의 값은?","c":["1","2","5","−1","(3, −2)"],"a":0,"h":["성분이 주어졌으므로 a₁b₁ + a₂b₂ 를 씁니다.","1×3 + 2×(−1) = 3 − 2."],"s":"a→ · b→ = 1×3 + 2×(−1) = 3 − 2 = **1** 입니다. 내적의 결과는 벡터가 아니라 실수이므로 (3, −2) 같은 성분 형태로 답하면 안 됩니다."},{"q":"|a→| = 2, |b→| = 3, a→ · b→ = 3 일 때 두 벡터가 이루는 각 θ 는?","c":["30°","45°","60°","90°","120°"],"a":2,"h":["a→·b→ = |a→||b→| cos θ 를 cos θ 에 대해 정리하세요.","cos θ = 3 / (2×3) = 1/2. cos 값이 1/2 인 각은?"],"s":"cos θ = (a→·b→)/(|a→||b→|) = 3/6 = 1/2 이므로 θ = **60°** 입니다. 두 벡터가 이루는 각은 0° 이상 180° 이하에서 하나로 정해집니다."},{"q":"|a→| = 1, |b→| = 2, a→ · b→ = 1 일 때 |a→ + b→| 의 값은?","c":["3","√5","√7","7","√3"],"a":2,"h":["크기를 바로 더하면 안 됩니다. 먼저 |a→+b→|² 를 전개하세요.","|a→+b→|² = |a→|² + 2(a→·b→) + |b→|² = 1 + 2 + 4 = 7 입니다."],"s":"|a→ + b→|² = 1² + 2×1 + 2² = 7 이므로 |a→ + b→| = **√7** 입니다. |a→| + |b→| = 3 이라고 답하는 것이 대표적인 함정입니다."}]},{"id":"v6","title":"두 벡터의 수직과 이루는 각","tagline":"내적이 0이면 직각. 이 한 줄이 벡터 문제의 절반을 풉니다.","concept":[{"t":"10살에게 설명하면","b":"내적은 「두 화살표가 얼마나 같은 쪽을 보는가」였죠. 직각이면 서로 전혀 같은 쪽을 보지 않으니 그 값이 **0**이 됩니다. 그래서 「내적 = 0」과 「수직」은 같은 말입니다."},{"t":"수직 조건","b":"**a→ ⊥ b→ ⟺ a→ · b→ = 0**  (단, a→ ≠ 0→, b→ ≠ 0→)\n\n영벡터를 제외하는 이유: 영벡터는 방향이 없어서 「수직이다」라고 말할 수 없기 때문입니다. 하지만 영벡터와의 내적은 항상 0이므로, 조건을 붙이지 않으면 명제가 거짓이 됩니다."},{"t":"이루는 각 구하기","b":"**cos θ = (a→ · b→) / (|a→| |b→|)**,  0° ≤ θ ≤ 180°\n\n순서: ① 내적 계산 → ② 각각의 크기 계산 → ③ 나누기 → ④ cos 값에 해당하는 각 찾기.\ncos θ 의 **부호만 봐도** 예각(양수) / 직각(0) / 둔각(음수)을 즉시 판정할 수 있습니다."},{"t":"평행 조건과 비교","b":"**수직**: a→ · b→ = 0  → a₁b₁ + a₂b₂ = 0\n**평행**: b→ = k a→  → 성분비가 같다, 즉 a₁b₂ − a₂b₁ = 0\n\n두 조건은 완전히 다릅니다. 「성분끼리 곱해 더하면 수직, 성분비가 같으면 평행」으로 구분하세요."}],"formulas":[{"n":"수직 조건","f":"a→ · b→ = 0  ⟺  a₁b₁ + a₂b₂ = 0"},{"n":"이루는 각","f":"cos θ = [[a→ · b→||a→| |b→|]]"},{"n":"평행 조건","f":"b→ = k a→  ⟺  [[b₁|a₁]] = [[b₂|a₂]]"},{"n":"각의 판정","f":"a→·b→ > 0 → 예각,  = 0 → 직각,  < 0 → 둔각"}],"mistake":"수직 조건과 평행 조건을 뒤바꿔 쓰는 실수가 잦습니다. 「내적 = 0 은 **수직**」이라고 확실히 각인해 두세요. 또 각을 구할 때 cos θ 를 구해 놓고 θ 로 바꾸지 않고 답하는 실수도 흔합니다.","example":{"q":"두 벡터 a→ = (2, 3), b→ = (x, −4) 가 서로 수직일 때 실수 x 의 값을 구하시오.","steps":["수직이므로 a→ · b→ = 0 입니다.","2 × x + 3 × (−4) = 0","2x − 12 = 0","x = 6"],"a":"x = 6"},"quiz":[{"q":"두 벡터 a→ = (2, 3), b→ = (x, −4) 가 서로 수직일 때 x 의 값은?","c":["−6","6","[[8|3]]","−[[8|3]]","12"],"a":1,"h":["수직이면 내적이 0 입니다. a₁b₁ + a₂b₂ = 0 식을 세우세요.","2x + 3×(−4) = 0, 즉 2x − 12 = 0 을 푸세요."],"s":"a→ · b→ = 2x − 12 = 0 이므로 x = **6** 입니다. 검산: (2,3)·(6,−4) = 12 − 12 = 0 이므로 확실히 수직입니다."},{"q":"두 벡터 a→ = (1, 1), b→ = (1, 0) 이 이루는 각은?","c":["0°","30°","45°","60°","90°"],"a":2,"h":["cos θ = (a→·b→)/(|a→||b→|) 를 계산하세요. 내적은 1×1 + 1×0 = 1 입니다.","|a→| = √2, |b→| = 1 이므로 cos θ = 1/√2 = √2/2 입니다."],"s":"a→·b→ = 1, |a→| = √2, |b→| = 1 이므로 cos θ = 1/√2 = √2/2, 따라서 θ = **45°** 입니다."},{"q":"두 벡터 a→ = (1, −2), b→ = (2, 1) 의 관계로 옳은 것은?","c":["평행하다","수직이다","이루는 각이 60°이다","이루는 각이 120°이다","같은 벡터이다"],"a":1,"h":["먼저 내적을 계산해 보세요.","1×2 + (−2)×1 = 2 − 2 = 0 입니다. 내적이 0이라는 것은 무엇을 뜻하나요?"],"s":"a→·b→ = 1×2 + (−2)×1 = 0 이므로 두 벡터는 **수직**입니다. 성분비를 보면 2/1 ≠ 1/(−2) 이므로 평행하지도 않습니다."},{"q":"두 벡터 a→ = (3, 4), b→ = (6, k) 가 서로 평행할 때 k 의 값은?","c":["3","−[[9|2]]","8","12","−8"],"a":2,"h":["평행이면 b→ = m a→ 인 실수 m 이 있습니다. 첫 성분을 비교해 m 을 먼저 구하세요.","6 = 3m 이므로 m = 2. 그러면 k = 4m 입니다."],"s":"b→ = m a→ 라 하면 6 = 3m 에서 m = 2 이므로 k = 4 × 2 = **8** 입니다. 성분비 3/6 = 4/k 로 풀어도 k = 8 이 나옵니다. (수직 조건 18 + 4k = 0 을 잘못 적용하면 −9/2 가 나오니 조건을 혼동하지 마세요.)"}]}]},{"id":"geo-space","title":"기하","subtitle":"공간도형과 공간좌표","tone":"#0f766e","units":[{"id":"s1","title":"직선과 평면의 위치 관계","tagline":"평면에서는 「만나거나 평행」 둘뿐이지만, 공간에서는 제3의 경우가 생깁니다.","concept":[{"t":"10살에게 설명하면","b":"종이 위(평면)에서 두 직선은 만나거나 평행합니다. 그런데 **공간**에서는 한 가지가 더 생깁니다 — 육교 위의 길과 그 아래 도로처럼, 만나지도 않고 평행하지도 않은 관계입니다. 이것을 **꼬인 위치**라고 합니다."},{"t":"두 직선의 위치 관계 (3가지)","b":"① **한 점에서 만난다** (같은 평면 위)\n② **평행하다** (같은 평면 위, 만나지 않음)\n③ **꼬인 위치** (같은 평면 위에 있지 않음)\n\n판별법: 두 직선이 **한 평면에 함께 놓일 수 있으면** ①이나 ②, 놓일 수 없으면 ③입니다."},{"t":"직선과 평면 (3가지)","b":"① 직선이 평면에 **포함된다**\n② 한 점에서 **만난다**\n③ **평행하다** (만나지 않음)\n\n**직선 l ⊥ 평면 α** 의 정의: l 이 α 위의 **모든** 직선과 수직. 실제 확인은 「α 위의 서로 다른 두 직선과 수직이면 충분」합니다."},{"t":"두 평면 (2가지)","b":"① 만난다 → 이때 만나는 부분은 반드시 **직선**(교선)입니다.\n② 평행하다.\n\n두 평면이 이루는 각을 **이면각**이라 하고, 교선에 수직인 두 반직선이 이루는 각으로 잽니다."},{"t":"삼수선의 정리와 정사영","b":"**삼수선의 정리**: 평면 α 위에 있지 않은 점 P, α 위의 점 O와 직선 l 에 대하여, PO ⊥ α 이고 O에서 l 에 내린 수선의 발이 H라면 **PH ⊥ l** 입니다. 공간 문제에서 직각을 찾아내는 핵심 도구입니다.\n\n**정사영**: 도형을 평면에 수직으로 「그림자처럼」 내린 것. 원래 넓이 S, 이면각 θ 일 때 정사영의 넓이는 **S′ = S cos θ** 입니다."}],"svg":"<svg viewBox='0 0 320 170' role='img' aria-label='공간에서 꼬인 위치에 있는 두 직선'><polygon points='30,120 200,120 290,70 120,70' fill='#f0fdfa' stroke='#94a3b8' stroke-width='1.5'/><line x1='55' y1='108' x2='245' y2='82' stroke='#0f766e' stroke-width='2.5'/><text x='250' y='80' font-size='12' fill='#0f766e'>m</text><line x1='140' y1='25' x2='195' y2='150' stroke='#c2410c' stroke-width='2.5'/><text x='198' y='150' font-size='12' fill='#c2410c'>l</text><text x='36' y='138' font-size='12' fill='#64748b'>α</text><text x='210' y='40' font-size='11' fill='#64748b'>l 과 m 은 만나지도</text><text x='210' y='55' font-size='11' fill='#64748b'>평행하지도 않다</text></svg>","formulas":[{"n":"두 직선의 위치 관계","f":"만난다 / 평행하다 / 꼬인 위치"},{"n":"직선 ⊥ 평면","f":"l 이 α 위의 두 직선과 수직이면  l ⊥ α"},{"n":"정사영의 넓이","f":"S′ = S cos θ   (θ 는 두 평면이 이루는 각)"}],"mistake":"「만나지 않으면 평행」은 **평면에서만** 참입니다. 공간에서는 만나지 않아도 꼬인 위치일 수 있습니다. 또 정사영 공식에서 S′ = S / cos θ 로 뒤집어 쓰는 실수를 조심하세요 — 그림자는 원래보다 **작아지므로** cos θ 를 곱합니다.","example":{"q":"평면 α 와 60°의 각을 이루는 평면 β 위에 넓이가 12인 도형이 있다. 이 도형의 α 위로의 정사영의 넓이를 구하시오.","steps":["정사영 공식 S′ = S cos θ 를 씁니다.","S = 12, θ = 60°, cos 60° = 1/2","S′ = 12 × 1/2 = 6"],"a":"6"},"quiz":[{"q":"공간에서 두 직선이 만나지도 않고 평행하지도 않을 때, 이 두 직선의 위치 관계는?","c":["평행","수직","꼬인 위치","일치","그런 경우는 없다"],"a":2,"h":["평면에서는 없지만 공간에서만 생기는 경우가 있습니다.","육교와 그 아래 도로를 떠올려 보세요. 같은 평면에 놓을 수 없습니다."],"s":"공간에서 두 직선이 한 평면 위에 놓이지 않으면 만나지도, 평행하지도 않습니다. 이를 **꼬인 위치**라고 합니다."},{"q":"직선 l 이 평면 α 에 수직일 때, l 과 α 위의 임의의 직선의 관계는?","c":["항상 평행하다","항상 수직이다","항상 꼬인 위치이다","항상 만난다","정할 수 없다"],"a":1,"h":["「직선이 평면에 수직이다」의 정의 자체를 떠올려 보세요.","정의: 평면 위의 모든 직선과 수직."],"s":"l ⊥ α 의 정의가 「l 이 α 위의 **모든** 직선과 수직」이므로 답은 **항상 수직이다** 입니다. (α 위의 직선 중 l 과 만나지 않는 것도 있으므로 「항상 만난다」는 틀립니다 — 이때는 꼬인 위치이면서 수직입니다.)"},{"q":"두 평면이 이루는 각이 60°일 때, 한 평면 위의 넓이 12인 도형의 다른 평면 위로의 정사영의 넓이는?","c":["3","6","6√3","12","24"],"a":1,"h":["S′ = S cos θ 공식을 씁니다.","12 × cos 60° = 12 × 1/2."],"s":"S′ = S cos θ = 12 × cos 60° = 12 × 1/2 = **6** 입니다. 그림자는 원래 도형보다 작아지므로 답이 12보다 작아야 한다는 상식과도 맞습니다."},{"q":"평면 α 에 평행한 직선 l 과, α 위에 있는 직선 m 의 위치 관계로 가능한 것을 모두 고르면?","c":["평행하거나 만난다","평행하거나 꼬인 위치이다","항상 평행하다","항상 꼬인 위치이다","항상 만난다"],"a":1,"h":["l 은 α 와 만나지 않습니다. 그러면 α 위에 있는 m 과 만날 수 있을까요?","만날 수 없으므로 남은 가능성은 평행 또는 꼬인 위치 두 가지입니다."],"s":"l ∥ α 이면 l 은 α 와 한 점도 공유하지 않으므로 α 위의 직선 m 과 결코 만날 수 없습니다. 따라서 남은 경우는 **평행하거나 꼬인 위치** 두 가지입니다."}]},{"id":"s2","title":"공간좌표","tagline":"평면의 (x, y) 에 높이 z 를 하나 더 붙였을 뿐입니다. 공식도 그대로 확장됩니다.","concept":[{"t":"10살에게 설명하면","b":"교실에서 자리를 말할 때 「앞에서 셋째 줄, 왼쪽에서 둘째」라고 하면 평면 좌표입니다. 여기에 「2층」을 붙이면 공간 좌표가 됩니다. x, y, z 세 숫자로 공간의 한 점을 정확히 찍는 것이 전부입니다."},{"t":"좌표축과 좌표평면","b":"서로 수직인 세 축 x축, y축, z축이 있고, 점은 P(x, y, z) 로 씁니다.\n두 축이 만드는 평면을 좌표평면이라 하며 xy평면(z = 0), yz평면(x = 0), zx평면(y = 0) 세 개가 있습니다."},{"t":"거리와 내분 — 평면에서 z만 추가","b":"**두 점 사이의 거리**\nAB = √((x₂−x₁)² + (y₂−y₁)² + (z₂−z₁)²)\n\n**m : n 내분점**\n((n x₁ + m x₂)/(m+n), (n y₁ + m y₂)/(m+n), (n z₁ + m z₂)/(m+n))\n\n**중점**: 세 좌표 각각의 평균.\n\n평면에서 배운 공식에 z 항 하나만 더 붙는 구조라, 새로 외울 것이 거의 없습니다."},{"t":"대칭점 — 「없어지는 좌표만 부호 반전」","b":"점 P(a, b, c) 에 대하여\n**xy평면 대칭** → (a, b, −c)  (z만 부호 반전)\n**yz평면 대칭** → (−a, b, c)\n**zx평면 대칭** → (a, −b, c)\n**x축 대칭** → (a, −b, −c)  (x는 그대로, 나머지 반전)\n**원점 대칭** → (−a, −b, −c)\n\n규칙: **평면 대칭이면 그 평면에 없는 좌표 하나만, 축 대칭이면 그 축이 아닌 두 좌표가** 부호를 바꿉니다."},{"t":"구의 방정식","b":"중심 (a, b, c), 반지름 r 인 구:\n**(x − a)² + (y − b)² + (z − c)² = r²**\n원의 방정식에 z 항이 하나 붙은 것입니다."}],"svg":"<svg viewBox='0 0 300 180' role='img' aria-label='공간좌표에서 점 P의 위치'><line x1='90' y1='120' x2='285' y2='120' stroke='#94a3b8' stroke-width='1.5'/><text x='288' y='124' font-size='12' fill='#64748b'>y</text><line x1='90' y1='120' x2='90' y2='15' stroke='#94a3b8' stroke-width='1.5'/><text x='84' y='12' font-size='12' fill='#64748b'>z</text><line x1='90' y1='120' x2='18' y2='168' stroke='#94a3b8' stroke-width='1.5'/><text x='10' y='176' font-size='12' fill='#64748b'>x</text><line x1='90' y1='120' x2='54' y2='144' stroke='#0f766e' stroke-width='2' stroke-dasharray='4 3'/><line x1='54' y1='144' x2='174' y2='144' stroke='#0f766e' stroke-width='2' stroke-dasharray='4 3'/><line x1='174' y1='144' x2='174' y2='64' stroke='#0f766e' stroke-width='2' stroke-dasharray='4 3'/><circle cx='174' cy='64' r='4.5' fill='#0f766e'/><text x='182' y='60' font-size='12' fill='#0f766e'>P(a, b, c)</text><text x='60' y='162' font-size='11' fill='#64748b'>a</text><text x='112' y='158' font-size='11' fill='#64748b'>b</text><text x='180' y='108' font-size='11' fill='#64748b'>c</text></svg>","formulas":[{"n":"두 점 사이의 거리","f":"√[(x₂−x₁)² + (y₂−y₁)² + (z₂−z₁)²]"},{"n":"원점과의 거리","f":"OP = √(x² + y² + z²)"},{"n":"중점","f":"( [[x₁+x₂|2]], [[y₁+y₂|2]], [[z₁+z₂|2]] )"},{"n":"구의 방정식","f":"(x−a)² + (y−b)² + (z−c)² = r²"}],"mistake":"구의 방정식에서 중심이 (1, −2, 3) 이면 식은 (x−1)² + (y **+** 2)² + (z−3)² 입니다. 중심 좌표의 부호를 그대로 옮겨 적는 실수가 매우 흔합니다 — 항상 **부호가 반대**로 들어갑니다.","example":{"q":"두 점 A(1, −2, 3), B(4, 2, 3) 사이의 거리를 구하시오.","steps":["각 좌표의 차를 구합니다: x 차 = 4−1 = 3, y 차 = 2−(−2) = 4, z 차 = 3−3 = 0","AB = √(3² + 4² + 0²) = √(9 + 16 + 0)","= √25 = 5"],"a":"5"},"quiz":[{"q":"두 점 A(1, −2, 3), B(4, 2, 3) 사이의 거리는?","c":["3","4","5","7","√7"],"a":2,"h":["각 좌표의 차를 구해 제곱해서 더한 뒤 제곱근을 씌웁니다.","차는 (3, 4, 0) 입니다. √(9 + 16 + 0) 을 계산하세요."],"s":"좌표의 차는 (4−1, 2−(−2), 3−3) = (3, 4, 0) 이므로 거리는 √(9 + 16 + 0) = √25 = **5** 입니다. y 좌표를 뺄 때 2 − (−2) = 4 인 부호 처리가 핵심입니다."},{"q":"원점 O 와 점 P(2, 3, 6) 사이의 거리는?","c":["5","6","7","11","√11"],"a":2,"h":["OP = √(x² + y² + z²) 입니다.","4 + 9 + 36 = 49. 이제 제곱근을 씌우세요."],"s":"OP = √(2² + 3² + 6²) = √(4 + 9 + 36) = √49 = **7** 입니다."},{"q":"두 점 A(1, 2, 3), B(5, 6, 7) 의 중점의 좌표는?","c":["(2, 3, 4)","(3, 4, 5)","(4, 4, 4)","(6, 8, 10)","(3, 4, 6)"],"a":1,"h":["중점은 각 좌표의 평균입니다.","(1+5)/2, (2+6)/2, (3+7)/2 를 각각 계산하세요."],"s":"중점 = ((1+5)/2, (2+6)/2, (3+7)/2) = **(3, 4, 5)** 입니다."},{"q":"중심이 (1, −2, 3) 이고 반지름이 4 인 구의 방정식은?","c":["(x−1)² + (y−2)² + (z−3)² = 4","(x−1)² + (y+2)² + (z−3)² = 16","(x+1)² + (y−2)² + (z+3)² = 16","(x−1)² + (y+2)² + (z−3)² = 4","(x+1)² + (y+2)² + (z+3)² = 16"],"a":1,"h":["구의 방정식은 (x−a)² + (y−b)² + (z−c)² = r² 입니다. 중심 좌표의 부호가 반대로 들어갑니다.","b = −2 이므로 (y − (−2))² = (y+2)². 그리고 우변은 r = 4 의 제곱인 16 입니다."],"s":"중심 (1, −2, 3), r = 4 이므로 **(x−1)² + (y+2)² + (z−3)² = 16** 입니다. y 항의 부호가 뒤집히는 것과, 우변이 r 이 아니라 r² = 16 이라는 두 가지를 모두 챙겨야 합니다."}]},{"id":"s3","title":"공간벡터의 성분과 크기","tagline":"평면벡터에 성분 하나만 더 붙었습니다. 계산 방법은 완전히 같습니다.","concept":[{"t":"10살에게 설명하면","b":"평면에서 화살표를 (오른쪽 몇 칸, 위로 몇 칸) 으로 적었죠. 공간에서는 여기에 (앞으로 몇 칸)이 하나 더 붙어 세 개가 됩니다. 그게 전부입니다."},{"t":"성분 표시","b":"a→ = (a₁, a₂, a₃)\n두 점 A(x₁,y₁,z₁), B(x₂,y₂,z₂) 에 대하여\n**AB→ = (x₂−x₁, y₂−y₁, z₂−z₁)**\n여기서도 「도착 − 출발」입니다."},{"t":"연산과 크기","b":"덧셈·뺄셈·실수배 모두 같은 자리끼리 계산합니다.\na→ + b→ = (a₁+b₁, a₂+b₂, a₃+b₃)\nk a→ = (ka₁, ka₂, ka₃)\n\n**크기**: |a→| = √(a₁² + a₂² + a₃²)\n피타고라스 정리를 두 번 쓴 결과로, 항 하나가 늘어난 것뿐입니다."},{"t":"두 벡터가 같을 조건","b":"(a₁, a₂, a₃) = (b₁, b₂, b₃) ⟺ a₁ = b₁, a₂ = b₂, a₃ = b₃\n세 성분이 **모두** 같아야 합니다. 미지수가 여러 개인 문제는 이렇게 연립방정식으로 바뀝니다."}],"formulas":[{"n":"두 점으로부터","f":"AB→ = (x₂−x₁, y₂−y₁, z₂−z₁)"},{"n":"크기","f":"|a→| = √(a₁² + a₂² + a₃²)"},{"n":"단위벡터","f":"[[a→||a→|]]"}],"mistake":"크기를 구할 때 z 성분을 빠뜨리는 실수가 잦습니다. 성분이 세 개면 제곱해서 더하는 항도 반드시 세 개여야 합니다.","example":{"q":"두 점 A(1, 0, 2), B(3, 2, 4) 에 대하여 AB→ 의 성분과 크기를 구하시오.","steps":["AB→ = (3−1, 2−0, 4−2) = (2, 2, 2)","|AB→| = √(2² + 2² + 2²) = √12","√12 = √(4×3) = 2√3"],"a":"AB→ = (2, 2, 2), |AB→| = 2√3"},"quiz":[{"q":"a→ = (1, −2, 2) 일 때 |a→| 의 값은?","c":["1","3","5","9","√5"],"a":1,"h":["세 성분을 모두 제곱해서 더한 뒤 제곱근을 씌웁니다.","1 + 4 + 4 = 9. 제곱근은?"],"s":"|a→| = √(1² + (−2)² + 2²) = √(1 + 4 + 4) = √9 = **3** 입니다."},{"q":"두 점 A(1, 0, 2), B(3, 2, 4) 에 대하여 |AB→| 의 값은?","c":["2","2√2","2√3","6","12"],"a":2,"h":["먼저 AB→ = (3−1, 2−0, 4−2) 를 구하세요.","AB→ = (2, 2, 2) 이므로 |AB→| = √12 입니다. √12 를 간단히 하세요."],"s":"AB→ = (2, 2, 2) 이므로 |AB→| = √(4+4+4) = √12 = **2√3** 입니다. √12 를 그대로 두지 말고 √(4×3) = 2√3 으로 정리하는 습관을 들이세요."},{"q":"a→ = (1, 2, −1), b→ = (3, −1, 2) 일 때 a→ + b→ 는?","c":["(4, 1, 1)","(4, 3, 1)","(−2, 3, −3)","(3, −2, −2)","(4, 1, 3)"],"a":0,"h":["같은 자리끼리 더하면 됩니다.","(1+3, 2+(−1), −1+2) 를 계산하세요."],"s":"a→ + b→ = (1+3, 2−1, −1+2) = **(4, 1, 1)** 입니다."},{"q":"a→ = (2, x, 4) 이고 |a→| = 6 일 때 실수 x 의 값은?","c":["4","±4","2","±2","±√6"],"a":1,"h":["|a→|² = 2² + x² + 4² = 36 이라는 식을 세우세요.","4 + x² + 16 = 36 에서 x² = 16 입니다. 해가 두 개인 점에 주의하세요."],"s":"4 + x² + 16 = 36 이므로 x² = 16, 따라서 x = **±4** 입니다. 제곱해서 푸는 문제는 항상 음수 해도 검토해야 합니다."}]},{"id":"s4","title":"공간벡터의 내적","tagline":"평면과 똑같습니다. 성분 곱이 세 개로 늘었을 뿐입니다.","concept":[{"t":"10살에게 설명하면","b":"평면벡터의 내적이 「가로끼리 곱하고 세로끼리 곱해서 더하기」였다면, 공간벡터는 여기에 「높이끼리 곱해서 더하기」가 하나 추가됩니다. 의미(두 화살표가 얼마나 같은 쪽을 보는가)도 완전히 같습니다."},{"t":"정의","b":"**기하적 정의**: a→ · b→ = |a→| |b→| cos θ\n**성분 정의**: a→ · b→ = a₁b₁ + a₂b₂ + a₃b₃\n\n결과는 벡터가 아니라 **실수**입니다."},{"t":"수직 조건과 이루는 각","b":"**수직**: a→ · b→ = 0 ⟺ a₁b₁ + a₂b₂ + a₃b₃ = 0 (단 두 벡터 모두 영벡터가 아님)\n**이루는 각**: cos θ = (a→·b→) / (|a→||b→|),  0° ≤ θ ≤ 180°\n\n평면벡터에서 쓰던 방법을 그대로 적용하면 됩니다."},{"t":"성질","b":"a→ · a→ = |a→|²\n|a→ ± b→|² = |a→|² ± 2(a→·b→) + |b→|²\n교환·분배법칙 성립\n\n평면벡터에서 성립하던 성질이 하나도 빠짐없이 그대로 성립합니다."}],"formulas":[{"n":"성분 정의","f":"a→ · b→ = a₁b₁ + a₂b₂ + a₃b₃"},{"n":"기하적 정의","f":"a→ · b→ = |a→| |b→| cos θ"},{"n":"이루는 각","f":"cos θ = [[a₁b₁ + a₂b₂ + a₃b₃|√(a₁²+a₂²+a₃²) · √(b₁²+b₂²+b₃²)]]"},{"n":"수직 조건","f":"a→ ⊥ b→  ⟺  a→ · b→ = 0"}],"mistake":"성분이 세 개인데 두 개만 곱해서 더하는 실수를 조심하세요. 특히 성분에 0이 섞여 있으면 무심코 건너뛰기 쉽습니다.","example":{"q":"a→ = (1, 1, 0), b→ = (0, 1, 1) 이 이루는 각을 구하시오.","steps":["내적: a→·b→ = 1×0 + 1×1 + 0×1 = 1","크기: |a→| = √(1+1+0) = √2,  |b→| = √(0+1+1) = √2","cos θ = 1 / (√2 × √2) = 1/2","0° ≤ θ ≤ 180° 에서 cos θ = 1/2 인 각은 θ = 60°"],"a":"60°"},"quiz":[{"q":"a→ = (1, 2, 3), b→ = (2, −1, 1) 일 때 a→ · b→ 의 값은?","c":["1","3","5","7","(2, −2, 3)"],"a":1,"h":["a₁b₁ + a₂b₂ + a₃b₃ 를 계산합니다. 세 항 모두 빠뜨리지 마세요.","1×2 + 2×(−1) + 3×1 = 2 − 2 + 3."],"s":"a→·b→ = 1×2 + 2×(−1) + 3×1 = 2 − 2 + 3 = **3** 입니다. 내적의 결과는 실수이므로 (2, −2, 3) 같은 성분으로 답하면 안 됩니다."},{"q":"a→ = (1, 1, 0), b→ = (0, 1, 1) 이 이루는 각은?","c":["30°","45°","60°","90°","120°"],"a":2,"h":["내적과 두 크기를 각각 구한 뒤 cos θ = (a·b)/(|a||b|) 에 넣으세요.","a→·b→ = 1, |a→| = |b→| = √2 이므로 cos θ = 1/2 입니다."],"s":"a→·b→ = 0 + 1 + 0 = 1, |a→| = |b→| = √2 이므로 cos θ = 1/(√2·√2) = 1/2, 따라서 θ = **60°** 입니다."},{"q":"두 벡터 a→ = (1, 2, k), b→ = (3, −1, 2) 가 서로 수직일 때 k 의 값은?","c":["[[1|2]]","−[[1|2]]","1","−1","2"],"a":1,"h":["수직이면 내적이 0 입니다. 식을 세우세요.","1×3 + 2×(−1) + k×2 = 0, 즉 3 − 2 + 2k = 0."],"s":"3 − 2 + 2k = 0 이므로 1 + 2k = 0, 따라서 k = **−1/2** 입니다."},{"q":"|a→| = 2, |b→| = 3 이고 두 벡터가 이루는 각이 60° 일 때 a→ · b→ 의 값은?","c":["1","3","6","[[3|2]]","3√3"],"a":1,"h":["성분이 없으므로 기하적 정의 |a→||b→| cos θ 를 씁니다.","2 × 3 × cos 60° = 6 × (1/2)."],"s":"a→·b→ = 2 × 3 × cos 60° = 6 × 1/2 = **3** 입니다. 이 정의는 평면·공간에 상관없이 똑같이 씁니다."}]}]},{"id":"math2","title":"수학Ⅱ","subtitle":"미분","tone":"#7c3aed","units":[{"id":"d1","title":"미분계수","tagline":"미분은 결국 「그 순간의 기울기」를 구하는 일입니다.","concept":[{"t":"10살에게 설명하면","b":"자동차 계기판을 생각해 보세요. 「1시간에 60km 갔다」는 **평균** 속도입니다. 하지만 계기판에 지금 찍힌 숫자는 **바로 이 순간**의 속도죠. 이 「지금 이 순간의 변화 속도」를 수학으로 구하는 것이 미분계수입니다."},{"t":"평균변화율 — 두 점을 잇는 기울기","b":"x가 a에서 b까지 변할 때\n**평균변화율 = Δy/Δx = (f(b) − f(a)) / (b − a)**\n\n이것은 그래프 위의 두 점 (a, f(a)) 와 (b, f(b)) 를 이은 **직선(할선)의 기울기**입니다."},{"t":"미분계수 — 두 점을 무한히 가깝게","b":"두 점을 점점 붙여서 아예 한 점이 되게 하면 어떻게 될까요? 할선은 **접선**이 됩니다.\n\n**f′(a) = lim(h→0) [f(a+h) − f(a)] / h**\n\n이 값을 x = a 에서의 미분계수라 하고, 그 뜻은 **점 (a, f(a)) 에서의 접선의 기울기**입니다."},{"t":"미분계수의 여러 얼굴","b":"같은 f′(a) 를 문제마다 다르게 씁니다. 전부 같은 것임을 알아보는 게 중요합니다.\nlim(h→0) [f(a+h) − f(a)]/h\nlim(x→a) [f(x) − f(a)]/(x − a)\nlim(h→0) [f(a+2h) − f(a)]/h = **2 f′(a)**  ← h의 계수만큼 배가 됩니다"},{"t":"미분가능과 연속의 관계","b":"**미분가능하면 연속입니다.** 하지만 **역은 성립하지 않습니다.**\n대표적 반례가 y = |x| 입니다. x = 0 에서 끊기지 않았지만(연속), 뾰족해서 접선을 하나로 정할 수 없습니다(미분 불가능).\n\n한 줄 요약: **끊긴 곳**과 **뾰족한 곳**에서는 미분할 수 없습니다."}],"svg":"<svg viewBox='0 0 320 170' role='img' aria-label='할선이 접선으로 가까워지는 과정'><path d='M30 145 Q120 145 175 90 T295 25' fill='none' stroke='#94a3b8' stroke-width='2.5'/><line x1='72' y1='142' x2='265' y2='42' stroke='#cbd5e1' stroke-width='2' stroke-dasharray='5 4'/><line x1='95' y1='150' x2='250' y2='75' stroke='#7c3aed' stroke-width='2.5'/><circle cx='140' cy='125' r='4.5' fill='#7c3aed'/><text x='120' y='118' font-size='12' fill='#7c3aed'>(a, f(a))</text><text x='210' y='40' font-size='11' fill='#94a3b8'>할선</text><text x='236' y='102' font-size='11' fill='#7c3aed'>접선: 기울기 = f′(a)</text></svg>","formulas":[{"n":"평균변화율","f":"[[f(b) − f(a)|b − a]]   (할선의 기울기)"},{"n":"미분계수","f":"f′(a) = lim(h→0) [[f(a+h) − f(a)|h]]"},{"n":"다른 형태","f":"f′(a) = lim(x→a) [[f(x) − f(a)|x − a]]"},{"n":"기하적 의미","f":"f′(a) = 점 (a, f(a)) 에서의 접선의 기울기"}],"mistake":"lim(h→0) [f(a+3h) − f(a)]/h 는 f′(a) 가 아니라 **3f′(a)** 입니다. 분모를 3h 로 맞추기 위해 3을 곱해 줘야 하기 때문입니다. 분자의 h 계수를 항상 확인하세요.","example":{"q":"f(x) = x² 일 때, x가 1에서 3까지 변할 때의 평균변화율과 f′(2) 를 각각 구하시오.","steps":["평균변화율 = (f(3) − f(1))/(3 − 1) = (9 − 1)/2 = 4","f′(2) = lim(h→0) [(2+h)² − 2²]/h","= lim(h→0) (4 + 4h + h² − 4)/h = lim(h→0) (4h + h²)/h","= lim(h→0) (4 + h) = 4"],"a":"평균변화율 4, f′(2) = 4"},"quiz":[{"q":"f(x) = x² 일 때, x 가 1에서 3까지 변할 때의 평균변화율은?","c":["2","3","4","6","8"],"a":2,"h":["평균변화율 = (f(3) − f(1)) / (3 − 1) 입니다.","f(3) = 9, f(1) = 1 이므로 (9−1)/2 를 계산하세요."],"s":"평균변화율 = (9 − 1)/(3 − 1) = 8/2 = **4** 입니다. 분모를 1로 착각해 8이라 답하지 않도록 주의하세요."},{"q":"f(x) = x² + 3x 일 때 f′(1) 의 값은?","c":["2","3","4","5","6"],"a":3,"h":["먼저 도함수 f′(x) = 2x + 3 을 구하세요.","f′(1) = 2(1) + 3 을 계산합니다."],"s":"f′(x) = 2x + 3 이므로 f′(1) = 2 + 3 = **5** 입니다. 정의로 계산해도 lim(h→0)[(1+h)²+3(1+h) − 4]/h = lim(h→0)(5h+h²)/h = 5 로 같습니다."},{"q":"lim(h→0) [[f(2+h) − f(2)|h]] 가 나타내는 것은?","c":["f(2)","f′(2)","f′(x)","x = 2 에서의 평균변화율","0"],"a":1,"h":["미분계수의 정의 그 자체입니다.","f′(a) = lim(h→0)[f(a+h) − f(a)]/h 에서 a = 2 입니다."],"s":"이 식은 미분계수의 정의에서 a = 2 인 경우이므로 **f′(2)**, 즉 x = 2 에서의 접선의 기울기를 뜻합니다."},{"q":"미분가능한 함수와 연속인 함수의 관계로 옳은 것은?","c":["연속이면 반드시 미분가능하다","미분가능하면 반드시 연속이다","둘은 아무 관계가 없다","미분가능하면 반드시 불연속이다","연속이면 반드시 미분 불가능하다"],"a":1,"h":["y = |x| 를 x = 0 에서 생각해 보세요. 끊겨 있나요? 뾰족한가요?","y = |x| 는 연속이지만 x = 0 에서 미분할 수 없습니다. 즉 한 방향만 성립합니다."],"s":"**미분가능하면 연속**이지만 그 역은 성립하지 않습니다. y = |x| 는 x = 0 에서 연속이지만 뾰족해서 접선의 기울기가 하나로 정해지지 않아 미분 불가능합니다."}]},{"id":"d2","title":"도함수와 미분법","tagline":"f′(a) 를 모든 a 에 대해 한꺼번에 구해 놓은 것이 도함수입니다.","concept":[{"t":"10살에게 설명하면","b":"미분계수 f′(2), f′(3), f′(5) … 를 매번 극한으로 계산하려면 너무 힘듭니다. 그래서 **x 자리에 그냥 x를 넣은 공식**을 한 번 만들어 둡니다. 그것이 도함수 f′(x) 입니다. 이제 필요한 값은 대입만 하면 됩니다."},{"t":"도함수의 정의","b":"**f′(x) = lim(h→0) [f(x+h) − f(x)] / h**\n\n표기법은 여러 가지입니다: f′(x), y′, dy/dx, d/dx f(x) — 전부 같은 뜻입니다."},{"t":"핵심 공식 — 이것만 알면 다항함수 끝","b":"**(xⁿ)′ = n x ⁿ⁻¹**  ← 지수를 앞으로 내리고, 지수를 1 줄인다\n**(상수)′ = 0**  ← 변하지 않으니 변화율도 0\n\n예: (x³)′ = 3x², (x)′ = 1, (5)′ = 0"},{"t":"계산 법칙","b":"{f(x) ± g(x)}′ = f′(x) ± g′(x)  (따로따로 미분)\n{c f(x)}′ = c f′(x)  (상수는 그대로 통과)\n\n**곱의 미분법**: {f(x) g(x)}′ = f′(x)g(x) + f(x)g′(x)\n「앞 미분 × 뒤 + 앞 × 뒤 미분」으로 외웁니다.\n주의: (fg)′ = f′g′ 는 **완전히 틀린 식**입니다."}],"formulas":[{"n":"기본 공식","f":"(xⁿ)′ = n xⁿ⁻¹,   (c)′ = 0"},{"n":"합·차","f":"(f ± g)′ = f′ ± g′"},{"n":"상수배","f":"(c f)′ = c f′"},{"n":"곱의 미분","f":"(f g)′ = f′ g + f g′"}],"mistake":"곱의 미분을 f′g′ 로 하는 것이 최악의 실수입니다. 반드시 **두 항의 합**입니다. 간단히 검산하려면 f = g = x 로 두고 (x·x)′ = (x²)′ = 2x 인지 확인해 보세요 — f′g′ = 1×1 = 1 이라 틀린 게 바로 보입니다.","example":{"q":"f(x) = (x² + 1)(x − 2) 의 도함수를 구하시오.","steps":["곱의 미분법을 씁니다. f = x²+1, g = x−2 로 두면 f′ = 2x, g′ = 1.","(fg)′ = f′g + fg′ = 2x(x − 2) + (x² + 1)(1)","= 2x² − 4x + x² + 1","= 3x² − 4x + 1","검산: 먼저 전개하면 f(x) = x³ − 2x² + x − 2 이고, 이를 미분해도 3x² − 4x + 1 로 같습니다."],"a":"3x² − 4x + 1"},"quiz":[{"q":"y = x³ − 2x² + 5x − 1 일 때 y′ 은?","c":["3x² − 4x + 5","3x² − 2x + 5","3x² − 4x + 4","x² − 4x + 5","3x² − 4x"],"a":0,"h":["각 항을 따로 미분합니다. (xⁿ)′ = n xⁿ⁻¹ 입니다.","x³ → 3x², −2x² → −4x, 5x → 5, −1 → 0."],"s":"y′ = 3x² − 4x + 5 입니다. 마지막 상수항 −1 은 미분하면 0이 되어 사라지고, 1차항 5x 는 5가 남습니다."},{"q":"f(x) = (x² + 1)(x − 2) 일 때 f′(x) 는?","c":["2x","3x² − 4x + 1","2x² − 4x","3x² − 4x − 1","2x(x − 2)"],"a":1,"h":["곱의 미분법 (fg)′ = f′g + fg′ 를 씁니다. 또는 먼저 전개한 뒤 미분해도 됩니다.","2x(x−2) + (x²+1)·1 을 전개해 정리하세요."],"s":"f′(x) = 2x(x−2) + (x²+1) = 2x² − 4x + x² + 1 = **3x² − 4x + 1** 입니다. 전개해서 f(x) = x³ − 2x² + x − 2 로 만든 뒤 미분해도 같은 결과가 나옵니다."},{"q":"f(x) = 2x⁴ 일 때 f′(x) 는?","c":["2x³","4x³","8x³","8x⁴","2x⁵"],"a":2,"h":["상수 2는 그대로 두고 x⁴ 만 미분합니다.","(x⁴)′ = 4x³ 이므로 2 × 4x³."],"s":"f′(x) = 2 × 4x³ = **8x³** 입니다. 상수배는 그대로 밖으로 통과합니다."},{"q":"f(x) = x³ 일 때 f′(2) 의 값은?","c":["6","8","12","3","24"],"a":2,"h":["먼저 f′(x) = 3x² 를 구하세요.","x = 2 를 대입: 3 × 2² = 3 × 4."],"s":"f′(x) = 3x² 이므로 f′(2) = 3 × 4 = **12** 입니다. f(2) = 8 과 헷갈리지 마세요 — 묻는 것은 함숫값이 아니라 미분계수입니다."}]},{"id":"d3","title":"합성함수의 미분 (연쇄법칙)","tagline":"「겉을 미분하고, 속을 미분해서 곱한다」 — 이 한 문장이 전부입니다.","concept":[{"t":"10살에게 설명하면","b":"톱니바퀴 두 개가 물려 돌아간다고 생각해 보세요. 첫 번째 바퀴가 2배 빨리 돌고, 그것에 물린 두 번째 바퀴가 또 3배 빨리 돈다면, 전체는 2 × 3 = 6배가 됩니다. 변화율끼리 **곱해진다**는 것이 연쇄법칙의 직관입니다."},{"t":"연쇄법칙","b":"**{f(g(x))}′ = f′(g(x)) · g′(x)**\n\n라이프니츠 표기로는 훨씬 외우기 쉽습니다:\n**dy/dx = (dy/du) × (du/dx)**\n마치 du 가 약분되는 것처럼 보이죠."},{"t":"가장 자주 쓰는 형태","b":"**[{g(x)}ⁿ]′ = n {g(x)}ⁿ⁻¹ · g′(x)**\n\n순서: ① 겉껍질(거듭제곱)을 먼저 미분 → ② 속(괄호 안)을 미분해서 곱하기.\n\n예: {(2x+1)³}′ = 3(2x+1)² × 2 = 6(2x+1)²\n마지막에 곱하는 **× 2** 를 빠뜨리는 것이 최다 실수입니다."},{"t":"속을 미분하는 걸 잊지 않는 법","b":"괄호 안이 그냥 x 인지 확인하는 습관을 들이세요. (x+1)³ 이면 속의 미분이 1이라 티가 안 나지만, (2x+1)³ 이면 2가, (x²+1)³ 이면 2x 가 반드시 곱해집니다."}],"formulas":[{"n":"연쇄법칙","f":"{f(g(x))}′ = f′(g(x)) · g′(x)"},{"n":"라이프니츠 표기","f":"[[dy|dx]] = [[dy|du]] × [[du|dx]]"},{"n":"거듭제곱 꼴","f":"[{g(x)}ⁿ]′ = n {g(x)}ⁿ⁻¹ g′(x)"}],"mistake":"속미분 g′(x) 를 곱하지 않는 실수가 압도적 1위입니다. {(2x+1)³}′ = 3(2x+1)² 로 끝내면 오답입니다. **답을 쓰기 전에 「속 미분 곱했나?」를 한 번 더 확인**하세요.","example":{"q":"y = (x² + 1)⁴ 의 도함수를 구하시오.","steps":["겉은 (   )⁴ 이고 속은 x² + 1 입니다.","겉 미분: 4(x² + 1)³","속 미분: (x² + 1)′ = 2x","곱합니다: 4(x² + 1)³ × 2x = 8x(x² + 1)³"],"a":"8x(x² + 1)³"},"quiz":[{"q":"y = (2x + 1)³ 일 때 y′ 은?","c":["3(2x + 1)²","6(2x + 1)²","2(2x + 1)²","6(2x + 1)³","3(2x + 1)³"],"a":1,"h":["겉을 먼저 미분하면 3(2x+1)² 입니다. 아직 끝이 아닙니다.","속 (2x+1) 의 미분은 2 입니다. 이것을 곱하세요."],"s":"y′ = 3(2x+1)² × 2 = **6(2x+1)²** 입니다. 속미분 2를 곱하지 않아 3(2x+1)² 에서 멈추는 것이 가장 흔한 오답입니다."},{"q":"y = (x² + 1)⁴ 일 때 y′ 은?","c":["4(x² + 1)³","8x(x² + 1)³","4x(x² + 1)³","8(x² + 1)³","2x(x² + 1)³"],"a":1,"h":["겉 미분은 4(x²+1)³ 입니다. 속 (x²+1) 의 미분은 무엇인가요?","속미분은 2x 이므로 4(x²+1)³ × 2x 를 정리하세요."],"s":"y′ = 4(x²+1)³ × 2x = **8x(x²+1)³** 입니다. 4 × 2x = 8x 로 계수를 정리하는 것까지 마무리해야 합니다."},{"q":"y = (3x − 1)⁵ 일 때 x = 1 에서의 미분계수는?","c":["80","160","240","320","480"],"a":2,"h":["먼저 y′ = 5(3x−1)⁴ × 3 = 15(3x−1)⁴ 를 구하세요.","x = 1 을 대입하면 3x−1 = 2 이므로 15 × 2⁴ 입니다."],"s":"y′ = 15(3x−1)⁴ 이고 x = 1 일 때 3x−1 = 2 이므로 y′(1) = 15 × 16 = **240** 입니다."},{"q":"y = (x² − x)² 일 때 y′ 은?","c":["2(x² − x)","2(x² − x)(2x − 1)","(2x − 1)²","2x(2x − 1)","2(x² − x)(2x)"],"a":1,"h":["겉 미분은 2(x² − x) 입니다. 속 (x² − x) 의 미분은?","속미분은 2x − 1 입니다. 두 개를 곱하세요."],"s":"y′ = 2(x² − x) × (2x − 1) = **2(x² − x)(2x − 1)** 입니다. 전개하면 4x³ − 6x² + 2x 가 되며, 원래 식을 x⁴ − 2x³ + x² 로 전개해 미분해도 같은 결과가 나옵니다."}]},{"id":"d4","title":"함수의 증가와 감소","tagline":"f′(x) 의 부호만 보면 그래프가 오르는지 내리는지 알 수 있습니다.","concept":[{"t":"10살에게 설명하면","b":"미분계수는 그 지점의 **기울기**였습니다. 산길을 걷는데 기울기가 양수면 오르막, 음수면 내리막이죠. 함수도 똑같습니다. **f′(x) > 0 이면 올라가고, f′(x) < 0 이면 내려갑니다.**"},{"t":"판정 기준","b":"어떤 구간에서\n**f′(x) > 0 → 그 구간에서 증가**\n**f′(x) < 0 → 그 구간에서 감소**\n\n반대 방향도 「거의」 성립합니다: 증가하면 f′(x) ≥ 0 (등호가 붙습니다). y = x³ 은 항상 증가하지만 x = 0 에서 f′(0) = 0 이기 때문입니다."},{"t":"증가·감소 구간을 찾는 순서","b":"① f′(x) 를 구한다\n② f′(x) = 0 이 되는 x 를 모두 찾는다 (경계 후보)\n③ 그 점들로 수직선을 나누고 각 구간에서 f′(x) 의 **부호**를 조사한다\n④ 표(증감표)로 정리한다\n\n부호 조사는 각 구간에서 아무 값이나 하나 대입해 보는 것이 가장 빠릅니다."},{"t":"항상 증가하는 함수","b":"삼차함수 f(x) = ax³ + bx² + cx + d (a > 0) 가 **실수 전체에서 증가**할 조건은 f′(x) = 3ax² + 2bx + c ≥ 0 이 항상 성립하는 것, 즉 판별식 **D ≤ 0** 입니다.\n예: f(x) = x³ + 3x → f′(x) = 3x² + 3 > 0 이므로 항상 증가."}],"formulas":[{"n":"증가 판정","f":"f′(x) > 0  →  증가"},{"n":"감소 판정","f":"f′(x) < 0  →  감소"},{"n":"항상 증가 조건 (삼차, a>0)","f":"f′(x) = 3ax² + 2bx + c 의 판별식 D ≤ 0"}],"mistake":"f′(x) = 0 인 점 자체는 증가도 감소도 아닌 「경계」입니다. 구간을 답할 때 그 점을 포함할지 말지 헷갈린다면, 보통 **닫힌구간으로 써도 무방**합니다(연속이므로). 더 큰 실수는 f′(x)를 구하지 않고 f(x) 의 부호를 보는 것입니다.","example":{"q":"f(x) = x³ − 3x 의 증가 구간과 감소 구간을 구하시오.","steps":["f′(x) = 3x² − 3 = 3(x² − 1) = 3(x + 1)(x − 1)","f′(x) = 0 인 점: x = −1, x = 1","x < −1 일 때 (예: x = −2) f′ = 3(−1)(−3) = 9 > 0 → 증가","−1 < x < 1 일 때 (예: x = 0) f′ = 3(1)(−1) = −3 < 0 → 감소","x > 1 일 때 (예: x = 2) f′ = 3(3)(1) = 9 > 0 → 증가"],"a":"증가: x ≤ −1 과 x ≥ 1, 감소: −1 ≤ x ≤ 1"},"quiz":[{"q":"f(x) = x³ − 3x 가 감소하는 구간은?","c":["x < −1","−1 < x < 1","x > 1","모든 실수","0 < x < 1"],"a":1,"h":["f′(x) = 3x² − 3 을 인수분해하면 3(x+1)(x−1) 입니다.","이 이차식이 음수가 되는 구간은 두 근 사이입니다."],"s":"f′(x) = 3(x+1)(x−1) 이 음수인 구간은 두 근 −1 과 1 **사이**이므로 **−1 < x < 1** 에서 감소합니다. 위로 볼록한 포물선이 아니라 아래로 볼록한 포물선이므로 「사이에서 음수」가 맞습니다."},{"q":"f(x) = x² − 4x 가 증가하는 구간은?","c":["x < 2","x > 2","x < 0","x > 4","모든 실수"],"a":1,"h":["f′(x) = 2x − 4 입니다. 이 값이 양수가 되는 x 를 구하세요.","2x − 4 > 0 을 풀면 x > 2 입니다."],"s":"f′(x) = 2x − 4 > 0 에서 **x > 2** 일 때 증가합니다. 이차함수의 꼭짓점이 x = 2 이고 그 오른쪽에서 올라가는 것과 일치합니다."},{"q":"f(x) = x³ + 3x 에 대한 설명으로 옳은 것은?","c":["모든 실수에서 증가한다","모든 실수에서 감소한다","x > 0 에서만 증가한다","극댓값과 극솟값을 모두 가진다","x = 0 에서 극솟값을 가진다"],"a":0,"h":["f′(x) = 3x² + 3 을 구한 뒤, 이 값이 음수가 될 수 있는지 확인해 보세요.","3x² ≥ 0 이므로 3x² + 3 ≥ 3 > 0 입니다. 도함수가 절대 0이 되지 않네요."],"s":"f′(x) = 3x² + 3 은 항상 3 이상이라 **모든 실수에서 f′(x) > 0**, 즉 항상 증가합니다. f′(x) = 0 인 점이 없으므로 극값도 존재하지 않습니다."},{"q":"f(x) = −x³ + 3x² 가 증가하는 구간은?","c":["x < 0","0 < x < 2","x > 2","모든 실수","−2 < x < 0"],"a":1,"h":["f′(x) = −3x² + 6x 를 인수분해하면 −3x(x − 2) 입니다.","최고차항의 계수가 음수(위로 볼록한 포물선)이므로 두 근 사이에서 양수가 됩니다."],"s":"f′(x) = −3x(x−2) 이고 −3 < 0 이므로 위로 볼록한 포물선입니다. 따라서 두 근 0 과 2 **사이**에서 f′(x) > 0 이 되어 **0 < x < 2** 에서 증가합니다. 최고차항의 부호에 따라 「사이」인지 「바깥」인지 뒤집힌다는 점이 핵심입니다."}]},{"id":"d5","title":"극대와 극소","tagline":"「오르다가 내려가면 극대, 내려가다가 오르면 극소」입니다.","concept":[{"t":"10살에게 설명하면","b":"산을 오르다가 정상을 지나 내려가기 시작하는 지점 — 그곳이 **극대**입니다. 반대로 계곡 바닥을 지나 다시 올라가기 시작하는 지점이 **극소**입니다. 「그 근처에서 가장 높은/낮은 곳」이지, 반드시 전체에서 최고/최저인 것은 아닙니다."},{"t":"판정 방법 — 부호 변화가 핵심","b":"f′(a) = 0 이고, x = a 의 좌우에서 f′(x) 의 부호가\n**+ → −** 로 바뀌면 x = a 에서 **극대**, 그때 f(a) 가 극댓값\n**− → +** 로 바뀌면 x = a 에서 **극소**, 그때 f(a) 가 극솟값\n\n부호가 **바뀌지 않으면 극값이 아닙니다.**"},{"t":"가장 중요한 주의점","b":"**f′(a) = 0 이라고 해서 반드시 극값인 것은 아닙니다.**\n\n반례: f(x) = x³ 에서 f′(x) = 3x² 이므로 f′(0) = 0 입니다. 하지만 x = 0 좌우 모두 f′(x) > 0 이라 계속 증가만 합니다. 즉 x = 0 은 극값이 아닙니다.\n\n정리하면 「f′(a) = 0」은 극값의 **필요조건**일 뿐 충분조건이 아닙니다."},{"t":"극값 문제 푸는 순서","b":"① f′(x) 를 구하고 f′(x) = 0 인 x 를 모두 찾는다\n② 각 x 좌우에서 f′ 의 부호를 조사한다 (증감표)\n③ 부호가 바뀌는 곳에서 f(x) 값을 계산한다\n\n② 를 건너뛰고 바로 ③ 으로 가면 x³ 같은 함정에 걸립니다."},{"t":"극값과 최댓값의 차이","b":"**극값**은 주변과 비교한 국소적인 값이고, **최댓값·최솟값**은 주어진 구간 전체에서 비교한 값입니다. 닫힌구간 [a, b] 에서 최대·최소를 구할 때는 **극값들과 양 끝점의 함숫값을 모두 비교**해야 합니다."}],"svg":"<svg viewBox='0 0 320 170' role='img' aria-label='삼차함수의 극대와 극소'><line x1='20' y1='95' x2='300' y2='95' stroke='#e2e8f0' stroke-width='1.5'/><path d='M35 155 C80 40, 120 40, 160 95 C200 150, 240 150, 290 30' fill='none' stroke='#7c3aed' stroke-width='2.5'/><circle cx='100' cy='53' r='4.5' fill='#c2410c'/><circle cx='222' cy='137' r='4.5' fill='#0891b2'/><text x='74' y='40' font-size='12' fill='#c2410c'>극대</text><text x='206' y='158' font-size='12' fill='#0891b2'>극소</text><text x='110' y='72' font-size='11' fill='#64748b'>f′ : + → −</text><text x='232' y='125' font-size='11' fill='#64748b'>f′ : − → +</text></svg>","formulas":[{"n":"극대 조건","f":"f′(a) = 0 이고 f′ 의 부호가 + → −"},{"n":"극소 조건","f":"f′(a) = 0 이고 f′ 의 부호가 − → +"},{"n":"주의","f":"f′(a) = 0 은 필요조건일 뿐 (반례: y = x³)"}],"mistake":"극댓값을 물었는데 **극대가 되는 x 값**을 답하는 실수가 매우 흔합니다. 극댓값은 f(a) 이지 a 가 아닙니다. 문제가 「극댓값」인지 「극대가 되는 점」인지 꼭 다시 읽으세요.","example":{"q":"f(x) = x³ − 3x² + 1 의 극댓값과 극솟값을 구하시오.","steps":["f′(x) = 3x² − 6x = 3x(x − 2)","f′(x) = 0 인 x: x = 0, x = 2","x < 0 : f′ > 0 (증가) / 0 < x < 2 : f′ < 0 (감소) / x > 2 : f′ > 0 (증가)","x = 0 에서 + → − 이므로 극대. f(0) = 1 → 극댓값 1","x = 2 에서 − → + 이므로 극소. f(2) = 8 − 12 + 1 = −3 → 극솟값 −3"],"a":"극댓값 1, 극솟값 −3"},"quiz":[{"q":"f(x) = x³ − 3x 의 극댓값은?","c":["−2","−1","0","1","2"],"a":4,"h":["f′(x) = 3x² − 3 = 3(x+1
