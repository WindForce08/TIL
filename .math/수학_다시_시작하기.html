)(x−1) 이므로 x = ±1 이 후보입니다. 어느 쪽이 극대일까요?","x = −1 에서 f′ 부호가 + → − 로 바뀌므로 극대입니다. f(−1) 을 계산하세요."],"s":"f′(x) = 3(x+1)(x−1) 이고 x = −1 좌우에서 부호가 + → − 로 바뀌므로 x = −1 에서 극대입니다. 극댓값은 f(−1) = (−1)³ − 3(−1) = −1 + 3 = **2** 입니다. (x = −1 자체가 답이 아님에 주의)"},{"q":"f(x) = x³ − 3x² + 1 의 극솟값은?","c":["1","−1","−3","2","−5"],"a":2,"h":["f′(x) = 3x² − 6x = 3x(x−2) 이므로 후보는 x = 0, 2 입니다.","x = 2 에서 f′ 부호가 − → + 이므로 극소입니다. f(2) = 8 − 12 + 1 을 계산하세요."],"s":"x = 2 에서 f′ 의 부호가 − → + 로 바뀌므로 극소입니다. 극솟값은 f(2) = 8 − 12 + 1 = **−3** 입니다. (x = 0 에서는 극댓값 f(0) = 1 을 가집니다.)"},{"q":"f(x) = x³ 에 대하여 f′(0) = 0 이다. 이때 x = 0 에서 이 함수는?","c":["극댓값을 가진다","극솟값을 가진다","극값을 가지지 않는다","불연속이다","미분 불가능하다"],"a":2,"h":["f′(x) = 3x² 의 부호를 x = 0 의 좌우에서 각각 확인해 보세요.","x < 0 이든 x > 0 이든 3x² > 0 입니다. 부호가 바뀌지 않네요."],"s":"f′(x) = 3x² 은 x = 0 을 제외하면 항상 양수이므로 **부호 변화가 없습니다**. 따라서 x = 0 에서 **극값을 가지지 않습니다**. 「f′(a) = 0 이면 극값」이라는 잘못된 믿음을 깨 주는 대표 반례입니다."},{"q":"f(x) = −x² + 4x 의 극댓값은?","c":["2","4","−4","0","8"],"a":1,"h":["f′(x) = −2x + 4 = 0 에서 x = 2 입니다.","극댓값은 x = 2 일 때의 **함숫값** f(2) 입니다. f(2) = −4 + 8."],"s":"f′(x) = −2x + 4 = 0 에서 x = 2 이고, 좌우 부호가 + → − 이므로 극대입니다. 극댓값은 f(2) = −(2)² + 4(2) = −4 + 8 = **4** 입니다. 극대가 되는 x 값인 2를 그대로 답으로 고르는 실수를 조심하세요."}]}]},{"id":"calculus","title":"미적분","subtitle":"극한·연속·미분","tone":"#be123c","units":[{"id":"k1","title":"수열의 극한","tagline":"번호 n을 무한히 키웠을 때 수열이 「어디에 가까워지는가」를 봅니다.","concept":[{"t":"10살에게 설명하면","b":"1/2, 1/4, 1/8, 1/16, … 을 계속 반으로 줄여 나가면 어떻게 될까요? 0이 되지는 않지만 **0에 한없이 가까워집니다**. 이럴 때 「이 수열은 0에 수렴한다」고 말합니다."},{"t":"수렴과 발산","b":"**수렴**: aₙ 이 어떤 값 α 에 한없이 가까워짐 → lim(n→∞) aₙ = α\n**발산**: 수렴하지 않음. ① 양의 무한대로 발산 ② 음의 무한대로 발산 ③ 진동(예: (−1)ⁿ)\n\n중요: **∞ 는 값이 아니라 상태**입니다. 「극한값이 ∞ 이다」가 아니라 「발산한다」고 말하는 것이 정확합니다."},{"t":"∞/∞ 꼴 — 최고차항으로 나눈다","b":"분자·분모 모두 무한대로 갈 때는 **분모의 최고차항으로 분자·분모를 모두 나눕니다**.\n\n예: (3n² + 2n)/(n² + 1) 의 분자·분모를 n² 으로 나누면 (3 + 2/n)/(1 + 1/n²) → 3/1 = 3\n\n요령: **(분자 차수) vs (분모 차수)** 만 비교해도 답이 보입니다.\n분자 차수 > 분모 차수 → 발산 (∞)\n분자 차수 = 분모 차수 → 최고차항 계수의 비\n분자 차수 < 분모 차수 → 0"},{"t":"∞ − ∞ 꼴 — 유리화한다","b":"√ 가 섞인 뺄셈은 켤레식을 곱해 유리화합니다.\n\n예: √(n²+n) − n = [(n²+n) − n²] / [√(n²+n) + n] = n / [√(n²+n) + n]\n분자·분모를 n 으로 나누면 1 / [√(1 + 1/n) + 1] → 1/(1+1) = **1/2**"},{"t":"등비수열 rⁿ 의 극한","b":"**r > 1** → ∞ 로 발산\n**r = 1** → 1 로 수렴\n**−1 < r < 1** → 0 으로 수렴\n**r ≤ −1** → 진동(발산)\n\n한 줄 요약: **|r| < 1 이면 0, r = 1 이면 1, 나머지는 발산.**"}],"formulas":[{"n":"∞/∞ 꼴","f":"분모의 최고차항으로 분자·분모를 나눈다"},{"n":"차수 비교","f":"분자>분모 → 발산,  같음 → 계수비,  분자<분모 → 0"},{"n":"∞−∞ 꼴","f":"켤레식을 곱해 유리화한다"},{"n":"등비수열","f":"lim rⁿ :  |r|<1 → 0,  r=1 → 1,  그 외 → 발산"}],"mistake":"∞ − ∞ 를 0 이라고 하거나 ∞/∞ 를 1 이라고 하는 것은 **틀린 계산**입니다. 이런 꼴은 「부정형」이라 해서, 실제 값은 식에 따라 얼마든지 달라집니다. 반드시 변형해서 부정형을 없앤 뒤 극한을 취하세요.","example":{"q":"lim(n→∞) [√(n² + n) − n] 의 값을 구하시오.","steps":["∞ − ∞ 꼴이므로 그대로 계산할 수 없습니다. 켤레식 √(n²+n) + n 을 분자·분모에 곱합니다.","= lim [(n² + n) − n²] / [√(n²+n) + n] = lim n / [√(n²+n) + n]","분자·분모를 n 으로 나눕니다: = lim 1 / [√(1 + 1/n) + 1]","n → ∞ 이면 1/n → 0 이므로 = 1 / (1 + 1) = 1/2"],"a":"1/2"},"quiz":[{"q":"lim(n→∞) [[3n² + 2n|n² + 1]] 의 값은?","c":["0","2","3","5","발산한다"],"a":2,"h":["분자와 분모의 차수가 같습니다. 이럴 때는 최고차항의 계수만 비교하면 됩니다.","분자·분모를 n² 으로 나누면 (3 + 2/n)/(1 + 1/n²) 이고, n→∞ 이면 2/n 과 1/n² 은 0으로 갑니다."],"s":"분자·분모를 n² 으로 나누면 (3 + 2/n)/(1 + 1/n²) → **3** 입니다. 차수가 같으면 최고차항 계수의 비 3/1 = 3 이 답이라는 요령으로 바로 구할 수도 있습니다."},{"q":"lim(n→∞) [[2n + 1|n² + 3]] 의 값은?","c":["0","[[1|3]]","2","∞","[[2|3]]"],"a":0,"h":["분자는 1차, 분모는 2차입니다. 어느 쪽이 더 빨리 커질까요?","분모가 훨씬 빨리 커지므로 전체 값은 점점 작아집니다."],"s":"분자의 차수(1)가 분모의 차수(2)보다 작으므로 극한값은 **0** 입니다. 분자·분모를 n² 으로 나누면 (2/n + 1/n²)/(1 + 3/n²) → 0/1 = 0 으로 확인됩니다."},{"q":"lim(n→∞) [√(n² + n) − n] 의 값은?","c":["0","[[1|2]]","1","2","∞"],"a":1,"h":["∞ − ∞ 꼴이므로 0이라고 답하면 안 됩니다. 켤레식을 곱해 유리화하세요.","√(n²+n) + n 을 분자·분모에 곱하면 n / [√(n²+n) + n] 이 됩니다. 이제 n 으로 나누세요."],"s":"유리화하면 n/[√(n²+n) + n] 이고, 분자·분모를 n 으로 나누면 1/[√(1+1/n) + 1] → 1/2 이므로 답은 **1/2** 입니다. ∞ − ∞ 를 0으로 처리하는 것이 대표적 오답입니다."},{"q":"lim(n→∞) ([[1|2]])ⁿ 의 값은?","c":["0","[[1|2]]","1","∞","진동한다"],"a":0,"h":["등비수열 rⁿ 의 극한은 r 의 크기에 따라 결정됩니다. 여기서 r = 1/2 입니다.","|r| < 1 이면 0으로 수렴합니다."],"s":"r = 1/2 이고 |r| < 1 이므로 lim (1/2)ⁿ = **0** 입니다. 실제로 1/2, 1/4, 1/8, … 로 점점 0에 가까워집니다."},{"q":"lim(n→∞) [[n² + 1|2n + 3]] 에 대한 설명으로 옳은 것은?","c":["0 으로 수렴한다","[[1|2]] 로 수렴한다","2 로 수렴한다","양의 무한대로 발산한다","진동한다"],"a":3,"h":["분자는 2차, 분모는 1차입니다. 어느 쪽이 더 빨리 커지나요?","분자가 훨씬 빨리 커지므로 값이 한없이 커집니다."],"s":"분자의 차수(2)가 분모의 차수(1)보다 크므로 **양의 무한대로 발산**합니다. 분자·분모를 n 으로 나누면 (n + 1/n)/(2 + 3/n) 이 되어 분자가 무한대로 감을 확인할 수 있습니다."}]},{"id":"k2","title":"급수","tagline":"무한히 많은 수를 더하는 것. 놀랍게도 유한한 값이 되기도 합니다.","concept":[{"t":"10살에게 설명하면","b":"1/2 + 1/4 + 1/8 + … 을 끝없이 더하면 무한대가 될 것 같지만, 실제로는 **1에 가까워집니다**. 케이크를 반씩 계속 잘라 먹으면 아무리 먹어도 케이크 한 개를 넘지 못하는 것과 같습니다."},{"t":"급수와 부분합","b":"수열 aₙ 을 무한히 더한 것을 급수라 하고 Σ(n=1→∞) aₙ 로 씁니다.\n앞에서 n개까지만 더한 것을 **부분합** Sₙ 이라 합니다.\n\n**급수가 수렴한다 ⟺ 부분합의 수열 Sₙ 이 수렴한다**\n즉 급수의 값은 lim(n→∞) Sₙ 입니다. 무한히 더하는 것을 「수열의 극한」 문제로 바꾸는 것이 핵심 아이디어입니다."},{"t":"등비급수 — 가장 자주 나오는 유형","b":"첫째항 a, 공비 r 인 등비급수 a + ar + ar² + …\n**|r| < 1 이면 수렴하고 그 합은 a / (1 − r)**\n**|r| ≥ 1 이면 발산** (단 a = 0 이면 항상 0으로 수렴)\n\n공식을 쓰기 전에 반드시 **|r| < 1 인지 확인**하는 습관을 들이세요."},{"t":"수렴 판정의 필요조건","b":"**급수 Σaₙ 이 수렴하면 lim aₙ = 0 입니다.**\n하지만 **역은 성립하지 않습니다**. 유명한 반례가 조화급수 Σ(1/n) 입니다 — 1/n → 0 이지만 급수는 무한대로 발산합니다.\n\n실전 활용: lim aₙ ≠ 0 이면 그 급수는 **확실히 발산**합니다. 이건 매우 쓸모 있는 판정법입니다."},{"t":"부분분수 — 망원경처럼 접히는 급수","b":"1/(n(n+1)) = 1/n − 1/(n+1) 로 쪼개면 부분합에서 중간 항들이 서로 지워집니다.\nSₙ = (1 − 1/2) + (1/2 − 1/3) + … + (1/n − 1/(n+1)) = 1 − 1/(n+1)\n따라서 lim Sₙ = **1**."}],"formulas":[{"n":"급수의 정의","f":"Σ aₙ = lim(n→∞) Sₙ   (Sₙ 은 부분합)"},{"n":"등비급수의 합","f":"[[a|1 − r]]   (단 |r| < 1)"},{"n":"수렴의 필요조건","f":"Σ aₙ 수렴  →  lim aₙ = 0  (역은 거짓)"},{"n":"부분분수","f":"[[1|n(n+1)]] = [[1|n]] − [[1|n+1]]"}],"mistake":"「lim aₙ = 0 이면 급수가 수렴한다」는 **틀린 명제**입니다. Σ(1/n) 이 반례입니다. 방향을 반대로 외우지 않도록 주의하세요 — 수렴 ⟹ 0 이지, 0 ⟹ 수렴이 아닙니다.","example":{"q":"급수 Σ(n=1→∞) 3(1/3)ⁿ⁻¹ 의 합을 구하시오.","steps":["항을 나열하면 3, 3(1/3), 3(1/3)², … 이므로 첫째항 a = 3, 공비 r = 1/3 인 등비급수입니다.","|r| = 1/3 < 1 이므로 수렴합니다.","합 = a/(1 − r) = 3 / (1 − 1/3) = 3 / (2/3)","= 3 × 3/2 = 9/2"],"a":"9/2"},"quiz":[{"q":"급수 Σ(n=1→∞) ([[1|2]])ⁿ⁻¹ 의 합은?","c":["[[1|2]]","1","[[3|2]]","2","발산한다"],"a":3,"h":["첫째항과 공비를 찾으세요. n = 1 일 때 항의 값이 첫째항입니다.","a = 1, r = 1/2 이므로 a/(1−r) = 1/(1 − 1/2) 입니다."],"s":"n = 1 일 때 (1/2)⁰ = 1 이므로 a = 1, r = 1/2 입니다. |r| < 1 이므로 합은 1/(1 − 1/2) = 1/(1/2) = **2** 입니다."},{"q":"급수 Σ(n=1→∞) 3([[1|3]])ⁿ⁻¹ 의 합은?","c":["3","[[9|2]]","[[3|2]]","9","발산한다"],"a":1,"h":["a = 3, r = 1/3 입니다. a/(1−r) 에 대입하세요.","3 ÷ (1 − 1/3) = 3 ÷ (2/3) 입니다. 분수로 나누는 것은 역수를 곱하는 것입니다."],"s":"합 = 3/(1 − 1/3) = 3 ÷ (2/3) = 3 × 3/2 = **9/2** 입니다."},{"q":"급수 Σ(n=1→∞) [[1|n(n+1)]] 의 합은?","c":["0","[[1|2]]","1","2","발산한다"],"a":2,"h":["1/(n(n+1)) 을 부분분수로 쪼개 보세요. 1/n − 1/(n+1) 입니다.","부분합 Sₙ 을 써 보면 중간 항들이 모두 지워지고 1 − 1/(n+1) 만 남습니다."],"s":"부분분수로 쪼개면 Sₙ = (1 − 1/2) + (1/2 − 1/3) + … + (1/n − 1/(n+1)) = 1 − 1/(n+1) 입니다. n → ∞ 이면 1/(n+1) → 0 이므로 합은 **1** 입니다."},{"q":"급수 Σ aₙ 이 수렴할 때 항상 옳은 것은?","c":["lim aₙ = 0","aₙ > 0","lim aₙ 은 존재하지 않는다","aₙ 은 등비수열이다","Σ aₙ = 0"],"a":0,"h":["급수가 수렴하려면 더해지는 항들이 점점 어떻게 되어야 할까요?","항이 0으로 가지 않으면 계속 더해져서 값이 안정될 수 없습니다."],"s":"급수가 수렴하면 반드시 **lim aₙ = 0** 입니다(수렴의 필요조건). 다만 역은 성립하지 않아, Σ(1/n) 처럼 항이 0으로 가도 발산하는 급수가 있습니다."}]},{"id":"k3","title":"함수의 극한","tagline":"x 를 a 에 「가까이」 보냈을 때 f(x) 가 어디로 가는지 봅니다. f(a) 와는 다른 이야기입니다.","concept":[{"t":"10살에게 설명하면","b":"친구 집 앞까지 걸어가면서 「점점 무엇이 보이는가」를 묻는 것이 극한입니다. 실제로 그 집에 도착했을 때 무엇이 있는지(= 함숫값 f(a))와는 **다른 질문**입니다. 도착지가 비어 있어도 가는 길에 보이는 것은 있을 수 있으니까요."},{"t":"좌극한과 우극한","b":"왼쪽에서 다가갈 때의 값 lim(x→a⁻) f(x) 를 좌극한,\n오른쪽에서 다가갈 때의 값 lim(x→a⁺) f(x) 를 우극한이라 합니다.\n\n**극한이 존재한다 ⟺ 좌극한 = 우극한**\n둘이 다르면 극한은 존재하지 않습니다."},{"t":"0/0 꼴 — 인수분해 또는 유리화","b":"그대로 대입해서 0/0 이 나오면 **약분할 것이 반드시 있습니다.**\n\n인수분해: lim(x→2) (x²−4)/(x−2) = lim (x+2)(x−2)/(x−2) = lim (x+2) = **4**\n유리화: √ 가 있으면 켤레식을 곱합니다.\n\nx → 2 라고 해서 x = 2 는 아니므로 (x − 2) 로 나누는 것이 허용됩니다."},{"t":"꼭 외워야 할 극한 공식","b":"**lim(x→0) sin x / x = 1**  (x는 반드시 라디안!)\n**lim(x→0) tan x / x = 1**\n**lim(x→0) (1 + x)^(1/x) = e**,  lim(x→∞) (1 + 1/x)ˣ = e\n**lim(x→0) (eˣ − 1)/x = 1**\n**lim(x→0) ln(1 + x)/x = 1**\n\n활용법: lim(x→0) sin 3x / x 처럼 계수가 붙으면 **분모를 3x 로 맞추고 3을 곱합니다** → 3."}],"formulas":[{"n":"극한의 존재","f":"lim(x→a) f(x) 존재  ⟺  좌극한 = 우극한"},{"n":"삼각함수 극한","f":"lim(x→0) [[sin x|x]] = 1,   lim(x→0) [[tan x|x]] = 1"},{"n":"자연상수 e","f":"lim(x→0) (1 + x)^(1/x) = e"},{"n":"지수·로그 극한","f":"lim(x→0) [[eˣ − 1|x]] = 1,   lim(x→0) [[ln(1+x)|x]] = 1"}],"mistake":"lim(x→a) f(x) 와 f(a) 는 **다른 것**입니다. 구멍이 뚫린 그래프에서는 극한값은 있지만 함숫값이 없거나 다를 수 있습니다. 이 구분이 바로 다음 단원 「연속」의 핵심이 됩니다.","example":{"q":"lim(x→0) sin 3x / x 의 값을 구하시오.","steps":["공식 lim(x→0) sin θ/θ = 1 을 쓰려면 분모가 3x 여야 합니다.","sin 3x / x = (sin 3x / 3x) × 3 으로 변형합니다.","x → 0 이면 3x → 0 이므로 sin 3x / 3x → 1","따라서 극한값은 1 × 3 = 3"],"a":"3"},"quiz":[{"q":"lim(x→2) [[x² − 4|x − 2]] 의 값은?","c":["0","2","4","∞","존재하지 않는다"],"a":2,"h":["그대로 대입하면 0/0 이 됩니다. 분자를 인수분해해 보세요.","x² − 4 = (x+2)(x−2) 이므로 (x−2) 가 약분됩니다. 남은 식에 x = 2 를 넣으세요."],"s":"(x²−4)/(x−2) = (x+2)(x−2)/(x−2) = x + 2 (x ≠ 2) 이므로 극한값은 2 + 2 = **4** 입니다. x → 2 는 x = 2 가 아니므로 약분이 가능합니다."},{"q":"lim(x→0) [[sin 3x|x]] 의 값은?","c":["0","1","3","[[1|3]]","∞"],"a":2,"h":["lim(x→0) sin θ/θ = 1 을 쓰려면 분모를 3x 로 맞춰야 합니다.","(sin 3x / 3x) × 3 으로 바꾸면 앞부분이 1로 가고 3이 남습니다."],"s":"sin3x/x = (sin3x/3x) × 3 이고 x→0 일 때 sin3x/3x → 1 이므로 극한값은 **3** 입니다. 분모에 맞춰 곱하고 나눈 계수가 그대로 답이 됩니다."},{"q":"lim(x→0) [[e²ˣ − 1|x]] 의 값은?","c":["0","1","2","e","e²"],"a":2,"h":["lim(x→0)(e^t − 1)/t = 1 을 쓰려면 분모를 2x 로 맞춰야 합니다.","(e^{2x} − 1)/(2x) × 2 로 변형하세요."],"s":"(e^{2x} − 1)/x = [(e^{2x} − 1)/(2x)] × 2 이고 앞부분이 1로 가므로 극한값은 **2** 입니다. sin 3x/x 와 완전히 같은 구조입니다."},{"q":"lim(x→∞) (1 + [[1|x]])ˣ 의 값은?","c":["1","0","e","∞","2"],"a":2,"h":["이것은 자연상수 e 의 정의 그 자체입니다.","괄호 안이 1에 가까워지지만 지수가 무한대로 커져서 1이 되지 않습니다."],"s":"이 극한이 바로 자연상수 **e** ( ≈ 2.718 ) 의 정의입니다. 「1의 무한대 제곱」은 부정형이라 1이 아니라는 점이 핵심입니다."},{"q":"함수 f(x) 의 극한 lim(x→a) f(x) 가 존재하기 위한 조건은?","c":["f(a) 가 정의되어야 한다","좌극한과 우극한이 같아야 한다","f 가 미분가능해야 한다","f(a) = 0 이어야 한다","f 가 다항함수여야 한다"],"a":1,"h":["왼쪽에서 다가갈 때와 오른쪽에서 다가갈 때를 비교해 보세요.","두 방향에서 다른 값에 도달하면 「어디로 가는지」를 하나로 정할 수 없습니다."],"s":"극한이 존재하려면 **좌극한과 우극한이 같아야** 합니다. f(a) 가 정의되어 있는지는 극한의 존재와 무관합니다 — 구멍이 뚫려 있어도 극한은 존재할 수 있습니다."}]},{"id":"k4","title":"함수의 연속","tagline":"「연필을 떼지 않고 그릴 수 있다」를 수학적으로 정확히 표현한 것입니다.","concept":[{"t":"10살에게 설명하면","b":"그래프를 그릴 때 **연필을 종이에서 떼지 않고** 쭉 그릴 수 있으면 연속입니다. 중간에 뚝 끊기거나, 점프하거나, 구멍이 뚫려 있으면 그 점에서 불연속입니다."},{"t":"x = a 에서 연속일 조건 — 세 가지 모두","b":"① **f(a) 가 정의되어 있다** (그 자리에 점이 있다)\n② **lim(x→a) f(x) 가 존재한다** (좌극한 = 우극한)\n③ **lim(x→a) f(x) = f(a)** (가는 곳과 도착점이 같다)\n\n세 조건 중 하나라도 어기면 그 점에서 불연속입니다. 실전에서는 ③ 만 확인하면 ①②도 자동으로 포함됩니다."},{"t":"불연속의 세 가지 모습","b":"**구멍**: 극한은 있는데 f(a) 가 없거나 다른 값 (예: (x²−1)/(x−1) 의 x=1)\n**점프**: 좌극한 ≠ 우극한 (예: 계단함수)\n**폭발**: 극한이 무한대 (예: 1/(x−2) 의 x=2)"},{"t":"연속함수의 성질과 두 정리","b":"연속함수끼리 더하고 빼고 곱한 것은 연속입니다. 나눗셈은 **분모가 0이 아닌 곳에서** 연속입니다.\n\n**최대·최소 정리**: 닫힌구간 [a, b] 에서 연속이면 반드시 최댓값과 최솟값을 가집니다.\n**사잇값 정리**: [a, b] 에서 연속이고 f(a) 와 f(b) 의 부호가 다르면, 그 사이에 f(c) = 0 인 c 가 **적어도 하나** 존재합니다. → 방정식에 실근이 있음을 보이는 도구입니다."}],"formulas":[{"n":"연속의 정의","f":"lim(x→a) f(x) = f(a)"},{"n":"세 조건","f":"① f(a) 정의됨  ② 극한 존재  ③ 두 값이 일치"},{"n":"사잇값 정리","f":"f 가 [a,b] 에서 연속, f(a)f(b) < 0  →  (a,b) 에 실근 존재"}],"mistake":"「미분가능」과 「연속」을 같은 것으로 생각하면 안 됩니다. 연속은 **끊기지 않은 것**, 미분가능은 **끊기지도 뾰족하지도 않은 것**입니다. 미분가능이 훨씬 강한 조건입니다.","example":{"q":"f(x) = (x² − 1)/(x − 1) (x ≠ 1), f(1) = k 로 정의된 함수가 x = 1 에서 연속이 되도록 하는 k 를 구하시오.","steps":["연속이려면 lim(x→1) f(x) = f(1) = k 여야 합니다.","lim(x→1) (x²−1)/(x−1) = lim(x→1) (x+1)(x−1)/(x−1) = lim(x→1)(x+1)","= 1 + 1 = 2","따라서 k = 2"],"a":"k = 2"},"quiz":[{"q":"f(x) = [[x² − 1|x − 1]] (x ≠ 1), f(1) = k 인 함수가 x = 1 에서 연속일 때 k 의 값은?","c":["0","1","2","−1","연속이 될 수 없다"],"a":2,"h":["연속의 조건은 lim(x→1) f(x) = f(1) 입니다. 먼저 극한값을 구하세요.","(x²−1)/(x−1) = x + 1 (x ≠ 1) 이므로 극한값은 2 입니다."],"s":"lim(x→1) (x+1)(x−1)/(x−1) = lim(x→1)(x+1) = 2 이므로 연속이려면 k = **2** 여야 합니다. 원래 그래프는 x = 1 에 구멍이 뚫린 직선 y = x + 1 이고, 그 구멍을 2로 메우는 셈입니다."},{"q":"함수 f(x) 가 x = a 에서 연속일 조건이 **아닌** 것은?","c":["f(a) 가 정의되어 있다","lim(x→a) f(x) 가 존재한다","lim(x→a) f(x) = f(a)","f′(a) 가 존재한다","좌극한과 우극한이 같다"],"a":3,"h":["연속의 세 조건을 떠올려 보세요. 미분과 관련된 조건이 그 안에 있었나요?","y = |x| 는 x = 0 에서 연속이지만 미분은 불가능합니다."],"s":"연속의 조건은 ① f(a) 정의 ② 극한 존재(= 좌극한 = 우극한) ③ 두 값 일치 세 가지입니다. **f′(a) 의 존재**는 연속의 조건이 아니라 그보다 강한 「미분가능」의 조건입니다. y = |x| 가 그 반례입니다."},{"q":"f(x) = x³ − x − 1 이 구간 (1, 2) 에서 실근을 가지는 근거로 가장 알맞은 것은?","c":["f(1) = −1 < 0, f(2) = 5 > 0 이고 f 가 연속이므로 (사잇값 정리)","f′(x) > 0 이므로","f 가 삼차함수이므로","f(0) = −1 이므로","f 가 미분가능하므로"],"a":0,"h":["f(1) 과 f(2) 를 직접 계산해 부호를 확인해 보세요.","f(1) = 1 − 1 − 1 = −1, f(2) = 8 − 2 − 1 = 5. 부호가 반대이고 연속이면 어떤 정리를 쓸 수 있나요?"],"s":"f(1) = −1 < 0 이고 f(2) = 5 > 0 이며 다항함수라 연속이므로, **사잇값 정리**에 의해 f(c) = 0 인 c 가 (1, 2) 에 적어도 하나 존재합니다."},{"q":"함수 y = [[1|x − 2]] 가 불연속인 점은?","c":["x = 0","x = 1","x = 2","x = −2","불연속인 점이 없다"],"a":2,"h":["분수함수는 분모가 0이 되는 곳에서 정의되지 않습니다.","x − 2 = 0 이 되는 x 를 구하세요."],"s":"분모 x − 2 = 0, 즉 **x = 2** 에서 함숫값이 정의되지 않으므로 그 점에서 불연속입니다. 이 점을 기준으로 그래프가 무한대로 발산하는 「폭발형」 불연속입니다."}]},{"id":"k5","title":"미분계수와 도함수 (지수·로그·삼각함수)","tagline":"다항함수 너머, eˣ · ln x · sin x 의 미분 공식을 익힙니다.","concept":[{"t":"10살에게 설명하면","b":"미분의 뜻(순간의 기울기)은 수학Ⅱ에서 배운 것과 똑같습니다. 달라지는 건 **미분할 수 있는 함수의 종류**뿐입니다. 이제 지수함수, 로그함수, 삼각함수의 「기울기 공식」을 새로 배웁니다."},{"t":"지수함수의 미분","b":"**(eˣ)′ = eˣ**\n미분해도 자기 자신입니다. 이것이 e 라는 수가 특별한 이유입니다.\n\n**(aˣ)′ = aˣ ln a**\n밑이 e가 아니면 ln a 가 붙습니다. a = e 일 때 ln e = 1 이라 위 식으로 돌아갑니다."},{"t":"로그함수의 미분","b":"**(ln x)′ = 1/x**  (x > 0)\n**(log_a x)′ = 1 / (x ln a)**\n\n지수와 마찬가지로, 밑이 e 가 아니면 ln a 가 분모에 붙습니다."},{"t":"삼각함수의 미분","b":"**(sin x)′ = cos x**\n**(cos x)′ = −sin x**  ← 마이너스 주의!\n**(tan x)′ = 1/cos²x** (= sec²x)\n\nsin → cos → −sin → −cos → sin … 네 번 미분하면 제자리로 돌아옵니다.\n이 공식들은 x 가 **라디안**일 때만 성립합니다."},{"t":"공식이 나오는 이유 (간단히)","b":"(sin x)′ 를 정의로 계산하면 lim(h→0)[sin(x+h) − sin x]/h 이고, 덧셈정리로 풀면 결국 lim(h→0) sin h / h = 1 을 쓰게 됩니다. 앞 단원에서 그 극한을 외운 이유가 여기에 있습니다."}],"formulas":[{"n":"지수함수","f":"(eˣ)′ = eˣ,   (aˣ)′ = aˣ ln a"},{"n":"로그함수","f":"(ln x)′ = [[1|x]],   (log_a x)′ = [[1|x ln a]]"},{"n":"삼각함수","f":"(sin x)′ = cos x,   (cos x)′ = −sin x"},{"n":"탄젠트","f":"(tan x)′ = [[1|cos²x]]"}],"mistake":"(cos x)′ 의 **마이너스 부호**를 빠뜨리는 실수가 가장 많습니다. 또 (ln x)′ = 1/x 를 (ln x)′ = ln x 처럼 쓰거나, (eˣ)′ = x eˣ⁻¹ 처럼 다항함수 공식을 잘못 적용하는 경우도 흔합니다 — 지수에 x가 있으면 (xⁿ)′ 공식을 쓸 수 없습니다.","example":{"q":"y = eˣ + ln x + sin x 의 도함수를 구하시오.","steps":["각 항을 따로 미분합니다.","(eˣ)′ = eˣ","(ln x)′ = 1/x","(sin x)′ = cos x","따라서 y′ = eˣ + 1/x + cos x"],"a":"y′ = eˣ + 1/x + cos x"},"quiz":[{"q":"y = eˣ + ln x 일 때 y′ 은?","c":["eˣ + [[1|x]]","x eˣ⁻¹ + [[1|x]]","eˣ + ln x","eˣ + x","eˣ − [[1|x]]"],"a":0,"h":["(eˣ)′ 는 아주 특별합니다. 미분해도 자기 자신입니다.","(ln x)′ = 1/x 입니다. 두 결과를 더하세요."],"s":"y′ = **eˣ + 1/x** 입니다. eˣ 는 지수에 x가 있으므로 (xⁿ)′ = nxⁿ⁻¹ 공식을 쓸 수 없습니다 — x eˣ⁻¹ 이 그 함정입니다."},{"q":"y = sin x 일 때 x = 0 에서의 미분계수는?","c":["0","1","−1","[[π|2]]","존재하지 않는다"],"a":1,"h":["먼저 도함수 y′ = cos x 를 구하세요.","x = 0 을 대입하면 cos 0 입니다."],"s":"y′ = cos x 이므로 x = 0 에서의 미분계수는 cos 0 = **1** 입니다. 즉 y = sin x 의 그래프는 원점에서 기울기 1로 지나갑니다."},{"q":"y = 2ˣ 일 때 y′ 은?","c":["2ˣ","x 2ˣ⁻¹","2ˣ ln 2","[[2ˣ|ln 2]]","2ˣ log 2"],"a":2,"h":["(aˣ)′ = aˣ ln a 입니다. 밑이 e 가 아니면 ln a 가 곱해집니다.","a = 2 를 대입하세요."],"s":"y′ = **2ˣ ln 2** 입니다. 밑이 e 인 경우에만 ln e = 1 이라 추가 인수가 사라진다는 점을 기억하세요."},{"q":"y = cos x 일 때 y′ 은?","c":["sin x","−sin x","cos x","−cos x","[[1|cos²x]]"],"a":1,"h":["cos 의 미분에는 부호가 하나 붙습니다.","(cos x)′ = −sin x 입니다."],"s":"y′ = **−sin x** 입니다. 마이너스를 빠뜨리는 것이 이 단원 최다 실수이므로, sin → cos 는 그대로, cos → sin 은 마이너스라고 세트로 외우세요."},{"q":"y = tan x 일 때 y′ 은?","c":["[[1|cos²x]]","[[1|sin²x]]","−[[1|cos²x]]","cos²x","[[sin x|cos x]]"],"a":0,"h":["tan x = sin x / cos x 이므로 몫의 미분법으로 유도할 수 있습니다.","결과는 (cos²x + sin²x)/cos²x = 1/cos²x 입니다."],"s":"y′ = **1/cos²x** (= sec²x) 입니다. 몫의 미분법으로 계산하면 (cos x·cos x − sin x·(−sin x))/cos²x = (cos²x + sin²x)/cos²x = 1/cos²x 가 됩니다."}]},{"id":"k6","title":"여러 가지 미분법","tagline":"몫·합성·역함수·매개변수·음함수 — 상황별 미분 도구 상자입니다.","concept":[{"t":"10살에게 설명하면","b":"드라이버 하나로 모든 나사를 풀 수는 없죠. 함수의 생김새마다 맞는 미분 도구가 따로 있습니다. 이 단원은 그 도구들을 언제 꺼내 쓸지 익히는 곳입니다."},{"t":"몫의 미분법","b":"**(f/g)′ = (f′g − f g′) / g²**\n\n「아래 곱하기 위 미분 빼기 위 곱하기 아래 미분, 나누기 아래 제곱」\n**분자의 순서가 중요합니다** — 곱의 미분과 달리 빼기라서 순서를 바꾸면 부호가 뒤집힙니다."},{"t":"합성함수의 미분 (연쇄법칙)","b":"**{f(g(x))}′ = f′(g(x)) · g′(x)**\n\n초월함수와 함께 쓰는 형태를 특히 많이 씁니다:\n(e^{g(x)})′ = e^{g(x)} g′(x)   예: (e^{2x})′ = 2e^{2x}\n(ln g(x))′ = g′(x)/g(x)   예: (ln(x²+1))′ = 2x/(x²+1)\n(sin g(x))′ = cos g(x) · g′(x)"},{"t":"역함수의 미분법","b":"**(f⁻¹)′(b) = 1 / f′(a)**,  단 b = f(a)\n\n뜻: 원래 함수의 기울기가 3이면, 그래프를 y = x 에 대해 뒤집은 역함수의 기울기는 1/3 입니다. 가로세로가 바뀌니 기울기가 역수가 되는 것입니다."},{"t":"매개변수와 음함수","b":"**매개변수**: x = f(t), y = g(t) 로 주어졌을 때\ndy/dx = (dy/dt) / (dx/dt)\n\n**음함수**: y가 x로 명시되지 않았을 때(예: x² + y² = 1) 양변을 x로 미분합니다. 이때 y는 x의 함수이므로 **y를 미분하면 항상 (dy/dx) 가 딸려 나옵니다.**\n예: (y²)′ = 2y (dy/dx)"},{"t":"이계도함수","b":"도함수를 한 번 더 미분한 것을 **f″(x)** 라 합니다. 그래프의 볼록·오목과 가속도를 나타내는 데 쓰입니다."}],"formulas":[{"n":"몫의 미분","f":"([[f|g]])′ = [[f′g − f g′|g²]]"},{"n":"지수·로그 합성","f":"(e^{g})′ = e^{g} g′,   (ln g)′ = [[g′|g]]"},{"n":"역함수","f":"(f⁻¹)′(b) = [[1|f′(a)]]   (b = f(a))"},{"n":"매개변수","f":"[[dy|dx]] = [[dy/dt|dx/dt]]"},{"n":"음함수","f":"양변을 x로 미분,  (y²)′ = 2y [[dy|dx]]"}],"mistake":"몫의 미분에서 분자의 **순서와 부호**를 틀리는 실수가 압도적입니다. (f′g − fg′) 이지 (fg′ − f′g) 가 아닙니다. 간단한 검산법: f = x, g = x² 로 두면 (1/x)′ = −1/x² 이 나와야 합니다.","example":{"q":"y = x / (x + 1) 의 도함수를 구하시오.","steps":["f = x, g = x + 1 이므로 f′ = 1, g′ = 1.","(f/g)′ = (f′g − f g′)/g² = [1·(x+1) − x·1] / (x+1)²","분자를 정리: (x + 1 − x) = 1","따라서 y′ = 1/(x+1)²"],"a":"1/(x + 1)²"},"quiz":[{"q":"y = [[x|x + 1]] 일 때 y′ 은?","c":["[[1|(x+1)²]]","−[[1|(x+1)²]]","[[2x+1|(x+1)²]]","[[1|x+1]]","[[x|(x+1)²]]"],"a":0,"h":["몫의 미분법 (f′g − fg′)/g² 를 씁니다. f = x, g = x+1 입니다.","분자는 1·(x+1) − x·1 = 1 입니다."],"s":"y′ = [1·(x+1) − x·1]/(x+1)² = 1/(x+1)² = **1/(x+1)²** 입니다. 분자가 깔끔하게 1로 정리되는 것이 포인트입니다."},{"q":"y = e²ˣ 일 때 y′ 은?","c":["e²ˣ","2e²ˣ","2x e²ˣ","e²ˣ ln 2","[[e²ˣ|2]]"],"a":1,"h":["(e^{g(x)})′ = e^{g(x)} · g′(x) 입니다. 여기서 g(x) = 2x 입니다.","g′(x) = 2 이므로 e^{2x} × 2 입니다."],"s":"y′ = e^{2x} × (2x)′ = **2e^{2x}** 입니다. 속미분 2를 곱하지 않아 e^{2x} 에서 멈추는 것이 대표적 실수입니다."},{"q":"y = ln(x² + 1) 일 때 y′ 은?","c":["[[1|x² + 1]]","[[2x|x² + 1]]","[[1|2x]]","2x ln(x²+1)","[[x² + 1|2x]]"],"a":1,"h":["(ln g)′ = g′/g 입니다. g = x² + 1 입니다.","g′ = 2x 이므로 분자에 2x 가 옵니다."],"s":"y′ = (x²+1)′/(x²+1) = **2x/(x²+1)** 입니다. 「속미분을 분자에」가 로그 합성 미분의 핵심입니다."},{"q":"x = t², y = t³ 일 때 [[dy|dx]] 를 t 로 나타내면? (t ≠ 0)","c":["[[3t|2]]","[[2|3t]]","3t²","[[3t²|2t]]  꼴로 더 이상 정리 불가","[[t|2]]"],"a":0,"h":["dy/dx = (dy/dt)/(dx/dt) 입니다. 각각 t로 미분하세요.","dy/dt = 3t², dx/dt = 2t 이므로 3t²/2t 를 약분하세요."],"s":"dy/dt = 3t², dx/dt = 2t 이므로 dy/dx = 3t²/(2t) = **3t/2** 입니다 (t ≠ 0). 약분까지 마무리해야 합니다."},{"q":"x² + y² = 1 일 때 [[dy|dx]] 는? (y ≠ 0)","c":["−[[x|y]]","[[x|y]]","−[[y|x]]","−2x","[[1|2y]]"],"a":0,"h":["양변을 x로 미분합니다. y² 을 미분할 때 dy/dx 가 딸려 나온다는 점이 핵심입니다.","2x + 2y(dy/dx) = 0 을 dy/dx 에 대해 풀어 보세요."],"s":"양변을 x로 미분하면 2x + 2y·(dy/dx) = 0 이므로 dy/dx = **−x/y** 입니다. y를 미분할 때 연쇄법칙에 의해 dy/dx 가 곱해지는 것이 음함수 미분의 전부입니다."}]},{"id":"k7","title":"도함수의 활용","tagline":"접선, 그래프의 모양, 그리고 속도·가속도 — 미분이 실제로 쓰이는 곳입니다.","concept":[{"t":"10살에게 설명하면","b":"미분으로 「기울기」를 알 수 있으니, 그것으로 세 가지를 할 수 있습니다. ① 그 점에 딱 닿는 직선(접선) 그리기 ② 그래프가 오르는지 내리는지, 어떻게 휘는지 파악하기 ③ 움직이는 물체의 속도 구하기."},{"t":"접선의 방정식","b":"곡선 y = f(x) 위의 점 (a, f(a)) 에서의 접선:\n**y − f(a) = f′(a)(x − a)**\n\n순서: ① f′(x) 구하기 → ② f′(a) 로 기울기 구하기 → ③ 점 (a, f(a)) 와 함께 직선의 식 쓰기.\n\n법선(접선에 수직인 직선)의 기울기는 −1/f′(a) 입니다."},{"t":"이계도함수와 그래프의 모양","b":"**f″(x) > 0 → 아래로 볼록** (∪ 모양, convex)\n**f″(x) < 0 → 위로 볼록** (∩ 모양)\n**변곡점**: 볼록의 방향이 바뀌는 점. f″(x) = 0 이고 그 좌우에서 **f″ 의 부호가 바뀌는** 점입니다.\n\nf″(a) = 0 이라고 반드시 변곡점인 것은 아닙니다 — 부호 변화를 꼭 확인해야 합니다(y = x⁴ 의 x = 0 이 반례)."},{"t":"극값의 판정 — 이계도함수 이용","b":"f′(a) = 0 일 때\n**f″(a) < 0 → x = a 에서 극대** (위로 볼록한 꼭대기)\n**f″(a) > 0 → x = a 에서 극소** (아래로 볼록한 바닥)\nf″(a) = 0 이면 이 방법으로는 판정할 수 없어 부호 조사로 돌아가야 합니다."},{"t":"속도와 가속도","b":"수직선 위를 움직이는 점의 위치가 x = f(t) 일 때\n**속도 v = dx/dt = f′(t)**\n**가속도 a = dv/dt = f″(t)**\n\n속도의 부호가 운동 방향입니다. v = 0 이 되는 순간이 **방향을 바꾸는 순간**입니다."}],"svg":"<svg viewBox='0 0 320 165' role='img' aria-label='곡선과 그 위 한 점에서의 접선'><line x1='20' y1='140' x2='300' y2='140' stroke='#e2e8f0' stroke-width='1.5'/><path d='M40 138 Q140 138 200 80 T295 20' fill='none' stroke='#be123c' stroke-width='2.5'/><line x1='120' y1='155' x2='265' y2='38' stroke='#0891b2' stroke-width='2.5'/><circle cx='185' cy='93' r='4.5' fill='#0891b2'/><text x='192' y='88' font-size='12' fill='#0891b2'>(a, f(a))</text><text x='236' y='120' font-size='11' fill='#0891b2'>기울기 = f′(a)</text><text x='250' y='30' font-size='12' fill='#be123c'>y = f(x)</text></svg>","formulas":[{"n":"접선의 방정식","f":"y − f(a) = f′(a)(x − a)"},{"n":"법선의 기울기","f":"−[[1|f′(a)]]"},{"n":"볼록성","f":"f″ > 0 → 아래로 볼록,  f″ < 0 → 위로 볼록"},{"n":"변곡점","f":"f″(x) = 0 이고 좌우에서 f″ 의 부호가 바뀌는 점"},{"n":"속도·가속도","f":"v = [[dx|dt]],   a = [[dv|dt]] = [[d²x|dt²]]"}],"mistake":"접선의 방정식에서 기울기 f′(a) 는 맞게 구해 놓고 **점을 (a, f′(a)) 로 잘못 쓰는** 실수가 흔합니다. 접점의 y좌표는 f(a) 입니다. 또 변곡점을 물으면 x좌표만이 아니라 **점의 좌표 (x, f(x))** 를 답해야 하는 경우가 많습니다.","example":{"q":"곡선 y = x² 위의 점 (1, 1) 에서의 접선의 방정식을 구하시오.","steps":["y′ = 2x","x = 1 에서의 기울기: y′(1) = 2","점 (1, 1) 을 지나고 기울기가 2인 직선: y − 1 = 2(x − 1)","정리하면 y = 2x − 1"],"a":"y = 2x − 1"},"quiz":[{"q":"곡선 y = x² 위의 점 (1, 1) 에서의 접선의 방정식은?","c":["y = 2x","y = 2x − 1","y = 2x + 1","y = x","y = x − 1"],"a":1,"h":["y′ = 2x 이므로 x = 1 에서의 기울기는 2 입니다.","y − 1 = 2(x − 1) 을 전개해 정리하세요."],"s":"y′ = 2x 이므로 기울기는 2 이고, y − 1 = 2(x−1) → **y = 2x − 1** 입니다. 검산: x = 1 을 넣으면 y = 1 로 접점을 지납니다."},{"q":"곡선 f(x) = x³ − 3x² 의 변곡점의 좌표는?","c":["(0, 0)","(1, −2)","(2, −4)","(1, 0)","(−1, −4)"],"a":1,"h":["f″(x) 를 구해 0이 되는 x 를 찾으세요. f′(x) = 3x² − 6x 입니다.","f″(x) = 6x − 6 = 0 에서 x = 1. 이제 f(1) 을 계산해 y좌표를 구하세요."],"s":"f′(x) = 3x² − 6x, f″(x) = 6x − 6 이므로 f″(x) = 0 에서 x = 1 입니다. 좌우에서 f″ 의 부호가 − → + 로 바뀌므로 변곡점이 맞고, f(1) = 1 − 3 = −2 이므로 좌표는 **(1, −2)** 입니다."},{"q":"수직선 위를 움직이는 점 P 의 시각 t 에서의 위치가 x(t) = t² − 4t 일 때, t = 3 에서의 속도는?","c":["−3","−2","0","2","3"],"a":3,"h":["속도는 위치를 시간으로 미분한 것입니다. v(t) = x′(t).","v(t) = 2t − 4 이므로 t = 3 을 대입하세요."],"s":"v(t) = x′(t) = 2t − 4 이므로 v(3) = 6 − 4 = **2** 입니다. 속도가 양수이므로 이때 점은 양의 방향으로 움직이고 있습니다. (t = 2 에서 v = 0 이 되며 방향을 바꿉니다.)"},{"q":"어떤 구간에서 f″(x) > 0 일 때, 그 구간에서 y = f(x) 의 그래프는?","c":["아래로 볼록하다","위로 볼록하다","직선이다","감소한다","증가한다"],"a":0,"h":["f″ 는 f′(기울기)의 변화율입니다. f″ > 0 이면 기울기가 점점 커집니다.","기울기가 계속 커지는 곡선은 컵(∪) 모양이 됩니다."],"s":"f″ > 0 이면 기울기 f′ 이 계속 증가하므로 그래프는 **아래로 볼록**(∪ 모양)합니다. 참고로 볼록성은 증가·감소와는 별개의 정보입니다 — 감소하면서 아래로 볼록할 수도 있습니다."},{"q":"곡선 y = eˣ 위의 점 (0, 1) 에서의 접선의 방정식은?","c":["y = x","y = x + 1","y = ex","y = ex + 1","y = 1"],"a":1,"h":["(eˣ)′ = eˣ 이므로 x = 0 에서의 기울기는 e⁰ 입니다.","기울기가 1이고 점 (0, 1) 을 지나는 직선을 쓰세요."],"s":"y′ = eˣ 이므로 x = 0 에서 기울기는 e⁰ = 1 입니다. y − 1 = 1(x − 0) 이므로 **y = x + 1** 입니다."}]},{"id":"k8","title":"여러 가지 적분법","tagline":"적분은 미분을 거꾸로 하는 일입니다. 그리고 치환·부분적분이라는 두 가지 무기가 있습니다.","concept":[{"t":"10살에게 설명하면","b":"미분이 「곱하기」라면 적분은 「나누기」 같은 역연산입니다. 「미분해서 x² 이 되는 함수는 뭘까?」를 찾는 것이 적분입니다. 답은 x³/3 인데, 상수는 미분하면 사라지므로 **+ C** 를 꼭 붙여야 합니다."},{"t":"기본 적분 공식","b":"∫ xⁿ dx = xⁿ⁺¹/(n+1) + C  (단 n ≠ −1)\n∫ (1/x) dx = **ln|x| + C**  ← n = −1 인 경우는 로그!\n∫ eˣ dx = eˣ + C\n∫ sin x dx = **−cos x** + C  ← 마이너스 주의\n∫ cos x dx = sin x + C\n\n미분 공식을 거꾸로 읽으면 그대로 나옵니다. sin을 적분하면 마이너스가 붙는 이유는 (cos x)′ = −sin x 이기 때문입니다."},{"t":"치환적분 — 「속」을 t 로 바꾸기","b":"**∫ f(g(x)) g′(x) dx** 꼴이 보이면 g(x) = t 로 치환합니다. 그러면 g′(x)dx = dt 가 되어 ∫f(t)dt 로 간단해집니다.\n\n**언제 쓰나**: 식 안에 「어떤 덩어리와 그 덩어리의 미분」이 함께 있을 때.\n예: ∫ 2x(x²+1)³ dx 에서 x²+1 = t 로 두면 2x dx = dt 이므로 ∫t³dt = t⁴/4 = (x²+1)⁴/4 + C\n\n특히 자주 쓰는 꼴: **∫ f′(x)/f(x) dx = ln|f(x)| + C**"},{"t":"부분적분 — 곱을 쪼개기","b":"**∫ u dv = uv − ∫ v du**  (곱의 미분법을 거꾸로 한 것)\n\n**언제 쓰나**: (다항식) × (지수·로그·삼각) 처럼 성격이 다른 두 함수의 곱일 때.\n\n**u 를 고르는 순서 (LIATE)**: 로그 → 역삼각 → 다항 → 삼각 → 지수. 앞쪽에 있는 것을 u 로 두면 대개 잘 풀립니다. 미분해서 **간단해지는 쪽**을 u 로 잡는다고 생각하면 됩니다."},{"t":"정적분","b":"**∫(a→b) f(x) dx = F(b) − F(a)**  (F는 f의 부정적분)\n정적분에서는 상수 C가 서로 상쇄되어 사라지므로 붙이지 않습니다."}],"formulas":[{"n":"거듭제곱","f":"∫ xⁿ dx = [[xⁿ⁺¹|n+1]] + C   (n ≠ −1)"},{"n":"n = −1 인 경우","f":"∫ [[1|x]] dx = ln|x| + C"},{"n":"지수·삼각","f":"∫ eˣ dx = eˣ + C,  ∫ sin x dx = −cos x + C,  ∫ cos x dx = sin x + C"},{"n":"치환적분","f":"∫ f(g(x)) g′(x) dx = ∫ f(t) dt   (g(x) = t)"},{"n":"로그 꼴","f":"∫ [[f′(x)|f(x)]] dx = ln|f(x)| + C"},{"n":"부분적분","f":"∫ u dv = uv − ∫ v du"}],"mistake":"부정적분에서 **+ C 를 빠뜨리면 감점**입니다. 또 ∫(1/x)dx 를 x⁰/0 처럼 거듭제곱 공식으로 처리하려 하면 분모가 0이 되어 성립하지 않습니다 — 이 경우만 로그입니다. 그리고 ∫sin x dx 의 마이너스도 자주 놓칩니다.","example":{"q":"∫ x eˣ dx 를 구하시오.","steps":["다항식 × 지수 꼴이므로 부분적분을 씁니다.","미분하면 간단해지는 x 를 u 로 둡니다: u = x, dv = eˣ dx","그러면 du = dx, v = eˣ","∫ u dv = uv − ∫ v du = x eˣ − ∫ eˣ dx","= x eˣ − eˣ + C = (x − 1)eˣ + C","검산: {(x−1)eˣ}′ = eˣ + (x−1)eˣ = x eˣ ✓"],"a":"(x − 1)eˣ + C"},"quiz":[{"q":"∫ [[1|x]] dx 는?","c":["[[1|x²]] + C","ln|x| + C","x + C","−[[1|x²]] + C","[[x⁰|0]] + C"],"a":1,"h":["∫xⁿdx = xⁿ⁺¹/(n+1) 공식은 n = −1 일 때 분모가 0이 되어 쓸 수 없습니다.","미분해서 1/x 이 되는 함수를 떠올려 보세요."],"s":"(ln|x|)′ = 1/x 이므로 ∫(1/x)dx = **ln|x| + C** 입니다. 거듭제곱 공식이 유일하게 통하지 않는 예외이므로 따로 외워 두세요. 절댓값을 씌우는 이유는 x < 0 에서도 성립하게 하기 위함입니다."},{"q":"∫ 2x(x² + 1)³ dx 는?","c":["[[(x²+1)⁴|4]] + C","[[(x²+1)⁴|8]] + C","2(x²+1)⁴ + C","[[(x²+1)⁴|2]] + C","[[x²(x²+1)⁴|4]] + C"],"a":0,"h":["x² + 1 = t 로 치환해 보세요. 이때 2x dx = dt 가 됩니다.","식이 ∫t³ dt 로 바뀝니다. 이를 적분한 뒤 t 를 되돌리세요."],"s":"x²+1 = t 로 두면 2x dx = dt 이므로 ∫t³dt = t⁴/4 + C = **(x²+1)⁴/4 + C** 입니다. 검산으로 미분해 보면 4(x²+1)³·2x/4 = 2x(x²+1)³ 로 원래 식이 나옵니다."},{"q":"∫ x eˣ dx 는?","c":["x eˣ + C","[[x²|2]] eˣ + C","x eˣ − eˣ + C","eˣ + C","x eˣ + eˣ + C"],"a":2,"h":["다항식 × 지수 꼴이므로 부분적분을 씁니다. 미분해서 간단해지는 x 를 u 로 두세요.","∫u dv = uv − ∫v du 에서 x eˣ − ∫eˣ dx 가 됩니다."],"s":"u = x, dv = eˣdx 로 두면 ∫x eˣdx = x eˣ − ∫eˣdx = **x eˣ − eˣ + C** 입니다. 미분해서 검산하면 eˣ + xeˣ − eˣ = xeˣ 로 맞습니다."},{"q":"∫ sin x dx 는?","c":["cos x + C","−cos x + C","sin x + C","−sin x + C","[[sin²x|2]] + C"],"a":1,"h":["미분해서 sin x 가 되는 함수를 찾으세요. (cos x)′ = −sin x 입니다.","부호를 뒤집으면 (−cos x)′ = sin x 가 됩니다."],"s":"(−cos x)′ = sin x 이므로 ∫sin x dx = **−cos x + C** 입니다. 미분에서는 cos에 마이너스가 붙고, 적분에서는 sin에 마이너스가 붙는다고 짝지어 외우세요."},{"q":"∫ [[2x|x² + 1]] dx 는?","c":["ln(x² + 1) + C","2 ln(x² + 1) + C","[[1|x²+1]] + C","[[x²|x²+1]] + C","2x ln(x²+1) + C"],"a":0,"h":["분자가 분모의 도함수인지 확인해 보세요. (x²+1)′ = 2x 입니다.","∫ f′/f dx = ln|f| + C 공식을 그대로 적용합니다."],"s":"분자 2x 는 분모 x²+1 의 도함수이므로 ∫f′/f dx = ln|f| + C 에 의해 **ln(x²+1) + C** 입니다. x²+1 > 0 이라 절댓값은 생략할 수 있습니다."}]},{"id":"k9","title":"정적분의 활용","tagline":"적분은 「잘게 쪼개서 다 더하기」입니다. 그래서 넓이·부피·거리를 구할 수 있습니다.","concept":[{"t":"10살에게 설명하면","b":"구불구불한 도형의 넓이를 어떻게 구할까요? 아주 얇은 직사각형으로 잘게 썰어서 전부 더하면 됩니다. 그 조각을 무한히 얇게 만든 것이 적분입니다. **적분 = 무한히 잘게 썰어 더하기**."},{"t":"곡선과 x축 사이의 넓이","b":"**S = ∫(a→b) |f(x)| dx**\n\nf(x) ≥ 0 인 구간에서는 그냥 ∫f(x)dx 이지만, **f(x) < 0 인 부분이 있으면 그 구간은 부호를 뒤집어야** 합니다. 정적분 값 자체는 x축 아래 부분을 음수로 세기 때문입니다.\n\n따라서 먼저 f(x) = 0 인 점(x축과 만나는 점)을 찾아 구간을 나누는 것이 필수입니다."},{"t":"두 곡선 사이의 넓이","b":"**S = ∫(a→b) {(위쪽 함수) − (아래쪽 함수)} dx**\n\n순서: ① 두 곡선의 교점을 구해 적분 구간을 정한다 → ② 그 구간에서 어느 쪽이 위인지 확인한다 → ③ (위 − 아래) 를 적분한다.\n\n②를 건너뛰면 부호가 뒤집혀 음수 넓이가 나옵니다."},{"t":"부피","b":"**입체의 부피**: 단면적이 S(x) 일 때 V = ∫(a→b) S(x) dx\n**회전체의 부피** (x축 회전): 단면이 반지름 y 인 원이므로\n**V = π ∫(a→b) y² dx**\n\n제곱하는 것을 잊지 마세요 — 원의 넓이가 πr² 이기 때문입니다."},{"t":"속도와 거리 — 가장 헷갈리는 구분","b":"시각 t 에서의 속도가 v(t) 일 때\n**위치의 변화량 = ∫(a→b) v(t) dt**  (방향을 고려, 음수 가능)\n**실제로 움직인 거리 = ∫(a→b) |v(t)| dt**  (항상 양수)\n\n왕복해서 제자리로 돌아왔다면 위치 변화량은 0이지만 이동 거리는 0이 아닙니다."},{"t":"곡선의 길이","b":"**L = ∫(a→b) √(1 + {f′(x)}²) dx**\n매개변수로 주어지면 L = ∫ √((dx/dt)² + (dy/dt)²) dt."}],"formulas":[{"n":"곡선과 x축 사이의 넓이","f":"S = ∫(a→b) |f(x)| dx"},{"n":"두 곡선 사이의 넓이","f":"S = ∫(a→b) {위 − 아래} dx"},{"n":"회전체의 부피 (x축)","f":"V = π ∫(a→b) y² dx"},{"n":"위치의 변화량","f":"∫(a→b) v(t) dt"},{"n":"이동 거리","f":"∫(a→b) |v(t)| dt"},{"n":"곡선의 길이","f":"L = ∫(a→b) √(1 + {f′(x)}²) dx"}],"mistake":"넓이를 구할 때 **절댓값을 빼먹고** 그냥 정적분해서 음수 답을 내는 실수가 가장 많습니다. 넓이는 절대 음수가 될 수 없습니다. 답이 음수로 나오면 반드시 어디선가 부호를 놓친 것입니다.","example":{"q":"두 곡선 y = x 와 y = x² 로 둘러싸인 부분의 넓이를 구하시오.","steps":["교점을 구합니다: x = x² → x(x−1) = 0 → x = 0, 1. 적분 구간은 [0, 1].","구간 안의 값 x = 1/2 을 넣어 위아래를 확인: y = x 는 0.5, y = x² 은 0.25 이므로 y = x 가 위입니다.","S = ∫(0→1) (x − x²) dx = [x²/2 − x³/3] (0→1)","= (1/2 − 1/3) − 0 = 3/6 − 2/6 = 1/6"],"a":"1/6"},"quiz":[{"q":"곡선 y = x² 과 x축, 그리고 직선 x = 1 로 둘러싸인 부분의 넓이는?","c":["[[1|4]]","[[1|3]]","[[1|2]]","1","[[2|3]]"],"a":1,"h":["0 ≤ x ≤ 1 에서 x² ≥ 0 이므로 절댓값을 신경 쓸 필요가 없습니다.","∫(0→1) x² dx = [x³/3] 을 계산하세요."],"s":"S = ∫(0→1) x²dx = [x³/3](0→1) = 1/3 − 0 = **1/3** 입니다."},{"q":"두 곡선 y = x 와 y = x² 로 둘러싸인 부분의 넓이는?","c":["[[1|6]]","[[1|3]]","[[1|2]]","[[1|12]]","[[5|6]]"],"a":0,"h":["먼저 교점을 구하세요. x = x² 를 풀면 x = 0, 1 입니다.","0 < x < 1 에서는 y = x 가 위입니다. ∫(0→1)(x − x²)dx 를 계산하세요."],"s":"교점은 x = 0, 1 이고 그 사이에서 y = x 가 위이므로 S = ∫(0→1)(x − x²)dx = [x²/2 − x³/3] = 1/2 − 1/3 = **1/6** 입니다. 위아래를 반대로 하면 −1/6 이 나오므로 반드시 확인해야 합니다."},{"q":"수직선 위를 움직이는 점의 속도가 v(t) = 2t 일 때, t = 0 부터 t = 3 까지의 위치의 변화량은?","c":["3","6","9","12","18"],"a":2,"h":["위치의 변화량은 속도를 시간에 대해 적분한 것입니다.","∫(0→3) 2t dt = [t²](0→3) 을 계산하세요."],"s":"위치의 변화량 = ∫(0→3) 2t dt = [t²](0→3) = 9 − 0 = **9** 입니다. 이 구간에서 v(t) ≥ 0 이므로 이동 거리도 9로 같습니다."},{"q":"곡선 y = √x 와 x축, 직선 x = 1 로 둘러싸인 부분을 x축 둘레로 회전시킨 회전체의 부피는?","c":["[[π|3]]","[[π|2]]","π","[[2π|3]]","[[π|4]]"],"a":1,"h":["V = π∫y²dx 입니다. y = √x 이므로 y² 은 무엇이 될까요?","y² = x 이므로 π∫(0→1) x dx 를 계산하세요."],"s":"V = π∫(0→1) (√x)² dx = π∫(0→1) x dx = π[x²/2](0→1) = **π/2** 입니다. y 를 제곱하면 근호가 사라져 계산이 간단해지는 전형적인 문제입니다."},{"q":"∫(0→π) sin x dx 의 값은?","c":["0","1","2","π","−2"],"a":2,"h":["∫sin x dx = −cos x 이므로 [−cos x](0→π) 를 계산합니다.","−cos π − (−cos 0) = −(−1) + 1 입니다."],"s":"∫(0→π) sin x dx = [−cos x](0→π) = −cos π + cos 0 = −(−1) + 1 = **2** 입니다. 0부터 π까지 sin x ≥ 0 이므로 이 값은 그대로 넓이이기도 합니다."}]}]}];</script>
<script>/* =========================================================
   수학 다시 시작하기 — 개념 · 예제 · 문제 학습 앱
   ========================================================= */
(function () {
  "use strict";

  var C = window.__COURSES__;
  var LETTERS = ["①", "②", "③", "④", "⑤", "⑥"];

  /* ---------- state ---------- */
  var S = {
    view: "home",
    ci: 0,
    ui: 0,
    tab: "concept",
    q: null,
    progress: {},   // "ci/ui" -> {seen:bool, c:int, t:int}
    wrong: {},      // "ci/ui" -> [qi,...]
    filter: ""
  };

  /* ---------- math / text rendering ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function mathify(s) {
    var t = esc(s);
    t = t.replace(/\[\[([\s\S]*?)\]\]/g, function (m, inner) {
      var k = inner.indexOf("|");
      if (k < 0) return m;
      var num = inner.slice(0, k).trim();
      var den = inner.slice(k + 1).trim();
      return '<span class="frac"><span class="num">' + num +
             '</span><span class="den">' + den + "</span></span>";
    });
    t = t.replace(/\^\{([^{}]*)\}/g, "<sup>$1</sup>");
    t = t.replace(/\^\(([^()]*)\)/g, "<sup>$1</sup>");
    t = t.replace(/_\{([^{}]*)\}/g, "<sub>$1</sub>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return t;
  }
  function paras(s) {
    return String(s || "").split("\n").map(function (line) {
      if (line.trim() === "") return "";
      return "<p>" + mathify(line) + "</p>";
    }).join("");
  }

  /* ---------- progress helpers ---------- */
  function key(ci, ui) { return ci + "/" + ui; }
  function rec(ci, ui) {
    var k = key(ci, ui);
    if (!S.progress[k]) S.progress[k] = { seen: false, c: 0, t: 0 };
    return S.progress[k];
  }
  function unitStatus(ci, ui) {
    var r = S.progress[key(ci, ui)];
    if (!r) return "";
    if (r.t > 0 && r.c === r.t) return "done";
    if (r.t > 0) return "part";
    if (r.seen) return "seen";
    return "";
  }
  function totals() {
    var q = 0, got = 0, units = 0, doneUnits = 0;
    C.forEach(function (co, ci) {
      co.units.forEach(function (u, ui) {
        units++; q += u.quiz.length;
        var r = S.progress[key(ci, ui)];
        if (r) { got += r.c; if (r.t > 0 && r.c === r.t) doneUnits++; }
      });
    });
    return { q: q, got: got, units: units, doneUnits: doneUnits,
             pct: q ? Math.round(got / q * 100) : 0 };
  }
  function wrongItems() {
    var out = [];
    Object.keys(S.wrong).forEach(function (k) {
      var p = k.split("/"), ci = +p[0], ui = +p[1];
      if (!C[ci] || !C[ci].units[ui]) return;
      (S.wrong[k] || []).forEach(function (qi) {
        if (C[ci].units[ui].quiz[qi]) out.push({ ci: ci, ui: ui, qi: qi });
      });
    });
    return out;
  }

  /* ---------- sidebar ---------- */
  function renderSidebar() {
    var f = S.filter.trim().toLowerCase();
    var html = "";
    html += '<button class="nav-item' + (S.view === "home" ? " active" : "") +
            '" data-act="home">학습 홈</button>';
    var wn = wrongItems().length;
    html += '<button class="nav-item' + (S.view === "review" ? " active" : "") +
            '" data-act="review">오답노트' + (wn ? " (" + wn + ")" : "") + "</button>";

    C.forEach(function (co, ci) {
      var units = co.units.map(function (u, ui) { return { u: u, ui: ui }; })
        .filter(function (o) {
          return !f || (o.u.title + " " + co.title + " " + co.subtitle).toLowerCase().indexOf(f) >= 0;
        });
      if (!units.length) return;
      html += '<div class="course-head" style="--tone:' + co.tone + '">' +
              '<span class="bar"></span>' + esc(co.title) + " · " + esc(co.subtitle) + "</div>";
      units.forEach(function (o) {
        var st = unitStatus(ci, o.ui);
        var act = (S.view === "unit" && S.ci === ci && S.ui === o.ui) ? " active" : "";
        html += '<button class="unit-btn' + act + '" style="--tone:' + co.tone +
                '" data-act="unit" data-ci="' + ci + '" data-ui="' + o.ui + '">' +
                '<span class="dot ' + st + '"></span><span>' + esc(o.u.title) + "</span></button>";
      });
    });
    if (html.indexOf("unit-btn") < 0 && f) html += '<div class="empty">검색 결과가 없습니다</div>';
    document.getElementById("navList").innerHTML = html;
  }

  function renderTop() {
    var t = totals();
    document.getElementById("progFill").style.width = t.pct + "%";
    document.getElementById("progText").textContent = t.got + " / " + t.q + " 문제";
    var title = "학습 홈";
    if (S.view === "unit") title = C[S.ci].title + " · " + C[S.ci].subtitle + " › " + C[S.ci].units[S.ui].title;
    if (S.view === "review") title = "오답노트";
    document.getElementById("tbTitle").textContent = title;
  }

  /* ---------- home ---------- */
  function viewHome() {
    var t = totals();
    var h = "";
    h += '<div class="card hero"><h1>수학, 처음부터 다시.</h1>' +
      "<p>모르는 게 정상입니다. 이 사이트는 <strong>용어 하나부터</strong> 다시 설명합니다.</p>" +
      "<p>각 단원은 <strong>개념 → 예제 → 문제</strong> 세 단계로 되어 있고, 문제는 막히면 힌트를 두 번까지 볼 수 있습니다.</p>" +
      "</div>";

    h += '<div class="stat-row">' +
      '<div class="card stat"><div class="v">' + t.pct + '%</div><div class="k">전체 진행률</div></div>' +
      '<div class="card stat"><div class="v">' + t.got + '<small style="font-size:15px;color:var(--ink-3)"> / ' + t.q + '</small></div><div class="k">맞힌 문제</div></div>' +
      '<div class="card stat"><div class="v">' + t.doneUnits + '<small style="font-size:15px;color:var(--ink-3)"> / ' + t.units + '</small></div><div class="k">완료한 단원</div></div>' +
      '<div class="card stat"><div class="v">' + wrongItems().length + '</div><div class="k">오답노트</div></div>' +
      "</div>";

    h += '<div class="sec-title">추천 학습 순서</div>';
    h += '<div class="card sec"><p>수학은 앞 단원이 뒤 단원의 재료가 됩니다. 아래 순서대로 가는 것이 가장 덜 힘듭니다.</p>' +
      "<p><strong>1단계</strong> 수학Ⅱ 미분 — 미분의 뜻(기울기)을 먼저 잡습니다. 계산이 다항식뿐이라 가장 쉽습니다.</p>" +
      "<p><strong>2단계</strong> 수학Ⅰ 삼각함수 — sin·cos의 정의부터. 미적분과 기하 양쪽에서 계속 쓰입니다.</p>" +
      "<p><strong>3단계</strong> 기하 평면벡터 → 공간도형 — 삼각함수(내적의 cos)를 쓰므로 2단계 뒤가 좋습니다.</p>" +
      "<p><strong>4단계</strong> 미적분 — 극한 → 연속 → 미분 → 적분 순서로. 1·2단계를 안 하고 오면 많이 헤맵니다.</p>" +
      "<p style=\"color:var(--ink-3);font-size:14px\">한 번에 다 하려 하지 마세요. 하루 한 단원, 개념 읽고 문제 4~5개면 충분합니다.</p></div>";

    C.forEach(function (co, ci) {
      h += '<button class="card course-card" style="--tone:' + co.tone + '" data-act="unit" data-ci="' + ci + '" data-ui="0">' +
        '<div class="cc-top"><span class="bar"></span><span class="cc-name">' + esc(co.title) +
        '</span><span class="cc-sub">' + esc(co.subtitle) + "</span></div>" +
        '<div class="chip-row">' + co.units.map(function (u, ui) {
          return '<span class="chip"><span class="cdot ' + unitStatus(ci, ui) + '"></span>' + esc(u.title) + "</span>";
        }).join("") + "</div></button>";
    });

    h += '<div class="sec-title">진도 저장</div><div class="card sec"><p style="color:var(--ink-2)">' +
      "이 페이지는 브라우저를 닫으면 진도가 초기화됩니다. 이어서 공부하려면 왼쪽 아래 <strong>내보내기</strong>로 파일을 저장했다가 다음에 <strong>불러오기</strong> 하세요.</p></div>";
    return h;
  }

  /* ---------- unit views ---------- */
  function viewUnit() {
    var co = C[S.ci], u = co.units[S.ui];
    rec(S.ci, S.ui).seen = true;
    var h = '<div style="--tone:' + co.tone + '">';
    h += '<div class="eyebrow" style="--tone:' + co.tone + '">' + esc(co.title) + " · " + esc(co.subtitle) + "</div>";
    h += '<h1 class="unit-title">' + esc(u.title) + "</h1>";
    h += '<div class="tagline" style="--tone:' + co.tone + '">' + mathify(u.tagline) + "</div>";
    h += '<div class="tabs">' +
      ["concept:개념 이해", "example:예제 풀이", "quiz:문제 풀기"].map(function (s) {
        var p = s.split(":");
        return '<button class="tab' + (S.tab === p[0] ? " active" : "") + '" data-act="tab" data-tab="' + p[0] + '">' + p[1] + "</button>";
      }).join("") + "</div>";

    if (S.tab === "concept") h += tabConcept(u, co);
    else if (S.tab === "example") h += tabExample(u);
    else h += tabQuiz();
    h += "</div>";
    return h;
  }

  function tabConcept(u, co) {
    var h = "";
    u.concept.forEach(function (sec, i) {
      h += '<div class="card sec"><h3><span class="n">' + (i + 1) + "</span>" + esc(sec.t) + "</h3>" + paras(sec.b) + "</div>";
    });
    if (u.svg) h += '<div class="card figure">' + u.svg + "</div>";
    if (u.table) {
      h += '<table class="mtable"><thead><tr>' + u.table.head.map(function (x) { return "<th>" + mathify(x) + "</th>"; }).join("") + "</tr></thead><tbody>";
      u.table.rows.forEach(function (r) {
        h += "<tr>" + r.map(function (x, j) { return j === 0 ? "<th>" + mathify(x) + "</th>" : "<td>" + mathify(x) + "</td>"; }).join("") + "</tr>";
      });
      h += "</tbody></table>";
    }
    if (u.formulas && u.formulas.length) {
      h += '<div class="sec-title">꼭 기억할 공식</div><div class="formula-grid">';
      u.formulas.forEach(function (f) {
        h += '<div class="formula"><div class="fname">' + mathify(f.n) + '</div><div class="fbody">' + mathify(f.f) + "</div></div>";
      });
      h += "</div>";
    }
    if (u.mistake) h += '<div class="callout"><div class="lab">⚠ 자주 하는 실수</div>' + paras(u.mistake) + "</div>";
    h += '<div class="qbar"><button class="btn" data-act="tab" data-tab="example">예제로 넘어가기 →</button>' +
         '<button class="btn ghost" data-act="tab" data-tab="quiz">바로 문제 풀기</button></div>';
    return h;
  }

  function tabExample(u) {
    var e = u.example;
    if (!e) return '<div class="card empty">이 단원에는 예제가 없습니다.</div>';
    var h = '<div class="card ex-q">' + mathify(e.q) + "</div>";
    e.steps.forEach(function (st, i) {
      h += '<div class="step"><span class="sn">' + (i + 1) + "</span><span>" + mathify(st) + "</span></div>";
    });
    h += '<div class="ans-box" style="margin-top:14px"><div class="lab">답</div>' + mathify(e.a) + "</div>";
    h += '<div class="qbar"><button class="btn" data-act="tab" data-tab="quiz">문제 풀러 가기 →</button>' +
         '<button class="btn ghost" data-act="tab" data-tab="concept">개념 다시 보기</button></div>';
    return h;
  }

  /* ---------- quiz engine ---------- */
  function shuffled(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function startQuiz(items, mode) {
    S.q = { items: items, i: 0, sel: null, hints: 0, checked: false, marks: [], mode: mode,
            ords: items.map(function (it) { return shuffled(C[it.ci].units[it.ui].quiz[it.qi].c.length); }) };
  }
  function ensureUnitQuiz() {
    var u = C[S.ci].units[S.ui];
    if (!S.q || S.q.mode !== "unit" || S.q.uKey !== key(S.ci, S.ui)) {
      var items = u.quiz.map(function (_, qi) { return { ci: S.ci, ui: S.ui, qi: qi }; });
      startQuiz(items, "unit");
      S.q.uKey = key(S.ci, S.ui);
    }
  }
  function tabQuiz() { ensureUnitQuiz(); return quizHTML(); }

  function quizHTML() {
    var q = S.q;
    if (!q || !q.items.length) return '<div class="card empty">풀 문제가 없습니다.</div>';
    if (q.i >= q.items.length) return resultHTML();

    var it = q.items[q.i];
    var Q = C[it.ci].units[it.ui].quiz[it.qi];
    var h = "";

    h += '<div class="qhead"><span class="qcount">문제 ' + (q.i + 1) + " / " + q.items.length + '</span><span class="qdots">' +
      q.items.map(function (_, i) {
        var cls = i === q.i ? "cur" : (q.marks[i] === true ? "ok" : (q.marks[i] === false ? "no" : ""));
        return "<i class='" + cls + "'></i>";
      }).join("") + "</span></div>";

    if (q.mode === "review") {
      h += '<div class="qcount" style="margin-bottom:10px">' + esc(C[it.ci].title) + " · " + esc(C[it.ci].units[it.ui].title) + "</div>";
    }

    var ord = q.ords[q.i];
    h += '<div class="card qbox"><div class="qtext">' + mathify(Q.q) + "</div>";
    h += '<div class="choices">';
    ord.forEach(function (orig, pos) {
      var cls = "choice";
      if (!q.checked && q.sel === orig) cls += " sel";
      if (q.checked) {
        if (orig === Q.a) cls += " ok";
        else if (orig === q.sel) cls += " no";
      }
      h += '<button class="' + cls + '" data-act="pick" data-i="' + orig + '"' + (q.checked ? " disabled" : "") + '>' +
        '<span class="lb">' + LETTERS[pos] + "</span><span>" + mathify(Q.c[orig]) + "</span></button>";
    });
    h += "</div>";

    for (var k = 0; k < q.hints && k < Q.h.length; k++) {
      h += '<div class="hintbox"><div class="lab">💡 힌트 ' + (k + 1) + "</div>" + mathify(Q.h[k]) + "</div>";
    }

    h += '<div class="qbar">';
    if (!q.checked) {
      if (q.hints < Q.h.length) {
        h += '<button class="btn warm" data-act="hint">💡 ' + (q.hints === 0 ? "힌트 보기" : "힌트 하나 더") + "</button>";
      }
      h += '<button class="btn" data-act="check"' + (q.sel === null ? " disabled" : "") + ">정답 확인</button>";
      if (q.sel === null) h += '<span style="font-size:13px;color:var(--ink-3)">보기를 하나 고르세요</span>';
    } else {
      h += '<button class="btn" data-act="next">' + (q.i === q.items.length - 1 ? "결과 보기 →" : "다음 문제 →") + "</button>";
      if (q.mode === "unit") h += '<button class="btn ghost" data-act="tab" data-tab="concept">개념 다시 보기</button>';
    }
    h += "</div></div>";

    if (q.checked) {
      var ok = q.sel === Q.a;
      h += '<div class="verdict ' + (ok ? "ok" : "no") + '"><div class="vt">' +
        (ok ? "✓ 정답입니다" : "✗ 정답은 " + LETTERS[ord.indexOf(Q.a)] + " 입니다") + "</div>" +
        '<div class="sol">' + mathify(Q.s) + "</div></div>";
    }
    return h;
  }

  function resultHTML() {
    var q = S.q;
    var c = q.marks.filter(function (m) { return m === true; }).length;
    var t = q.items.length;
    var pct = Math.round(c / t * 100);
    var msg = pct === 100 ? "완벽합니다. 다음 단원으로 넘어가도 좋습니다."
      : pct >= 60 ? "좋습니다. 틀린 문제의 해설만 다시 읽고 넘어가세요."
      : "괜찮습니다. 개념을 한 번 더 읽고 다시 풀면 확실히 올라갑니다.";
    var h = '<div class="card result"><div class="score">' + c + '<small> / ' + t + "</small></div>" +
      '<div class="msg">' + msg + "</div><div class=\"row\">";
    h += '<button class="btn" data-act="retry">다시 풀기</button>';
    if (q.mode === "unit") {
      h += '<button class="btn ghost" data-act="tab" data-tab="concept">개념 다시 보기</button>';
      var nx = nextUnit(S.ci, S.ui);
      if (nx) h += '<button class="btn ghost" data-act="unit" data-ci="' + nx[0] + '" data-ui="' + nx[1] + '">다음 단원 →</button>';
    } else {
      h += '<button class="btn ghost" data-act="home">학습 홈</button>';
    }
    h += "</div></div>";
    return h;
  }

  function nextUnit(ci, ui) {
    if (ui + 1 < C[ci].units.length) return [ci, ui + 1];
    if (ci + 1 < C.length) return [ci + 1, 0];
    return null;
  }

  /* ---------- review ---------- */
  function viewReview() {
    var empty = '<h1 class="unit-title">오답노트</h1><div class="card empty">' +
      "지금은 다시 풀 문제가 없습니다.<br>문제를 풀다가 틀리면 그 문제만 여기에 모입니다." +
      '<div class="row" style="margin-top:18px"><button class="btn ghost" data-act="home">학습 홈으로</button></div></div>';
    if (!S.q || S.q.mode !== "review") {
      var items = wrongItems();
      if (!items.length) return empty;
      startQuiz(items, "review");
    }
    if (!S.q.items.length) return empty;
    var left = wrongItems().length;
    var h = '<h1 class="unit-title">오답노트</h1>' +
      '<div class="tagline">이번에 다시 푸는 문제 ' + S.q.items.length + "개" +
      (left !== S.q.items.length ? " · 아직 남은 오답 " + left + "개" : "") +
      ". 맞히면 목록에서 사라집니다.</div>";
    h += quizHTML();
    return h;
  }

  /* ---------- render ---------- */
  function render() {
    var el = document.getElementById("view");
    if (S.view === "home") el.innerHTML = viewHome();
    else if (S.view === "review") el.innerHTML = viewReview();
    else el.innerHTML = viewUnit();
    renderSidebar();
    renderTop();
  }

  /* ---------- actions ---------- */
  function go(ci, ui) {
    S.view = "unit"; S.ci = ci; S.ui = ui; S.tab = "concept"; S.q = null;
    rec(ci, ui).seen = true;
    document.body.classList.remove("nav-open");
    window.scrollTo({ top: 0, behavior: "auto" });
    render();
  }

  function commitResult() {
    var q = S.q;
    if (q.mode !== "unit") return;
    var c = q.marks.filter(function (m) { return m === true; }).length;
    var r = rec(S.ci, S.ui);
    if (c >= r.c || r.t === 0) { r.c = c; r.t = q.items.length; }
  }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");

    if (act === "home") { S.view = "home"; S.q = null; document.body.classList.remove("nav-open"); window.scrollTo(0, 0); render(); return; }
    if (act === "review") { S.view = "review"; S.q = null; document.body.classList.remove("nav-open"); window.scrollTo(0, 0); render(); return; }
    if (act === "unit") { go(+el.getAttribute("data-ci"), +el.getAttribute("data-ui")); return; }
    if (act === "tab") {
      S.tab = el.getAttribute("data-tab");
      if (S.view !== "unit") S.view = "unit";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (act === "pick") { if (!S.q.checked) { S.q.sel = +el.getAttribute("data-i"); render(); } return; }
    if (act === "hint") { S.q.hints++; render(); return; }
    if (act === "check") {
      var q = S.q; if (q.sel === null || q.checked) return;
      var it = q.items[q.i];
      var Q = C[it.ci].units[it.ui].quiz[it.qi];
      var ok = q.sel === Q.a;
      q.checked = true; q.marks[q.i] = ok;
      var k = key(it.ci, it.ui);
      if (!S.wrong[k]) S.wrong[k] = [];
      if (!ok) { if (S.wrong[k].indexOf(it.qi) < 0) S.wrong[k].push(it.qi); }
      else { S.wrong[k] = S.wrong[k].filter(function (x) { return x !== it.qi; }); if (!S.wrong[k].length) delete S.wrong[k]; }
      render();
      return;
    }
    if (act === "next") {
      S.q.i++; S.q.sel = null; S.q.hints = 0; S.q.checked = false;
      if (S.q.i >= S.q.items.length) commitResult();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (act === "retry") {
      if (S.q.mode === "unit") { S.q = null; ensureUnitQuiz(); }
      else { startQuiz(wrongItems(), "review"); }
      render(); window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (act === "theme") {
      var r = document.documentElement;
      r.setAttribute("data-theme", r.getAttribute("data-theme") === "dark" ? "light" : "dark");
      el.textContent = r.getAttribute("data-theme") === "dark" ? "☀ 밝게" : "🌙 어둡게";
      return;
    }
    if (act === "reset") {
      if (confirm("진도와 오답노트를 모두 지울까요?")) { S.progress = {}; S.wrong = {}; S.q = null; render(); }
      return;
    }
    if (act === "export") {
      var blob = new Blob([JSON.stringify({ v: 1, progress: S.progress, wrong: S.wrong }, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "수학진도.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
      return;
    }
    if (act === "import") { document.getElementById("fileIn").click(); return; }
    if (act === "menu") { document.body.classList.toggle("nav-open"); return; }
    if (act === "scrim") { document.body.classList.remove("nav-open"); return; }
  });

  document.getElementById("fileIn").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var d = JSON.parse(fr.result);
        S.progress = d.progress || {}; S.wrong = d.wrong || {}; S.q = null;
        render();
        alert("진도를 불러왔습니다.");
      } catch (err) { alert("파일을 읽을 수 없습니다."); }
    };
    fr.readAsText(f);
    e.target.value = "";
  });

  document.getElementById("search").addEventListener("input", function (e) {
    S.filter = e.target.value; renderSidebar();
  });

  document.addEventListener("keydown", function (e) {
    if (S.view === "home" || !S.q || S.q.i >= S.q.items.length) return;
    if (e.target.tagName === "INPUT") return;
    if (e.key >= "1" && e.key <= "6") {
      var ord = S.q.ords[S.q.i];
      var pos = +e.key - 1;
      if (pos < ord.length && !S.q.checked) { S.q.sel = ord[pos]; render(); }
    } else if (e.key === "Enter") {
      var btn = document.querySelector('[data-act="check"]:not([disabled])') || document.querySelector('[data-act="next"]');
      if (btn) btn.click();
    }
  });

  render();
})();
</script>
</body>
</html>
